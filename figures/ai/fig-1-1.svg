.n-acc { fill: #f5e9f6; stroke: #7b2d84; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #7b2d84; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #7b2d84; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #7b2d84; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="320" fill="#ffffff"/>
      <rect class="n" x="16" y="20" width="110" height="52" rx="5"/><text class="tb" x="71" y="42" text-anchor="middle">edge, proxy</text><text class="ts" x="71" y="60" text-anchor="middle">TLS, routing</text>
      <rect class="n" x="146" y="20" width="110" height="52" rx="5"/><text class="tb" x="201" y="42" text-anchor="middle">sign-in</text><text class="ts" x="201" y="60" text-anchor="middle">session, roles</text>
      <rect class="n" x="276" y="20" width="110" height="52" rx="5"/><text class="tb" x="331" y="42" text-anchor="middle">rate limit</text><text class="ts" x="331" y="60" text-anchor="middle">off switch</text>
      <rect class="n" x="406" y="20" width="130" height="52" rx="5"/><text class="tb" x="471" y="42" text-anchor="middle">visibility query</text><text class="ts" x="471" y="60" text-anchor="middle">only what you may read</text>
      <rect class="n-acc" x="556" y="20" width="110" height="52" rx="5"/><text class="tb" x="611" y="42" text-anchor="middle">retrieval</text><text class="ts" x="611" y="60" text-anchor="middle">runbook sections</text>
      <rect class="n-acc" x="686" y="20" width="118" height="52" rx="5"/><text class="tb" x="745" y="42" text-anchor="middle">redaction</text><text class="ts" x="745" y="60" text-anchor="middle">credentials out</text>
      <line class="e" x1="127" y1="46" x2="144" y2="46" marker-end="url(#a)"/><line class="e" x1="257" y1="46" x2="274" y2="46" marker-end="url(#a)"/><line class="e" x1="387" y1="46" x2="404" y2="46" marker-end="url(#a)"/><line class="e" x1="537" y1="46" x2="554" y2="46" marker-end="url(#a)"/><line class="e" x1="667" y1="46" x2="684" y2="46" marker-end="url(#a)"/>
      <rect class="n-acc" x="556" y="110" width="248" height="52" rx="5"/><text class="tb" x="568" y="132">the prompt</text><text class="ts" x="568" y="150">instructions + the asker's context</text>
      <rect class="n-acc" x="296" y="110" width="220" height="52" rx="5"/><text class="tb" x="308" y="132">the model seam</text><text class="ts" x="308" y="150">any OpenAI-compatible endpoint</text>
      <rect class="n" x="16" y="110" width="240" height="52" rx="5"/><text class="tb" x="28" y="132">streaming to the browser</text><text class="ts" x="28" y="150">heartbeats, Stop cancels the call</text>
      <line class="e" x1="745" y1="73" x2="745" y2="108" marker-end="url(#a)"/><line class="e" x1="555" y1="136" x2="518" y2="136" marker-end="url(#a)"/><line class="e" x1="295" y1="136" x2="258" y2="136" marker-end="url(#a)"/>
      <rect class="n" x="16" y="190" width="788" height="44" rx="5"/><text class="ts" x="28" y="216"><tspan class="tb">Around every step:</tspan> the audit trail (what the model was given, by hash), metrics, logs and traces with ids and counts, never content</text>
      <rect class="n-acc" x="16" y="250" width="788" height="44" rx="5"/><text class="ts" x="28" y="276"><tspan class="tb">Before every prompt or model change:</tspan> evals, a pass rate per case over repeated runs, compared with a baseline</text>
      <text class="ts tmu" x="16" y="314">Accent: AI-specific. Outline: the standard platform every service shares.</text>
    </svg>