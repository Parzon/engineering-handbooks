<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" role="img" aria-label="New: non-determinism, so quality is a pass rate measured by evals; untrusted text that can instruct the model, so injection is bounded by architecture; tokens as the unit of cost and latency; retrieval quality as a measurable stage; judges that must be calibrated before being trusted; reasoning models that spend hidden tokens. Familiar skill, applied: a seam over the provider is the adapter pattern; timeouts and cancellation on a slow, metered dependency; streaming over SSE; access control deciding what the model may read; observability with ids and counts but no content; capacity and cost planning; supply chain and data-processing agreements for the provider."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #7b2d84; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #f5e9f6; stroke: #7b2d84; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #7b2d84; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #7b2d84; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #7b2d84; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="330" fill="#ffffff"/>
      <rect class="n-acc" x="16" y="16" width="384" height="300" rx="8"/><text class="tb" x="30" y="40">Genuinely new</text>
      <g class="ts">
      <text x="30" y="70"><tspan class="tb">Non-determinism:</tspan> quality is a pass rate,</text><text x="30" y="86">measured by evals over repeated runs</text>
      <text x="30" y="116"><tspan class="tb">Untrusted text can instruct:</tspan> injection is</text><text x="30" y="132">bounded by architecture, not by the prompt</text>
      <text x="30" y="162"><tspan class="tb">Tokens:</tspan> the unit of cost and latency</text>
      <text x="30" y="192"><tspan class="tb">Retrieval quality:</tspan> a stage you measure</text><text x="30" y="208">on its own, before the prompt</text>
      <text x="30" y="238"><tspan class="tb">Judges:</tspan> a model grading a model, trusted</text><text x="30" y="254">only after calibration</text>
      <text x="30" y="284"><tspan class="tb">Reasoning models:</tspan> hidden tokens that count</text><text x="30" y="300">against limits and cost</text>
      </g>
      <rect class="n" x="420" y="16" width="384" height="300" rx="8"/><text class="tb" x="434" y="40">Familiar skill, applied</text>
      <g class="ts">
      <text x="434" y="70"><tspan class="tb">A seam over the provider:</tspan> the adapter</text><text x="434" y="86">pattern, with a mock for tests</text>
      <text x="434" y="116"><tspan class="tb">Timeouts and cancellation:</tspan> a slow,</text><text x="434" y="132">metered dependency that can hang</text>
      <text x="434" y="162"><tspan class="tb">Streaming:</tspan> Server-Sent Events, heartbeats</text>
      <text x="434" y="192"><tspan class="tb">Access control:</tspan> it decides what the model</text><text x="434" y="208">may read, not only what users may</text>
      <text x="434" y="238"><tspan class="tb">Observability:</tspan> ids, counts and timings;</text><text x="434" y="254">content only by explicit choice</text>
      <text x="434" y="284"><tspan class="tb">Supply chain and contracts:</tspan> the provider</text><text x="434" y="300">is a processor of your data</text>
      </g>
    </svg>