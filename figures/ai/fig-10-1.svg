<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 270" role="img" aria-label="Cost equals requests times tokens per request times price per token. Tokens split into input, the prompt, and output, the answer plus hidden reasoning, priced five to eight times higher. Then the costs that are not tokens: embeddings for every question and every saved section; the vector store and storage; the observability stack; GPU hours when self-hosting, busy or idle; and the people who run it. Measured per question in the reference service: 1,318 prompt tokens and 172 answer tokens at the median. On Claude Haiku 4.5, the prompt is 1.32 dollars of the 2.16 dollars per 1,000 questions."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #7b2d84; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
