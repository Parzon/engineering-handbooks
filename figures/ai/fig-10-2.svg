  </defs><rect width="820" height="200" fill="#ffffff"/>
      <text class="tl" x="16" y="22">300 PEOPLE × 5 QUESTIONS A WORKING DAY = 33,000 A MONTH</text>
      <line class="rule" x1="170" y1="34" x2="170" y2="140"/>
      <text class="ts" x="16" y="56">GPT-5 mini</text><rect class="fill-good" x="170" y="44" width="62" height="18"/><text class="ts" x="240" y="58">$0.67 per 1,000 · ~$22 a month</text>
      <text class="ts" x="16" y="92">Claude Haiku 4.5</text><rect class="fill-acc" x="170" y="80" width="200" height="18"/><text class="ts" x="378" y="94">$2.16 · ~$71 a month</text>
      <text class="ts" x="16" y="128">Claude Sonnet 5</text><rect class="fill-acc" x="170" y="116" width="400" height="18"/><text class="ts" x="578" y="130">$4.33 · ~$143 a month</text>
      <text class="ts" x="16" y="170"><tspan class="tb">At this volume the model bill is small:</tspan> one engineer-day costs more than a month of the mid-priced model. It becomes a</text>
      <text class="ts" x="16" y="188">design problem with volume, with agents (many calls per task) and with long contexts.</text>
