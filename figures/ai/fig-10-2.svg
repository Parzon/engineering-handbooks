<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 200" role="img" aria-label="Per 1,000 questions and per month at 33,000 questions: GPT-5 mini 0.67 dollars, about 22 dollars a month; Claude Haiku 4.5 2.16 dollars, about 71; Claude Sonnet 5 4.33 dollars, about 143. At that volume, one engineer-day costs more than a month of the model."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
