<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" role="img" aria-label="Levers and whether they apply to the reference service. Context size: yes, the biggest; fewer alerts saves tokens and can lose the deploy that started an incident; measure with evals. Output cap and reasoning effort: yes; high effort billed 4.1 times the answer tokens and left 13 of 22 questions unanswered. A smaller model: the biggest price lever, from 4.33 to 0.67 dollars per 1,000, only with evals. Provider prompt caching: no; the stable part is about 400 tokens, under the 1,024-token minimum, and alerts change with every new alert. Semantic caching of answers: wrong here; the closest pair of benchmark questions needed different answers, and answers depend on live alerts and on who asks. Batch APIs: half price for work that can wait, not interactive chat. Self-hosting: only when the GPU stays busy."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #7b2d84; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
