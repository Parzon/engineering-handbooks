.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="340" fill="#ffffff"/>
      <g class="ts">
      <text x="16" y="22" class="tl">LEVER</text><text x="250" y="22" class="tl">HERE</text>
      <line class="rule" x1="16" y1="30" x2="804" y2="30"/>
      <rect class="n-good" x="16" y="40" width="220" height="30" rx="4"/><text x="28" y="60" class="tb">context size</text><text x="250" y="60">the biggest: fewer alerts and sections; can lose the deploy that started it</text>
      <rect class="n-good" x="16" y="78" width="220" height="30" rx="4"/><text x="28" y="98" class="tb">output cap, reasoning</text><text x="250" y="98">high effort: 4.1× the answer tokens, and 13 of 22 questions unanswered</text>
      <rect class="n-good" x="16" y="116" width="220" height="30" rx="4"/><text x="28" y="136" class="tb">a smaller model</text><text x="250" y="136">the biggest price lever ($4.33 to $0.67 per 1,000), only with evals</text>
      <rect class="n-bad" x="16" y="154" width="220" height="30" rx="4"/><text x="28" y="174" class="tb">prompt caching</text><text x="250" y="174">no: the stable part is ~400 tokens, under the 1,024 minimum</text>
      <rect class="n-bad" x="16" y="192" width="220" height="30" rx="4"/><text x="28" y="212" class="tb">semantic answer cache</text><text x="250" y="212">wrong: answers depend on live alerts and on who asks</text>
      <rect class="n-soft" x="16" y="230" width="220" height="30" rx="4"/><text x="28" y="250" class="tb">batch APIs</text><text x="250" y="250">half price for work that can wait: re-embedding, nightly summaries</text>
      <rect class="n-soft" x="16" y="268" width="220" height="30" rx="4"/><text x="28" y="288" class="tb">self-hosting</text><text x="250" y="288">only when busy: 60× the small hosted model at this volume</text>
      <rect class="n-soft" x="16" y="306" width="220" height="30" rx="4"/><text x="28" y="326" class="tb">token budgets</text><text x="250" y="326">per user or team: bound a runaway client in tokens, not just requests</text>
      </g>
    </svg>