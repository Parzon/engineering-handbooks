.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="260" fill="#ffffff"/>
      <text class="tl" x="16" y="22">THE BILL DOUBLED: REASONING EFFORT RAISED FROM LOW TO HIGH</text>
      <g class="ts">
      <text x="16" y="52">requests</text><text x="250" y="52" class="tg">unchanged</text>
      <text x="16" y="78">prompt tokens per request</text><text x="250" y="78" class="tg">unchanged</text>
      <text x="16" y="104">answer tokens per request</text><text x="250" y="104" class="tb tr">168 → 694 (4.1×)</text>
      <text x="16" y="130">empty answers</text><text x="250" y="130" class="tb tr">0 → 13 of 22</text>
      <text x="16" y="156">per 1,000 questions</text><text x="250" y="156" class="tb tr">$2.16 → $4.79</text>
      </g>
      <rect class="n-warn" x="470" y="36" width="334" height="128" rx="6"/><text class="tb" x="482" y="60">A volume alert stays silent</text><text class="ts" x="482" y="82">requests and prompt tokens did not move;</text><text class="ts" x="482" y="98">only tokens per answer and empty answers</text><text class="ts" x="482" y="114">did. Alert on each factor, against last week.</text><text class="ts" x="482" y="146">The empty answers were billed too.</text>
      <text class="tl" x="16" y="196">THE METHOD</text>
      <rect class="n" x="16" y="206" width="250" height="40" rx="5"/><text class="ts" x="28" y="230"><tspan class="tb">1</tspan> which factor moved?</text>
      <rect class="n" x="285" y="206" width="250" height="40" rx="5"/><text class="ts" x="297" y="230"><tspan class="tb">2</tspan> what changed in it? (versions)</text>
      <rect class="n-good" x="554" y="206" width="250" height="40" rx="5"/><text class="ts" x="566" y="230"><tspan class="tb">3</tspan> revert, cap, then optimize</text>
      <line class="e" x1="267" y1="226" x2="283" y2="226" marker-end="url(#a)"/><line class="e" x1="536" y1="226" x2="552" y2="226" marker-end="url(#a)"/>
