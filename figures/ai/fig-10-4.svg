<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" role="img" aria-label="A drill: reasoning effort raised from low to high. Requests did not move. Prompt tokens per request did not move. Answer tokens per request rose from 168 to 694, 4.1 times. Empty-answer failures went from none to 13 of 22. Cost per 1,000 on Claude Haiku 4.5 rose from 2.16 to 4.79 dollars. A cost alert on request volume stays silent. Method: which factor moved, what changed in it, then the lowest-risk fix: revert, cap, then optimize with evals."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
