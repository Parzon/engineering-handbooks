<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 290" role="img" aria-label="The request enqueues a job and returns 202 with a job id. The queue gives each claimed job a lease, hidden for N seconds; if its worker dies, the lease expires and another worker takes it; long jobs extend the lease with a heartbeat. Workers call the model through a circuit breaker and write an idempotent, versioned effect. After N attempts a job goes to the dead-letter queue with its last error, where a person fixes the cause and redrives it. Alert on the age of the oldest job and on anything in the dead-letter queue. In Postgres, SELECT FOR UPDATE SKIP LOCKED lets workers claim different rows without blocking; the job can be committed with its data in one transaction, the outbox pattern."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #7b2d84; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #f5e9f6; stroke: #7b2d84; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #7b2d84; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #7b2d84; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #7b2d84; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="290" fill="#ffffff"/>
      <rect class="n" x="16" y="40" width="120" height="70" rx="6"/><text class="tb" x="28" y="64">request</text><text class="ts" x="28" y="84">enqueue, return</text><text class="ts" x="28" y="100">202 + job id</text>
      <rect class="n-acc" x="166" y="20" width="200" height="110" rx="6"/><text class="tb" x="178" y="44">queue</text><text class="ts" x="178" y="66">a claimed job is leased:</text><text class="ts" x="178" y="82">hidden for N seconds</text><text class="ts" x="178" y="102">worker dies → lease expires</text><text class="ts" x="178" y="118">→ another worker takes it</text>
      <rect class="n" x="396" y="20" width="170" height="110" rx="6"/><text class="tb" x="408" y="44">workers</text><text class="ts" x="408" y="66">heartbeat extends</text><text class="ts" x="408" y="82">the lease on long jobs</text><text class="ts" x="408" y="102">bounded concurrency</text>
      <rect class="n-warn" x="596" y="20" width="208" height="50" rx="6"/><text class="tb" x="608" y="42">circuit breaker</text><text class="ts" x="608" y="60">then the model provider</text>
      <rect class="n-good" x="596" y="80" width="208" height="50" rx="6"/><text class="tb" x="608" y="102">idempotent effect</text><text class="ts" x="608" y="120">versioned write</text>
      <line class="e" x1="137" y1="75" x2="164" y2="75" marker-end="url(#a)"/><line class="e" x1="367" y1="75" x2="394" y2="75" marker-end="url(#a)"/><line class="e" x1="567" y1="45" x2="594" y2="45" marker-end="url(#a)"/><line class="e" x1="567" y1="105" x2="594" y2="105" marker-end="url(#a)"/>
      <rect class="n-bad" x="396" y="160" width="408" height="56" rx="6"/><text class="tb" x="408" y="182">dead-letter queue</text><text class="ts" x="408" y="202">after N attempts, with the last error; a person fixes and redrives</text>
      <path class="e-bad" d="M481,131 L481,158" marker-end="url(#a-bad)"/>
      <text class="ts" x="16" y="160"><tspan class="tb">Alert on</tspan> the age of the</text><text class="ts" x="16" y="176">oldest job (what users wait)</text><text class="ts" x="16" y="192">and on anything dead-lettered</text>
      <text class="ts" x="16" y="248"><tspan class="tb">In Postgres:</tspan> SELECT ... FOR UPDATE SKIP LOCKED lets workers claim different rows without blocking, and the job commits</text>
      <text class="ts" x="16" y="266">with its data in one transaction (the outbox). A broker for high volume, fan-out or replay; a workflow engine for long agent jobs.</text>
    </svg>