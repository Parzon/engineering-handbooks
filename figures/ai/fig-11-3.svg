<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" role="img" aria-label="Retries: only what can succeed, timeouts, 429 and 5xx, never a 400; honor Retry-After; capped exponential backoff with full jitter, sleep a random time between zero and the smaller of the cap and base times two to the attempt; without jitter, clients that failed together retry together. Retry at one layer: three layers of three retries make 27 calls. A circuit breaker: closed, calls pass; after N consecutive failures it opens and stops calling for a cooldown; half-open lets one trial through; success closes it. Pair it with a fallback: keyword search, a smaller model, or 'the assistant is unavailable'."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #7b2d84; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #f5e9f6; stroke: #7b2d84; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #7b2d84; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #7b2d84; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #7b2d84; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="300" fill="#ffffff"/>
      <rect class="n" x="16" y="16" width="384" height="150" rx="6"/><text class="tb" x="28" y="40">Retries</text>
      <g class="ts"><text x="28" y="62">only what can succeed: timeouts, 429, 5xx</text><text x="28" y="80">honor Retry-After; never retry a 400</text><text x="28" y="104" class="tb">sleep = random(0, min(cap, base × 2^n))</text><text x="28" y="126">no jitter: clients that failed together</text><text x="28" y="142">retry together, a thundering herd</text><text x="28" y="160" class="tr">3 layers × 3 retries = 27 calls</text></g>
      <rect class="n" x="420" y="16" width="384" height="150" rx="6"/><text class="tb" x="432" y="40">Circuit breaker</text>
      <circle class="dot-good" cx="470" cy="100" r="22"/><text class="ts" x="470" y="70" text-anchor="middle">closed</text>
      <circle class="dot-bad" cx="612" cy="100" r="22"/><text class="ts" x="612" y="70" text-anchor="middle">open</text>
      <circle class="dot-muted" cx="754" cy="100" r="22"/><text class="ts" x="754" y="70" text-anchor="middle">half-open</text>
      <path class="e" d="M494,100 L586,100" marker-end="url(#a)"/><text class="ts" x="540" y="92" text-anchor="middle">N failures</text>
      <path class="e" d="M636,100 L728,100" marker-end="url(#a)"/><text class="ts" x="682" y="92" text-anchor="middle">cooldown</text>
      <path class="e-good" d="M754,124 C754,160 470,160 470,126" marker-end="url(#a-good)"/><text class="ts" x="612" y="142" text-anchor="middle">one trial succeeds</text>
      <rect class="n-warn" x="16" y="186" width="788" height="96" rx="6"/><text class="tb" x="28" y="210">Bulkheads: separate pools, so one workload cannot starve another</text>
      <text class="ts" x="28" y="232">A bulk re-index and the chat's question embeddings share one embedding server. Unbounded, the re-index pushes the chat's</text>
      <text class="ts" x="28" y="250">embeddings past their timeout, and the chat silently degrades to keyword search. Fixes: separate concurrency limits or queues,</text>
      <text class="ts" x="28" y="268">priority for interactive traffic, or separate deployments.</text>
    </svg>