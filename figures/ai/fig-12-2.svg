<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 280" role="img" aria-label="Changing the model or provider, in order. Point the settings at the candidate. Calibrate the judge on this suite. Run the suite with the judge and ten repeats, the leak case two hundred times, and the api target once. Compare pass rates and the failing answers, latency, and tokens per call times price. Commit the new baseline with the switch. Ship behind a canary or a feature flag, comparing the model metrics by model label. Keep the old configuration for an instant switch back."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #7b2d84; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #f5e9f6; stroke: #7b2d84; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #7b2d84; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #7b2d84; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #7b2d84; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="280" fill="#ffffff"/>
      <g class="ts">
      <rect class="n" x="16" y="20" width="180" height="70" rx="6"/><text x="28" y="44" class="tb">1 Point at it</text><text x="28" y="64">model settings, effort</text><text x="28" y="80">for a reasoning model</text>
      <rect class="n" x="216" y="20" width="180" height="70" rx="6"/><text x="228" y="44" class="tb">2 Calibrate the judge</text><text x="228" y="64">on this suite, before</text><text x="228" y="80">trusting its verdicts</text>
      <rect class="n-acc" x="416" y="20" width="180" height="70" rx="6"/><text x="428" y="44" class="tb">3 Run the suite</text><text x="428" y="64">10 repeats; the leak</text><text x="428" y="80">case 200; api target</text>
      <rect class="n" x="616" y="20" width="188" height="70" rx="6"/><text x="628" y="44" class="tb">4 Compare</text><text x="628" y="64">pass rates and answers,</text><text x="628" y="80">latency, tokens × price</text>
      <rect class="n-good" x="416" y="120" width="180" height="70" rx="6"/><text x="428" y="144" class="tb">5 New baseline</text><text x="428" y="164">committed with the</text><text x="428" y="180">switch, in one change</text>
      <rect class="n-warn" x="616" y="120" width="188" height="70" rx="6"/><text x="628" y="144" class="tb">6 Ship gradually</text><text x="628" y="164">a flag or a canary;</text><text x="628" y="180">metrics by model label</text>
      </g>
      <g class="e"><line x1="197" y1="55" x2="214" y2="55" marker-end="url(#a)"/><line x1="397" y1="55" x2="414" y2="55" marker-end="url(#a)"/><line x1="597" y1="55" x2="614" y2="55" marker-end="url(#a)"/><path d="M710,91 C710,106 506,104 506,118" marker-end="url(#a)"/><line x1="597" y1="155" x2="614" y2="155" marker-end="url(#a)"/></g>
      <text class="ts" x="16" y="134"><tspan class="tb">Flag:</tspan> ship dark, enable per tenant or</text><text class="ts" x="16" y="150">percentage, disable without a deploy.</text>
      <text class="ts" x="16" y="174"><tspan class="tb">Canary:</tspan> a small share of traffic on</text><text class="ts" x="16" y="190">the new version, widened in steps.</text>
      <text class="ts" x="16" y="226"><tspan class="tb">Re-embedding is a data migration:</tspan> build the new index beside the old, evaluate retrieval on it, then switch, keeping the old</text>
      <text class="ts" x="16" y="244">one for a switch back (blue/green for the index). Until then, the reference service finds sections stored under an old</text>
      <text class="ts" x="16" y="262">embedding key by keyword only, and reports that mode.</text>
    </svg>