<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 230" role="img" aria-label="Rollbacks by kind of change, decided before shipping and practiced. Code: redeploy the previous tag. Prompt or model: switch the version back in configuration. A feature: its flag, or the assistant's off switch. The index: switch back to the old one. A schema: do not roll back; fix forward, since rollbacks roll back the code, never the schema."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #7b2d84; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #f5e9f6; stroke: #7b2d84; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #7b2d84; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #7b2d84; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #7b2d84; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="230" fill="#ffffff"/>
      <g class="ts">
      <rect class="n" x="16" y="20" width="150" height="90" rx="6"/><text x="28" y="44" class="tb">code</text><text x="28" y="66">redeploy the</text><text x="28" y="82">previous tag</text>
      <rect class="n-acc" x="178" y="20" width="150" height="90" rx="6"/><text x="190" y="44" class="tb">prompt, model</text><text x="190" y="66">switch the version</text><text x="190" y="82">back in configuration</text>
      <rect class="n-warn" x="340" y="20" width="150" height="90" rx="6"/><text x="352" y="44" class="tb">a feature</text><text x="352" y="66">its flag; for the AI</text><text x="352" y="82">itself, the off switch</text>
      <rect class="n" x="502" y="20" width="150" height="90" rx="6"/><text x="514" y="44" class="tb">the index</text><text x="514" y="66">switch back to the</text><text x="514" y="82">old one, kept beside</text>
      <rect class="n-bad" x="664" y="20" width="140" height="90" rx="6"/><text x="676" y="44" class="tb">a schema</text><text x="676" y="66">don't: fix forward;</text><text x="676" y="82">code rolls back alone</text>
      </g>
      <text class="ts" x="16" y="146"><tspan class="tb">An AI incident can show no errors at all.</tspan> Detect it with quality indicators and user reports; triage by what changed (a</text>
      <text class="ts" x="16" y="166">deploy, a prompt, the provider's model, the data, the index); mitigate with the flag, the off switch or a rollback; then add the</text>
      <text class="ts" x="16" y="186">failure to the eval set so it cannot come back unnoticed.</text>
      <text class="ts tmu" x="16" y="214">Schema rollbacks and the deploy ladder: Handbook 3, Chapter 13. The off switch: Handbook 2, Chapter 17.</text>
    </svg>