.n-acc { fill: #f5e9f6; stroke: #7b2d84; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #7b2d84; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #7b2d84; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #7b2d84; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="300" fill="#ffffff"/>
      <g class="ts">
      <rect class="n" x="16" y="16" width="250" height="56" rx="5"/><text x="28" y="38" class="tb">1 Requirements</text><text x="28" y="58">targets, and what it must never do</text>
      <rect class="n" x="285" y="16" width="250" height="56" rx="5"/><text x="297" y="38" class="tb">2 Architecture</text><text x="297" y="58">simplest design, data boundaries</text>
      <rect class="n" x="554" y="16" width="250" height="56" rx="5"/><text x="566" y="38" class="tb">3 Implementation</text><text x="566" y="58">behind a flag and one seam</text>
      <rect class="n" x="16" y="84" width="250" height="56" rx="5"/><text x="28" y="106" class="tb">4 Testing</text><text x="28" y="126">against a mock model, in CI</text>
      <rect class="n-acc" x="285" y="84" width="250" height="56" rx="5"/><text x="297" y="106" class="tb">5 Evaluation</text><text x="297" y="126">golden, adversarial, judge, baseline</text>
      <rect class="n-acc" x="554" y="84" width="250" height="56" rx="5"/><text x="566" y="106" class="tb">6 Security</text><text x="566" y="126">access, redaction, tools, audit</text>
      <rect class="n" x="16" y="152" width="250" height="56" rx="5"/><text x="28" y="174" class="tb">7 Deployment</text><text x="28" y="194">pinned versions; canary or flag</text>
      <rect class="n" x="285" y="152" width="250" height="56" rx="5"/><text x="297" y="174" class="tb">8 Observability</text><text x="297" y="194">a trace per answer; tokens, cost</text>
      <rect class="n" x="554" y="152" width="250" height="56" rx="5"/><text x="566" y="174" class="tb">9 Monitoring</text><text x="566" y="194">SLOs, burn rates, quality, cost</text>
      <rect class="n" x="16" y="220" width="250" height="56" rx="5"/><text x="28" y="242" class="tb">10 Incident response</text><text x="28" y="262">runbooks, on-call, a kill switch</text>
      <rect class="n" x="285" y="220" width="250" height="56" rx="5"/><text x="297" y="242" class="tb">11 Rollback</text><text x="297" y="262">one per kind of change, practiced</text>
      <rect class="n-good" x="554" y="220" width="250" height="56" rx="5"/><text x="566" y="242" class="tb">12 Iteration</text><text x="566" y="262">failures become eval cases</text>
