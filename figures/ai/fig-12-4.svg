<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" role="img" aria-label="Twelve steps for an AI feature in production. Requirements: the task, users, measurable targets and what it must never do. Architecture: the simplest design, with data boundaries drawn. Implementation: behind a flag, the model behind one seam. Testing: unit and integration tests against a mock model in CI. Evaluation: golden and adversarial sets, a calibrated judge, a baseline. Security: access control in code, redaction, least-privilege tools, an audit trail. Deployment: pinned model and prompt versions, staging, a canary or flag. Observability: a trace per answer, token and cost metrics, request ids in logs. Monitoring: SLOs with burn-rate alerts, quality and cost indicators. Incident response: runbooks, on-call, a kill switch. Rollback: one per kind of change, practiced. Iteration: production failures become eval cases, and every change goes through the gate."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #7b2d84; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
