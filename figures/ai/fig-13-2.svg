<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 230" role="img" aria-label="How an Iceberg table commits. The catalog holds a pointer to the current metadata file, which records the schema and snapshots; it points to a manifest list, which points to manifests listing data files with per-column statistics, which point to Parquet files. A write creates new data files and new metadata, then atomically swaps the catalog's pointer. Readers see the old version or the new one, never a mix: ACID. Every old pointer is a snapshot, so time travel comes free. Columns are tracked by id, so renames are safe."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #7b2d84; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #f5e9f6; stroke: #7b2d84; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #7b2d84; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #7b2d84; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #7b2d84; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="230" fill="#ffffff"/>
      <g class="ts">
      <rect class="n-acc" x="16" y="30" width="120" height="50" rx="5"/><text x="76" y="52" text-anchor="middle" class="tb">catalog</text><text x="76" y="68" text-anchor="middle">pointer</text>
      <rect class="n" x="166" y="30" width="140" height="50" rx="5"/><text x="236" y="52" text-anchor="middle" class="tb">metadata</text><text x="236" y="68" text-anchor="middle">schema, snapshots</text>
      <rect class="n" x="336" y="30" width="130" height="50" rx="5"/><text x="401" y="52" text-anchor="middle" class="tb">manifest list</text><text x="401" y="68" text-anchor="middle">per snapshot</text>
      <rect class="n" x="496" y="30" width="140" height="50" rx="5"/><text x="566" y="52" text-anchor="middle" class="tb">manifests</text><text x="566" y="68" text-anchor="middle">files + column stats</text>
      <rect class="n-soft" x="666" y="30" width="138" height="50" rx="5"/><text x="735" y="52" text-anchor="middle" class="tb">Parquet files</text><text x="735" y="68" text-anchor="middle">the data</text>
      </g>
      <g class="e"><line x1="137" y1="55" x2="164" y2="55" marker-end="url(#a)"/><line x1="307" y1="55" x2="334" y2="55" marker-end="url(#a)"/><line x1="467" y1="55" x2="494" y2="55" marker-end="url(#a)"/><line x1="637" y1="55" x2="664" y2="55" marker-end="url(#a)"/></g>
      <rect class="n-good" x="16" y="110" width="788" height="100" rx="6"/>
      <text class="tb" x="28" y="134">A write: new files, new metadata, then one atomic swap of the catalog's pointer</text>
      <text class="ts" x="28" y="158">readers see the old version or the new one, never a mix: ACID on plain object storage</text>
      <text class="ts" x="28" y="178">every old pointer is a snapshot: time travel and rollback come free</text>
      <text class="ts" x="28" y="198">columns are tracked by id, so renaming and reordering are safe; engines skip files using the column statistics</text>
    </svg>