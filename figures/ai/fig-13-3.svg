<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 230" role="img" aria-label="A change-data-capture pipeline. Postgres writes every insert, update and delete to its write-ahead log before applying it. Debezium reads the log and publishes one event per change, with the operation and the old and new rows, to Kafka, one topic per table. NiFi or Spark reads the events and writes Iceberg tables on S3, cataloged in Glue. Snowflake, Trino or Spark query them, and dbt builds the analytics tables. Compared with a nightly extract by modified date: little query load on the source, near-real-time, captures deletes, replayable. The cost: Postgres keeps the log for the replication slot until Debezium confirms it."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #7b2d84; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #f5e9f6; stroke: #7b2d84; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #7b2d84; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #7b2d84; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #7b2d84; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="230" fill="#ffffff"/>
      <g class="ts">
      <rect class="n" x="16" y="30" width="110" height="60" rx="5"/><text x="71" y="54" text-anchor="middle" class="tb">Postgres</text><text x="71" y="72" text-anchor="middle">write-ahead log</text>
      <rect class="n" x="146" y="30" width="110" height="60" rx="5"/><text x="201" y="54" text-anchor="middle" class="tb">Debezium</text><text x="201" y="72" text-anchor="middle">one event/change</text>
      <rect class="n-warn" x="276" y="30" width="110" height="60" rx="5"/><text x="331" y="54" text-anchor="middle" class="tb">Kafka</text><text x="331" y="72" text-anchor="middle">topic per table</text>
      <rect class="n" x="406" y="30" width="110" height="60" rx="5"/><text x="461" y="54" text-anchor="middle" class="tb">NiFi, Spark</text><text x="461" y="72" text-anchor="middle">write tables</text>
      <rect class="n-acc" x="536" y="30" width="130" height="60" rx="5"/><text x="601" y="54" text-anchor="middle" class="tb">Iceberg on S3</text><text x="601" y="72" text-anchor="middle">cataloged</text>
      <rect class="n-good" x="686" y="30" width="118" height="60" rx="5"/><text x="745" y="54" text-anchor="middle" class="tb">engines, dbt</text><text x="745" y="72" text-anchor="middle">gold tables</text>
      </g>
      <g class="e"><line x1="127" y1="60" x2="144" y2="60" marker-end="url(#a)"/><line x1="257" y1="60" x2="274" y2="60" marker-end="url(#a)"/><line x1="387" y1="60" x2="404" y2="60" marker-end="url(#a)"/><line x1="517" y1="60" x2="534" y2="60" marker-end="url(#a)"/><line x1="667" y1="60" x2="684" y2="60" marker-end="url(#a)"/></g>
      <rect class="n-soft" x="16" y="118" width="384" height="94" rx="6"/><text class="tb" x="28" y="140">Kafka</text><text class="ts" x="28" y="162">topics split into partitions, replicated across</text><text class="ts" x="28" y="178">brokers; consumers read at their own offset;</text><text class="ts" x="28" y="194">messages kept for replay, not deleted on read</text>
      <rect class="n-soft" x="420" y="118" width="384" height="94" rx="6"/><text class="tb" x="432" y="140">NiFi</text><text class="ts" x="432" y="162">processors joined by queues with backpressure;</text><text class="ts" x="432" y="178">provenance for every record; written to disk</text><text class="ts" x="432" y="194">before acknowledged; moves, not analyzes</text>
    </svg>