<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" role="img" aria-label="Classic SQL Server warehousing mapped to the lakehouse. Source OLTP stays the same. An SSIS extract becomes CDC or batch ingestion. The staging database becomes bronze: raw, as is, kept. The cleansing and conformed layer becomes silver: cleaned, deduplicated, typed. The star schema of facts and dimensions becomes gold, the Kimball model. Data files become Parquet on S3; system tables become the catalog; the SQL Server engine becomes Spark, Trino or Snowflake; SSIS packages become dbt plus an orchestrator; SQL Server Agent becomes Airflow or Snowflake Tasks."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #7b2d84; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #f5e9f6; stroke: #7b2d84; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #7b2d84; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #7b2d84; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #7b2d84; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="300" fill="#ffffff"/>
      <text class="tl" x="16" y="22">TRADITIONAL WAREHOUSE</text><text class="tl" x="440" y="22">LAKEHOUSE</text>
      <g class="ts">
      <text x="16" y="50">SSIS extract</text><text x="440" y="50">CDC or batch ingestion (Kafka, NiFi, Airbyte, Fivetran)</text>
      <text x="16" y="76">staging database</text><rect class="n-warn" x="440" y="62" width="364" height="22" rx="3"/><text x="452" y="78"><tspan class="tb">bronze</tspan>: raw, as is, kept</text>
      <text x="16" y="102">cleansing, conformed layer</text><rect class="n-soft" x="440" y="88" width="364" height="22" rx="3"/><text x="452" y="104"><tspan class="tb">silver</tspan>: cleaned, deduplicated, typed</text>
      <text x="16" y="128">star schema: facts, dimensions</text><rect class="n-acc" x="440" y="114" width="364" height="22" rx="3"/><text x="452" y="130"><tspan class="tb">gold</tspan>: the Kimball model</text>
      <text x="16" y="160">database data files</text><text x="440" y="160">Parquet files on object storage</text>
      <text x="16" y="186">system tables</text><text x="440" y="186">the catalog (Hive Metastore, Glue)</text>
      <text x="16" y="212">the database engine</text><text x="440" y="212">Spark, Trino, Snowflake</text>
      <text x="16" y="238">SSIS packages</text><text x="440" y="238">dbt (SQL transforms) and an orchestrator</text>
      <text x="16" y="264">SQL Server Agent</text><text x="440" y="264">Airflow, or the warehouse's own tasks</text>
      </g>
      <g class="e"><line x1="260" y1="46" x2="430" y2="46" marker-end="url(#a)"/><line x1="260" y1="72" x2="430" y2="72" marker-end="url(#a)"/><line x1="260" y1="98" x2="430" y2="98" marker-end="url(#a)"/><line x1="260" y1="124" x2="430" y2="124" marker-end="url(#a)"/><line x1="260" y1="156" x2="430" y2="156" marker-end="url(#a)"/><line x1="260" y1="182" x2="430" y2="182" marker-end="url(#a)"/><line x1="260" y1="208" x2="430" y2="208" marker-end="url(#a)"/><line x1="260" y1="234" x2="430" y2="234" marker-end="url(#a)"/><line x1="260" y1="260" x2="430" y2="260" marker-end="url(#a)"/></g>
    </svg>