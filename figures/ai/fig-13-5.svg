<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 372" role="img" aria-label="Snowflake's three layers. Cloud services handle sign-in and access control, metadata and statistics, and query parsing and optimization; they are billed only above 10 percent of the day's warehouse credits. Compute is virtual warehouses, each isolated with its own cache, for example one for loading, one multi-cluster warehouse for dashboards, one Snowpark-optimized warehouse for data science; they bill per second while running with a 60-second minimum per start, and a suspended warehouse uses no credits. Serverless features such as Snowpipe and serverless tasks use compute Snowflake sizes itself. Storage is managed by Snowflake in the cloud provider's object storage, as micro-partitions of 50 to 500 megabytes uncompressed, columnar, with value ranges per column, so a query reads only the micro-partitions that can match. Time Travel keeps changed data 1 day by default, up to 90; Fail-safe keeps it 7 more days, recoverable only through Snowflake Support."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #7b2d84; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #f5e9f6; stroke: #7b2d84; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #7b2d84; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #7b2d84; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #7b2d84; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="372" fill="#ffffff"/>
      <text class="ts" x="16" y="30">a query</text>
      <line class="e" x1="70" y1="26" x2="104" y2="26" marker-end="url(#a)"/>
      <rect class="zone" x="108" y="10" width="696" height="66" rx="8"/>
      <text class="tl" x="122" y="30">CLOUD SERVICES</text>
      <text class="ts" x="122" y="50">sign-in and access control · metadata and statistics · parsing and optimizing</text>
      <text class="ts tmu" x="122" y="67">billed only above 10% of the day's warehouse credits</text>

      <line class="e" x1="456" y1="77" x2="456" y2="99" marker-end="url(#a)"/>
      <text class="ts" x="466" y="93">plan and dispatch</text>

      <rect class="zone" x="16" y="102" width="788" height="140" rx="8"/>
      <text class="tl" x="30" y="122">COMPUTE: VIRTUAL WAREHOUSES</text>
      <rect class="n" x="30" y="132" width="170" height="62" rx="5"/>
      <text class="tb" x="42" y="153">loading</text><text class="ts" x="42" y="172">one size, e.g. Medium</text><text class="ts tmu" x="42" y="187">own cache</text>
      <rect class="n-acc" x="212" y="132" width="196" height="62" rx="5"/>
      <text class="tb" x="224" y="153">dashboards</text><text class="ts" x="224" y="172">multi-cluster: more clusters</text><text class="ts" x="224" y="187">start as queries queue</text>
      <rect class="n" x="420" y="132" width="170" height="62" rx="5"/>
      <text class="tb" x="432" y="153">data science</text><text class="ts" x="432" y="172">Snowpark-optimized</text><text class="ts tmu" x="432" y="187">own cache</text>
      <rect class="n-soft" x="604" y="132" width="188" height="62" rx="5"/>
      <text class="tb" x="616" y="153">serverless</text><text class="ts" x="616" y="172">Snowpipe, serverless tasks:</text><text class="ts" x="616" y="187">Snowflake sizes the compute</text>
      <text class="ts" x="30" y="216">Isolated from each other. Billed per second while running, 60 s minimum per start; a suspended</text>
      <text class="ts" x="30" y="233">warehouse uses no credits, and drops its cache. Bigger = faster big queries; more clusters = more users.</text>

      <line class="e" x1="456" y1="243" x2="456" y2="265" marker-end="url(#a)"/>
      <text class="ts" x="466" y="259">read only what can match</text>

      <rect class="zone" x="16" y="268" width="788" height="96" rx="8"/>
      <text class="tl" x="30" y="288">STORAGE: MANAGED BY SNOWFLAKE, IN THE CLOUD PROVIDER'S OBJECT STORAGE</text>
      <rect class="n-acc" x="30" y="300" width="34" height="26" rx="2"/><rect class="n" x="70" y="300" width="34" height="26" rx="2"/><rect class="n" x="110" y="300" width="34" height="26" rx="2"/><rect class="n-acc" x="150" y="300" width="34" height="26" rx="2"/><rect class="n" x="190" y="300" width="34" height="26" rx="2"/><rect class="n" x="230" y="300" width="34" height="26" rx="2"/>
      <text class="ts" x="30" y="346">micro-partitions: 50-500 MB uncompressed,</text>
      <text class="ts" x="30" y="360">columnar, with each column's value range</text>
      <text class="ts" x="300" y="310">a filter that matches only the highlighted</text>
      <text class="ts" x="300" y="326">ranges reads those two micro-partitions,</text>
      <text class="ts" x="300" y="342">then only the columns it needs</text>
      <rect class="n-soft" x="604" y="296" width="188" height="58" rx="5"/>
      <text class="ts" x="616" y="316">Time Travel: 1 day default,</text>
      <text class="ts" x="616" y="331">up to 90 (Enterprise)</text>
      <text class="ts" x="616" y="346">then Fail-safe: 7 days, via Support</text>
    </svg>