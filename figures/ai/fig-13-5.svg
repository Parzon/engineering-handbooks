<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 214" role="img" aria-label="Start with a warehouse and dbt. Add a piece only for its pain: near-real-time changes without loading production, add CDC and Kafka; many sources and formats with lineage, add NiFi or a managed connector; data too big for one database, cheap storage, several engines or less lock-in, add Iceberg on object storage with a catalog. Red flags: Kafka for a nightly batch; Iceberg with only one engine; Spark under about 100 GB; NiFi where a Python script would do."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
