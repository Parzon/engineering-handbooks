<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" role="img" aria-label="Getting data into Snowflake, three ways, and keeping derived tables current, two ways. Files in S3 are loaded by COPY INTO, in batches, on a warehouse you choose; or by Snowpipe, which an S3 event notification triggers through SQS, on serverless compute, within minutes. Rows from an application or a Kafka topic are written by Snowpipe Streaming through an SDK or the Kafka connector, with no files, queryable in seconds. All three land in a raw table. Downstream, either a stream records the raw table's changes and a task, on a schedule or when the stream has data, merges them into a clean table; or a dynamic table declares the clean table as a SELECT with a target lag of at least 60 seconds, and Snowflake refreshes it and infers the pipeline."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #7b2d84; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #f5e9f6; stroke: #7b2d84; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #7b2d84; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #7b2d84; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #7b2d84; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="300" fill="#ffffff"/>
      <rect class="zone" x="16" y="16" width="236" height="268" rx="8"/>
      <text class="tl" x="30" y="36">SOURCES</text>
      <rect class="n" x="30" y="48" width="208" height="56" rx="5"/><text class="tb" x="42" y="70">Files in S3</text><text class="ts" x="42" y="89">exports, logs, partner drops</text>
      <rect class="n" x="30" y="200" width="208" height="56" rx="5"/><text class="tb" x="42" y="222">Rows from an app or Kafka</text><text class="ts" x="42" y="241">through an SDK or the connector</text>

      <rect class="n" x="290" y="30" width="196" height="54" rx="5"/><text class="tb" x="302" y="52">COPY INTO</text><text class="ts" x="302" y="70">batches, on your warehouse</text>
      <rect class="n" x="290" y="100" width="196" height="70" rx="5"/><text class="tb" x="302" y="122">Snowpipe</text><text class="ts" x="302" y="140">S3 event → SQS; serverless;</text><text class="ts" x="302" y="157">within minutes</text>
      <rect class="n-acc" x="290" y="200" width="196" height="56" rx="5"/><text class="tb" x="302" y="222">Snowpipe Streaming</text><text class="ts" x="302" y="241">no files; queryable in seconds</text>
      <path class="e" d="M239,70 C262,70 266,57 288,57" marker-end="url(#a)"/>
      <path class="e" d="M239,82 C264,82 264,135 288,135" marker-end="url(#a)"/>
      <line class="e" x1="239" y1="228" x2="288" y2="228" marker-end="url(#a)"/>

      <rect class="n-soft" x="520" y="118" width="96" height="56" rx="5"/><text class="tb" x="568" y="142" text-anchor="middle">raw table</text><text class="ts" x="568" y="160" text-anchor="middle">bronze</text>
      <path class="e" d="M487,57 C506,57 500,130 518,130" marker-end="url(#a)"/>
      <line class="e" x1="487" y1="140" x2="518" y2="140" marker-end="url(#a)"/>
      <path class="e" d="M487,228 C506,228 500,162 518,162" marker-end="url(#a)"/>

      <rect class="n" x="648" y="30" width="156" height="96" rx="5"/><text class="tb" x="660" y="52">stream + task</text><text class="ts" x="660" y="71">a stream records changes;</text><text class="ts" x="660" y="87">a task merges them, on a</text><text class="ts" x="660" y="103">schedule or when there</text><text class="ts" x="660" y="119">are changes</text>
      <rect class="n-acc" x="648" y="150" width="156" height="96" rx="5"/><text class="tb" x="660" y="172">dynamic table</text><text class="ts" x="660" y="191">declare a SELECT and a</text><text class="ts" x="660" y="207">target lag (60 s minimum);</text><text class="ts" x="660" y="223">Snowflake refreshes it</text><text class="ts" x="660" y="239">and infers the pipeline</text>
      <path class="e" d="M617,134 C632,134 630,78 646,78" marker-end="url(#a)"/>
      <path class="e" d="M617,158 C632,158 630,198 646,198" marker-end="url(#a)"/>
      <text class="ts tmu" x="648" y="272">either way: a clean, current table</text>
    </svg>