<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" role="img" aria-label="The application database feeds change data capture or batch extracts; then object storage with Parquet and Iceberg; then transformation from bronze to silver to gold; then the warehouse or lakehouse; then AI uses: retrieval indexes, features, eval sets and analytics. At every arrow data can arrive late, go missing, be duplicated or change shape, and the model downstream answers from whatever arrived. Controls: quality checks at each layer, lineage, freshness monitored as a service level, and contracts on schemas."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #7b2d84; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #f5e9f6; stroke: #7b2d84; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #7b2d84; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #7b2d84; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #7b2d84; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="250" fill="#ffffff"/>
      <g class="ts">
      <rect class="n" x="16" y="30" width="120" height="56" rx="5"/><text x="76" y="54" text-anchor="middle" class="tb">application DB</text><text x="76" y="72" text-anchor="middle">OLTP</text>
      <rect class="n" x="160" y="30" width="120" height="56" rx="5"/><text x="220" y="54" text-anchor="middle" class="tb">CDC or batch</text><text x="220" y="72" text-anchor="middle">extract</text>
      <rect class="n" x="304" y="30" width="120" height="56" rx="5"/><text x="364" y="54" text-anchor="middle" class="tb">object storage</text><text x="364" y="72" text-anchor="middle">Parquet, Iceberg</text>
      <rect class="n" x="448" y="30" width="120" height="56" rx="5"/><text x="508" y="54" text-anchor="middle" class="tb">dbt</text><text x="508" y="72" text-anchor="middle">bronze → gold</text>
      <rect class="n-acc" x="592" y="30" width="212" height="56" rx="5"/><text x="698" y="54" text-anchor="middle" class="tb">AI uses</text><text x="698" y="72" text-anchor="middle">indexes, features, eval sets</text>
      </g>
      <g class="e"><line x1="137" y1="58" x2="158" y2="58" marker-end="url(#a)"/><line x1="281" y1="58" x2="302" y2="58" marker-end="url(#a)"/><line x1="425" y1="58" x2="446" y2="58" marker-end="url(#a)"/><line x1="569" y1="58" x2="590" y2="58" marker-end="url(#a)"/></g>
      <g class="ts tr"><text x="148" y="108" text-anchor="middle">late</text><text x="292" y="108" text-anchor="middle">missing</text><text x="436" y="108" text-anchor="middle">duplicated</text><text x="580" y="108" text-anchor="middle">changed shape</text></g>
      <text class="tl" x="16" y="146">AT EVERY ARROW</text>
      <g class="ts">
      <rect class="n-good" x="16" y="158" width="190" height="72" rx="5"/><text x="28" y="180" class="tb">quality checks</text><text x="28" y="198">not null, unique, counts</text><text x="28" y="214">vs yesterday; stop on fail</text>
      <rect class="n-good" x="216" y="158" width="190" height="72" rx="5"/><text x="228" y="180" class="tb">lineage</text><text x="228" y="198">which answers used</text><text x="228" y="214">the bad data?</text>
      <rect class="n-good" x="416" y="158" width="190" height="72" rx="5"/><text x="428" y="180" class="tb">freshness</text><text x="428" y="198">the newest data's age,</text><text x="428" y="214">monitored like an SLI</text>
      <rect class="n-good" x="616" y="158" width="188" height="72" rx="5"/><text x="628" y="180" class="tb">contracts</text><text x="628" y="198">versioned schemas</text><text x="628" y="214">with meanings</text>
      </g>
    </svg>