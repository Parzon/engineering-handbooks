<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 230" role="img" aria-label="A data contract: an agreed, versioned schema, with meanings and freshness, between a producing team and its consumers, checked in CI or at ingestion. A change goes expand then contract: add the new field, let consumers move, then remove the old one, like a database migration. Backfills recompute history after a logic fix: idempotent jobs, overwriting a partition or upserting by key, are safe to rerun; append-only jobs double the data. Re-embedding the corpus after an embedding model change is a backfill, because old and new vectors cannot be mixed."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #7b2d84; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #f5e9f6; stroke: #7b2d84; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #7b2d84; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #7b2d84; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #7b2d84; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="230" fill="#ffffff"/>
      <rect class="n" x="16" y="20" width="170" height="70" rx="6"/><text class="tb" x="28" y="44">producing team</text><text class="ts" x="28" y="64">changes its schema</text>
      <rect class="n-acc" x="226" y="12" width="300" height="86" rx="6"/><text class="tb" x="238" y="36">The contract</text><text class="ts" x="238" y="58">a versioned schema, field meanings,</text><text class="ts" x="238" y="74">freshness; checked in CI or at</text><text class="ts" x="238" y="90">ingestion</text>
      <rect class="n" x="566" y="20" width="238" height="70" rx="6"/><text class="tb" x="578" y="44">consumers</text><text class="ts" x="578" y="64">indexes, features, reports</text>
      <line class="e" x1="187" y1="55" x2="224" y2="55" marker-end="url(#a)"/><line class="e" x1="527" y1="55" x2="564" y2="55" marker-end="url(#a)"/>
      <text class="ts" x="16" y="122"><tspan class="tb">A change:</tspan> expand (add the new field), let consumers move, then contract (remove the old), like a schema migration.</text>
      <rect class="n-good" x="16" y="142" width="384" height="72" rx="6"/><text class="tb" x="28" y="164">Idempotent backfill: safe to rerun</text><text class="ts" x="28" y="184">overwrite a partition, or upsert by key</text><text class="ts" x="28" y="200">re-embedding: built beside, then switched</text>
      <rect class="n-bad" x="420" y="142" width="384" height="72" rx="6"/><text class="tb" x="432" y="164">Append-only backfill</text><text class="ts" x="432" y="184">a rerun doubles the data</text><text class="ts" x="432" y="200">mixed vectors: meaningless similarity</text>
    </svg>