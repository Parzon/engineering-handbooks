<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 230" role="img" aria-label="Point-in-time correctness. A training row at time t may use only data that existed at t; a join that uses data from after t leaks the future, and offline results look better than production will be. Training and serving skew: a feature such as a customer's incident count over 30 days must be computed the same way for training and for serving, or the model sees different numbers live; a feature store serves precomputed features for both."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
