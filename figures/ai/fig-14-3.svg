    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="230" fill="#ffffff"/>
      <line class="rule-strong" x1="40" y1="70" x2="790" y2="70"/><text class="ts" x="790" y="60" text-anchor="end">time →</text>
      <circle class="fill-acc" cx="420" cy="70" r="7"/><text class="ts tb" x="420" y="50" text-anchor="middle">training row at t</text>
      <rect class="n-good" x="60" y="80" width="350" height="26" rx="3"/><text class="ts" x="235" y="98" text-anchor="middle">data known at t: allowed</text>
      <rect class="n-bad" x="430" y="80" width="340" height="26" rx="3"/><text class="ts" x="600" y="98" text-anchor="middle">data from after t: a leak</text>
      <text class="ts" x="16" y="136"><tspan class="tb">A leaky join</tspan> makes offline results look better than production will be.</text>
      <rect class="n" x="16" y="152" width="384" height="62" rx="6"/><text class="tb" x="28" y="174">Training-serving skew</text><text class="ts" x="28" y="194">a feature computed one way offline and</text><text class="ts" x="28" y="208">another way live</text>
      <rect class="n-good" x="420" y="152" width="384" height="62" rx="6"/><text class="tb" x="432" y="174">One definition for both</text><text class="ts" x="432" y="194">a feature store serves the same precomputed</text><text class="ts" x="432" y="208">features to training and serving</text>
    </svg>