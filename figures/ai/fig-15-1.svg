<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" role="img" aria-label="Nine parts. Problem: what hurts, for whom, with evidence. Constraints: what cannot change, such as budget, data residency, skills, deadlines and existing platforms. Requirements: measurable, must-have and nice-to-have. Options: at least two real ones, including the simplest thing or doing nothing. Decision and why: the requirements that decided it. Trade-offs: what we give up. Risks and how we would notice them. Operations: who runs it, what is monitored, what it costs a month, how it is rolled back. Revisit when: the measurable trigger that reopens it."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #7b2d84; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #f5e9f6; stroke: #7b2d84; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #7b2d84; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #7b2d84; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #7b2d84; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="260" fill="#ffffff"/>
      <g class="ts">
      <rect class="n" x="16" y="16" width="250" height="56" rx="5"/><text x="28" y="38" class="tb">1 Problem</text><text x="28" y="58">what hurts, for whom, evidence</text>
      <rect class="n" x="285" y="16" width="250" height="56" rx="5"/><text x="297" y="38" class="tb">2 Constraints</text><text x="297" y="58">budget, residency, skills, dates</text>
      <rect class="n-acc" x="554" y="16" width="250" height="56" rx="5"/><text x="566" y="38" class="tb">3 Requirements</text><text x="566" y="58">measurable: p95 &lt; 3 s, 99.5%</text>
      <rect class="n" x="16" y="84" width="250" height="56" rx="5"/><text x="28" y="106" class="tb">4 Options</text><text x="28" y="126">two real ones, plus the simplest</text>
      <rect class="n-acc" x="285" y="84" width="250" height="56" rx="5"/><text x="297" y="106" class="tb">5 Decision, and why</text><text x="297" y="126">the requirements that decided</text>
      <rect class="n" x="554" y="84" width="250" height="56" rx="5"/><text x="566" y="106" class="tb">6 Trade-offs</text><text x="566" y="126">what we give up, said plainly</text>
      <rect class="n" x="16" y="152" width="250" height="56" rx="5"/><text x="28" y="174" class="tb">7 Risks</text><text x="28" y="194">and how we would notice them</text>
      <rect class="n" x="285" y="152" width="250" height="56" rx="5"/><text x="297" y="174" class="tb">8 Operations</text><text x="297" y="194">who runs it, cost, rollback</text>
      <rect class="n-good" x="554" y="152" width="250" height="56" rx="5"/><text x="566" y="174" class="tb">9 Revisit when</text><text x="566" y="194">a measurable trigger</text>
      </g>
      <text class="ts" x="16" y="238"><tspan class="tb">Revisit when</tspan> is the part most often missing: "traffic grows tenfold", "a tenant brings its own keys", "a model fits one GPU".</text>
    </svg>