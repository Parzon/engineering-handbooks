<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 230" role="img" aria-label="Three documents with three jobs. A PRD: what and why, for whom, and how success is measured, before building. An RFC: should we, and how, with the technical plan, reviewed before a non-trivial change. An ADR: a decision already made, short, kept forever, superseded by a new one rather than edited. In the reference repository, RFC-0001 proposed answers grounded in the team's runbooks; it was accepted and built; its decisions became ADR-0017; and an outcome section added to the RFC records what changed on the way and the costs measured."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #7b2d84; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
