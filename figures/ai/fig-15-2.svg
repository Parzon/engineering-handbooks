.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="230" fill="#ffffff"/>
      <rect class="n" x="16" y="30" width="230" height="96" rx="6"/><text class="tb" x="28" y="54">PRD</text><text class="ts" x="28" y="76">what, for whom, why, and</text><text class="ts" x="28" y="92">how success is measured</text><text class="ts tmu" x="28" y="114">before building</text>
      <rect class="n-acc" x="296" y="30" width="230" height="96" rx="6"/><text class="tb" x="308" y="54">RFC</text><text class="ts" x="308" y="76">should we, and how: the plan,</text><text class="ts" x="308" y="92">alternatives, trade-offs</text><text class="ts tmu" x="308" y="114">reviewed before the build</text>
      <rect class="n-good" x="576" y="30" width="228" height="96" rx="6"/><text class="tb" x="588" y="54">ADR</text><text class="ts" x="588" y="76">a decision made; short;</text><text class="ts" x="588" y="92">superseded, never edited</text><text class="ts tmu" x="588" y="114">kept forever</text>
      <line class="e" x1="247" y1="78" x2="294" y2="78" marker-end="url(#a)"/><line class="e" x1="527" y1="78" x2="574" y2="78" marker-end="url(#a)"/><text class="ts" x="551" y="70" text-anchor="middle">built</text>
      <text class="ts" x="16" y="164"><tspan class="tb">In the reference repository:</tspan> the RFC for answers grounded in runbooks was reviewed, accepted and built; its decisions</text>
      <text class="ts" x="16" y="182">became the retrieval ADR; and an outcome section on the RFC records what changed on the way (numbered citations, four</text>
      <text class="ts" x="16" y="200">sections per prompt, an explicit team filter, redaction) and the costs it had asked to measure.</text>
    </svg>