<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" role="img" aria-label="Four criteria in order: the requirements, such as latency, freshness, isolation and compliance; the team's ability to run it; the cost at the expected scale; how hard it is to reverse. And a two-by-two of reversibility and impact: cheap to reverse and low impact, decide fast; cheap to reverse and high impact, decide fast, measure, be ready to roll back; expensive to reverse and low impact, write an ADR; expensive to reverse and high impact, write an RFC and get review before building."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #7b2d84; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #f5e9f6; stroke: #7b2d84; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #7b2d84; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #7b2d84; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #7b2d84; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="250" fill="#ffffff"/>
      <text class="tl" x="16" y="22">IN ORDER</text>
      <g class="ts">
      <rect class="n-acc" x="16" y="32" width="330" height="40" rx="4"/><text x="28" y="56"><tspan class="tb">1</tspan> the requirements: latency, freshness, isolation</text>
      <rect class="n" x="16" y="78" width="330" height="40" rx="4"/><text x="28" y="102"><tspan class="tb">2</tspan> the team's ability to run it</text>
      <rect class="n" x="16" y="124" width="330" height="40" rx="4"/><text x="28" y="148"><tspan class="tb">3</tspan> the cost at the expected scale</text>
      <rect class="n" x="16" y="170" width="330" height="40" rx="4"/><text x="28" y="194"><tspan class="tb">4</tspan> how hard it is to reverse</text>
      </g>
      <text class="tl" x="400" y="22">HOW MUCH PROCESS</text>
      <g class="ts">
      <rect class="n-good" x="470" y="32" width="160" height="80" rx="5"/><text x="482" y="56" class="tb">decide fast</text><text x="482" y="76">cheap to reverse,</text><text x="482" y="92">low impact</text>
      <rect class="n-soft" x="640" y="32" width="164" height="80" rx="5"/><text x="652" y="56" class="tb">decide, measure</text><text x="652" y="76">cheap to reverse,</text><text x="652" y="92">high impact</text>
      <rect class="n" x="470" y="122" width="160" height="80" rx="5"/><text x="482" y="146" class="tb">write an ADR</text><text x="482" y="166">hard to reverse,</text><text x="482" y="182">low impact</text>
      <rect class="n-warn" x="640" y="122" width="164" height="80" rx="5"/><text x="652" y="146" class="tb">write an RFC</text><text x="652" y="166">hard to reverse,</text><text x="652" y="182">high impact</text>
      <text x="400" y="76">cheap</text><text x="400" y="92">to undo</text><text x="400" y="166">hard</text><text x="400" y="182">to undo</text>
      <text x="550" y="228" text-anchor="middle">lower impact</text><text x="722" y="228" text-anchor="middle">higher impact</text>
      </g>
    </svg>