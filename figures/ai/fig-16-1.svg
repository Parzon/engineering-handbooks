<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" role="img" aria-label="Two axes: evidence, from anticipated to measured; and cost to reverse, from cheap to expensive. Measured and cheap to reverse: add it. Measured and expensive to reverse: add it, with a decision record and a rollout plan. Anticipated and cheap to reverse: experiment early if it helps. Anticipated and expensive to reverse: do not build it; write it down as a future option with the trigger that would justify it."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #7b2d84; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #f5e9f6; stroke: #7b2d84; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #7b2d84; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #7b2d84; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #7b2d84; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="300" fill="#ffffff"/>
      <line class="rule-strong" x1="140" y1="250" x2="790" y2="250"/><line class="rule-strong" x1="140" y1="250" x2="140" y2="30"/>
      <text class="ts" x="465" y="276" text-anchor="middle">evidence: anticipated → measured</text>
      <text class="ts" x="16" y="70">expensive</text><text class="ts" x="16" y="86">to reverse</text><text class="ts" x="16" y="200">cheap</text><text class="ts" x="16" y="216">to reverse</text>
      <rect class="n-warn" x="156" y="40" width="300" height="96" rx="6"/><text class="tb" x="168" y="64">Write it down, don't build</text><text class="ts" x="168" y="86">a future option in a decision record,</text><text class="ts" x="168" y="102">with the trigger that would justify it</text><text class="ts tmu" x="168" y="124">a premature service split</text>
      <rect class="n-acc" x="476" y="40" width="304" height="96" rx="6"/><text class="tb" x="488" y="64">Add it, deliberately</text><text class="ts" x="488" y="86">a decision record and a rollout plan</text><text class="ts tmu" x="488" y="124">a split for a real scaling profile</text>
      <rect class="n-soft" x="156" y="146" width="300" height="94" rx="6"/><text class="tb" x="168" y="170">Experiment, if it helps</text><text class="ts" x="168" y="192">cheap to undo: try it, measure it</text><text class="ts tmu" x="168" y="226">swapping one library</text>
      <rect class="n-good" x="476" y="146" width="304" height="94" rx="6"/><text class="tb" x="488" y="170">Add it</text><text class="ts" x="488" y="192">a metric, an incident or a measured</text><text class="ts" x="488" y="208">limit says so</text><text class="ts tmu" x="488" y="226">an index for a slow query</text>
    </svg>