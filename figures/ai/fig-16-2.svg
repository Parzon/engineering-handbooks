<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" role="img" aria-label="Five knobs, each with its trigger and its cost. A cache: trigger, a specific measured slow, repeated read; cost, a second system that can go stale or down, and stampedes on expiry; time to live trades staleness against database load. A queue: trigger, a task too slow to wait for, or one that must survive restarts and be retried; cost, the request returns before the work is done, so status must be reported back. A service split: trigger, a different scaling profile, deploy cadence or failure domain; cost, network calls, distributed transactions, N deployables. Kubernetes: trigger, many hosts and autoscaling beyond a managed platform, or an organization standard; cost, an ongoing operational tax. Buy or build: buy what is not the product's differentiator; build what is, or where no vendor fits a real constraint."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #7b2d84; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #f5e9f6; stroke: #7b2d84; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #7b2d84; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #7b2d84; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #7b2d84; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="330" fill="#ffffff"/>
      <g class="ts">
      <text x="16" y="22" class="tl">KNOB</text><text x="200" y="22" class="tl">TURN IT WHEN</text><text x="520" y="22" class="tl">WHAT IT COSTS</text>
      <line class="rule" x1="16" y1="30" x2="804" y2="30"/>
      <text x="16" y="56" class="tb">a cache</text><text x="200" y="56">a specific read, measured slow and</text><text x="200" y="72">repeated, after profiling</text><text x="520" y="56">a system that goes stale or down;</text><text x="520" y="72">stampedes when keys expire</text>
      <line class="rule" x1="16" y1="86" x2="804" y2="86"/>
      <text x="16" y="110" class="tb">a queue</text><text x="200" y="110">too slow to wait for, or must</text><text x="200" y="126">survive restarts and retries</text><text x="520" y="110">the request returns before the work:</text><text x="520" y="126">status must be reported back</text>
      <line class="rule" x1="16" y1="140" x2="804" y2="140"/>
      <text x="16" y="164" class="tb">a service split</text><text x="200" y="164">its own scaling profile, deploy</text><text x="200" y="180">cadence or failure domain</text><text x="520" y="164">network calls, distributed</text><text x="520" y="180">transactions, N deployables</text>
      <line class="rule" x1="16" y1="194" x2="804" y2="194"/>
      <text x="16" y="218" class="tb">Kubernetes</text><text x="200" y="218">many hosts and autoscaling beyond a</text><text x="200" y="234">managed platform, or the org runs it</text><text x="520" y="218">an ongoing operational tax and</text><text x="520" y="234">a dedicated skill set</text>
      <line class="rule" x1="16" y1="248" x2="804" y2="248"/>
      <text x="16" y="272" class="tb">buy or build</text><text x="200" y="272">buy what is not your differentiator:</text><text x="200" y="288">auth, email, payments, orchestration</text><text x="520" y="272">building generic things wastes time;</text><text x="520" y="288">buying your core outsources your value</text>
      <line class="rule" x1="16" y1="302" x2="804" y2="302"/>
      </g>
    </svg>