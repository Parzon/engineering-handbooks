<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 290" role="img" aria-label="AI pieces left out until evidence asks for them, with their triggers. Retrieval: answers must come from your documents. A reranker: fusion's equal weighting measurably ranks the right chunk too low. An agent: the steps are not known in advance, and evals show it pays. Several agents: one agent's context or toolset is outgrown. A knowledge graph: competency questions whose answers live in relationships, which retrieval cannot answer. Fine-tuning: prompting and retrieval cannot reach the bar on evals, and the data and budget exist. A self-hosted model: data may not leave, or sustained load keeps GPUs busy. An MCP server: other AI clients should use the tools."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
