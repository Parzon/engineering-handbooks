<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" role="img" aria-label="Five steps. Ask for the outcome and the user: which task or decision gets better, for whom, and how we will know. Write down constraints and non-goals, and confirm them with whoever asked. Find the riskiest assumption, usually that the model can do this well enough, and test it first with a spike and a small eval set. Slice thin and end to end, a walking skeleton through the real pipeline. Split into workstreams with one owner each and clear interfaces: data and retrieval; the model layer and evals; the product surface; platform, security and operations."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #7b2d84; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #f5e9f6; stroke: #7b2d84; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #7b2d84; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #7b2d84; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #7b2d84; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="260" fill="#ffffff"/>
      <g class="ts">
      <rect class="n" x="16" y="16" width="150" height="90" rx="6"/><text x="28" y="40" class="tb">1 Outcome</text><text x="28" y="60">which task gets</text><text x="28" y="76">better, for whom,</text><text x="28" y="92">measured how</text>
      <rect class="n" x="176" y="16" width="150" height="90" rx="6"/><text x="188" y="40" class="tb">2 Constraints</text><text x="188" y="60">and non-goals,</text><text x="188" y="76">confirmed with</text><text x="188" y="92">whoever asked</text>
      <rect class="n-warn" x="336" y="16" width="150" height="90" rx="6"/><text x="348" y="40" class="tb">3 Riskiest first</text><text x="348" y="60">"the model can do</text><text x="348" y="76">it": a spike and a</text><text x="348" y="92">small eval set</text>
      <rect class="n" x="496" y="16" width="150" height="90" rx="6"/><text x="508" y="40" class="tb">4 Thin slices</text><text x="508" y="60">a walking skeleton</text><text x="508" y="76">through the real</text><text x="508" y="92">pipeline</text>
      <rect class="n-acc" x="656" y="16" width="148" height="90" rx="6"/><text x="668" y="40" class="tb">5 Workstreams</text><text x="668" y="60">one owner each,</text><text x="668" y="76">clear interfaces</text>
      </g>
      <g class="e"><line x1="167" y1="56" x2="174" y2="56" marker-end="url(#a)"/><line x1="327" y1="56" x2="334" y2="56" marker-end="url(#a)"/><line x1="487" y1="56" x2="494" y2="56" marker-end="url(#a)"/><line x1="647" y1="56" x2="654" y2="56" marker-end="url(#a)"/></g>
      <text class="tl" x="16" y="132">THE WORKSTREAMS OF AN AI FEATURE</text>
      <g class="ts">
      <rect class="n-soft" x="16" y="144" width="190" height="56" rx="5"/><text x="28" y="166" class="tb">data and retrieval</text><text x="28" y="186">sources, chunks, index</text>
      <rect class="n-soft" x="216" y="144" width="190" height="56" rx="5"/><text x="228" y="166" class="tb">model layer and evals</text><text x="228" y="186">prompt, seam, cases</text>
      <rect class="n-soft" x="416" y="144" width="190" height="56" rx="5"/><text x="428" y="166" class="tb">product surface</text><text x="428" y="186">UI, streaming, feedback</text>
      <rect class="n-soft" x="616" y="144" width="188" height="56" rx="5"/><text x="628" y="166" class="tb">platform and safety</text><text x="628" y="186">security, operations</text>
      </g>
      <text class="ts" x="16" y="236">Slice end to end, not layer by layer: a thin answer through real data, real sign-in and the real deploy path beats a polished UI on a mock.</text>
    </svg>