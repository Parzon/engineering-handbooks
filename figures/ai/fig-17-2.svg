<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" role="img" aria-label="Twelve weeks. Week 1: scope, users, success metric, non-goals, the riskiest assumption, repository, CI. Weeks 2 and 3: a skeleton in staging, a thin slice with a real model and realistic data, eval set version 1, authentication and permissions decided. Weeks 4 to 8: features by value and risk, a weekly demo to real users, evals gating every change. Weeks 9 and 10: hardening: a security review, one load check, a rehearsed restore and rollback, alerts on three to five signals, handover documents. Week 11: a pilot behind a flag or canary. Week 12: launch, really a buffer: plan to finish by week 10 or 11. Request slow approvals in week 1: cloud access, security review, data access, the model provider's terms, named pilot users."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
