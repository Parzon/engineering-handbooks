      <text x="24" y="54">scope</text><text x="24" y="70">metric</text><text x="24" y="86">risks</text><text x="24" y="102">repo, CI</text>
      <text x="88" y="54">skeleton in</text><text x="88" y="70">staging; thin</text><text x="88" y="86">slice, real</text><text x="88" y="102">model; evals v1;</text><text x="88" y="118">auth decided</text>
      <text x="212" y="54">features by value and risk</text><text x="212" y="70">a weekly demo to real users</text><text x="212" y="86">evals gate every change</text>
      <text x="516" y="54">security review</text><text x="516" y="70">one load check</text><text x="516" y="86">restore, rollback</text><text x="516" y="102">rehearsed; 3-5</text><text x="516" y="118">alerts; handover</text>
      <text x="640" y="54">pilot</text><text x="640" y="70">behind a</text><text x="640" y="86">flag or</text><text x="640" y="102">canary</text>
      <text x="724" y="54">launch:</text><text x="724" y="70">really a</text><text x="724" y="86">buffer</text>
      </g>
      <rect class="n-bad" x="16" y="172" width="788" height="52" rx="6"/><text class="tb tr" x="28" y="194">Week one: request everything with lead time</text><text class="ts" x="28" y="212">cloud and IAM access, the security review, data access and processing approvals, the provider's terms, named pilot users</text>
      <text class="ts" x="16" y="252"><tspan class="tb">Left out until it hurts:</tspan> agents, rerankers, knowledge graphs, fine-tuning, self-hosted models, multi-region, more than two</text>
      <text class="ts" x="16" y="270">environments, and a decision record for every choice (about five, for the ones that are expensive to reverse).</text>
