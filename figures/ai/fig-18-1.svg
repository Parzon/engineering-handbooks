<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" role="img" aria-label="The loop: plan, with no implementation; a person reviews the plan; implement; verify with tests, types and lint, because 'it ran once' is not verification; preserve state by writing down what was learned. Skipping the plan on a non-trivial task is the most-cited cause of wasted output. Prompts state the goal as an outcome with its constraints: 'the health check survives a database restart', not 'add a try/except at line 40'."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #7b2d84; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #f5e9f6; stroke: #7b2d84; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #7b2d84; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #7b2d84; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #7b2d84; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="250" fill="#ffffff"/>
      <g class="ts">
      <rect class="n-acc" x="16" y="30" width="140" height="70" rx="6"/><text x="28" y="54" class="tb">1 Plan</text><text x="28" y="74">no code yet</text><text x="28" y="90">explore first</text>
      <rect class="n-warn" x="176" y="30" width="140" height="70" rx="6"/><text x="188" y="54" class="tb">2 Review it</text><text x="188" y="74">a person checks</text><text x="188" y="90">the approach</text>
      <rect class="n" x="336" y="30" width="140" height="70" rx="6"/><text x="348" y="54" class="tb">3 Implement</text><text x="348" y="74">in small steps</text><text x="348" y="90">you can checkpoint</text>
      <rect class="n-good" x="496" y="30" width="140" height="70" rx="6"/><text x="508" y="54" class="tb">4 Verify</text><text x="508" y="74">tests, types, lint;</text><text x="508" y="90">"it ran" is not it</text>
      <rect class="n" x="656" y="30" width="148" height="70" rx="6"/><text x="668" y="54" class="tb">5 Write it down</text><text x="668" y="74">what was learned,</text><text x="668" y="90">for the next session</text>
      </g>
      <g class="e"><line x1="157" y1="65" x2="174" y2="65" marker-end="url(#a)"/><line x1="317" y1="65" x2="334" y2="65" marker-end="url(#a)"/><line x1="477" y1="65" x2="494" y2="65" marker-end="url(#a)"/><line x1="637" y1="65" x2="654" y2="65" marker-end="url(#a)"/></g>
      <rect class="n-soft" x="16" y="128" width="788" height="100" rx="6"/>
      <text class="tb" x="28" y="152">Prompts: an outcome with constraints, in one message</text>
      <text class="ts" x="28" y="176"><tspan class="tb tg">"the health check survives a database restart"</tspan>, not <tspan class="tr">"add a try/except at line 40"</tspan></text>
      <text class="ts" x="28" y="200">Split a big feature into a plan you can checkpoint. Keep a session going across related tasks; reset when switching projects.</text>
      <text class="ts" x="28" y="218">Parallel work: one Git worktree and one branch per agent session.</text>
    </svg>