<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 220" role="img" aria-label="Memory in three tiers. A short root file, AGENTS.md or CLAUDE.md, with conventions, commands, prohibitions and pointers. Per-topic one-pagers. Deep reference documents. The reference repository's AGENTS.md lists build, test and check commands, access-control rules for every change that touches data, and what agents must not do: modify infrastructure without being asked, add a dependency without flagging it, edit a merged decision record, make a scan pass by exempting its finding, or weaken an eval case to make a run pass."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
