      <rect class="n-acc" x="16" y="16" width="250" height="80" rx="6"/><text class="tb" x="28" y="40">1 A short root file</text><text class="ts" x="28" y="62">commands, conventions,</text><text class="ts" x="28" y="78">prohibitions, pointers</text>
      <rect class="n" x="285" y="16" width="250" height="80" rx="6"/><text class="tb" x="297" y="40">2 One-pagers per topic</text><text class="ts" x="297" y="62">testing, security, operations,</text><text class="ts" x="297" y="78">one job each</text>
      <rect class="n" x="554" y="16" width="250" height="80" rx="6"/><text class="tb" x="566" y="40">3 Deep references</text><text class="ts" x="566" y="62">guides and decision records,</text><text class="ts" x="566" y="78">read when a task needs them</text>
      <text class="tl" x="16" y="128">THE REFERENCE REPOSITORY'S PROHIBITIONS FOR AGENTS</text>
      <g class="ts"><text x="16" y="152">touch infrastructure without being asked · add a dependency without flagging it · edit a merged decision record</text>
      <text x="16" y="174">make a scan pass by exempting its finding · weaken, delete or re-label an eval case to make a run pass</text>
      <text x="16" y="200"><tspan class="tb">When an agent gets something wrong twice,</tspan> the fix belongs in the root file, not in a longer prompt next time.</text></g>
    </svg>