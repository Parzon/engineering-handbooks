<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 240" role="img" aria-label="Review standards: no merge without human review; CI green is mandatory; tests are the gate; small pull requests; the reviewer can explain why the code works. Failure patterns to watch: invented APIs or parameters; silently swallowed exceptions; clever, unmaintainable one-liners; tests that assert something trivial; checks weakened to pass. For a team: an instructions file in the repository, AI review as a blocking check on large pull requests with human review still required, and pull requests as the audit trail of what agents changed and why."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
