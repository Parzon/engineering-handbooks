    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="240" fill="#ffffff"/>
      <rect class="n-good" x="16" y="16" width="384" height="140" rx="6"/><text class="tb" x="28" y="40">The standard</text>
      <g class="ts"><text x="28" y="64">no merge without a human review</text><text x="28" y="84">CI green, always</text><text x="28" y="104">tests are the gate, written or checked by a person</text><text x="28" y="124">small pull requests, one concern each</text><text x="28" y="144">the reviewer can explain why it works</text></g>
      <rect class="n-warn" x="420" y="16" width="384" height="140" rx="6"/><text class="tb" x="432" y="40">Failure patterns to look for</text>
      <g class="ts"><text x="432" y="64">invented APIs or parameters</text><text x="432" y="84">silently swallowed exceptions</text><text x="432" y="104">clever, unmaintainable one-liners</text><text x="432" y="124">tests asserting something trivial</text><text x="432" y="144">a check weakened to get green</text></g>
      <text class="ts" x="16" y="186"><tspan class="tb">For a team:</tspan> AI review as a blocking check on large pull requests, with human review still required; pull requests as</text>
      <text class="ts" x="16" y="204">the audit trail of what agents changed and why; read the tests first, then the failure paths and timeouts.</text>
