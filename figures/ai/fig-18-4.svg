<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" role="img" aria-label="Six extension points of a coding agent, arranged by how binding they are and what they cost per turn. Advisory, read by the model: the instructions file, skills, MCP tools and subagents. Mechanical, run by the harness: hooks, and headless runs in a pipeline. Each box names the cost: the instructions file every turn; a skill's description always and its body when it fires; a plugin's bundle; hooks nothing in context; MCP tool definitions every turn."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #7b2d84; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #f5e9f6; stroke: #7b2d84; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #7b2d84; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #7b2d84; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #7b2d84; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="300" fill="#ffffff"/>
      <text class="tl" x="16" y="22">ADVISORY: THE MODEL READS IT, AND MAY WEIGH IT AGAINST THE TASK</text>
      <rect class="n-acc" x="16" y="34" width="186" height="92" rx="6"/><text class="tb" x="28" y="56">Instructions file</text><text class="ts" x="28" y="76">AGENTS.md / CLAUDE.md</text><text class="ts" x="28" y="92">read every session</text><text class="ts" x="28" y="110">cost: its length, each turn</text>
      <rect class="n" x="216" y="34" width="186" height="92" rx="6"/><text class="tb" x="228" y="56">Skill</text><text class="ts" x="228" y="76">markdown, on a trigger or /name</text><text class="ts" x="228" y="92">one-line description always on,</text><text class="ts" x="228" y="110">the body only when it fires</text>
      <rect class="n" x="416" y="34" width="186" height="92" rx="6"/><text class="tb" x="428" y="56">MCP server</text><text class="ts" x="428" y="76">tools from outside: a browser,</text><text class="ts" x="428" y="92">a docs index, a design file</text><text class="ts" x="428" y="110">tool definitions cost every turn</text>
      <rect class="n" x="616" y="34" width="188" height="92" rx="6"/><text class="tb" x="628" y="56">Subagent</text><text class="ts" x="628" y="76">a fresh context, one job:</text><text class="ts" x="628" y="92">explore, review, test</text><text class="ts" x="628" y="110">cost: a second conversation</text>

      <text class="tl" x="16" y="160">MECHANICAL: THE HARNESS RUNS IT, THE MODEL CANNOT SKIP IT</text>
      <rect class="n-good" x="16" y="172" width="386" height="92" rx="6"/><text class="tb" x="28" y="194">Hook</text><text class="ts" x="28" y="214">a command at an event: session start, before or after</text><text class="ts" x="28" y="230">a tool call, when the agent wants to stop</text><text class="ts" x="28" y="248">exit code 2 blocks; holds with permissions switched off; no context cost</text>
      <rect class="n-good" x="416" y="172" width="388" height="92" rx="6"/><text class="tb" x="428" y="194">Headless run</text><text class="ts" x="428" y="214">the same agent from a script, with a budget and a tool allowlist</text><text class="ts" x="428" y="230">how it joins a pipeline, and how you measure a skill:</text><text class="ts" x="428" y="248">same task, two arms, your own checks afterwards</text>

      <text class="ts" x="16" y="290">A plugin is a versioned bundle of any of these, from a marketplace. Ask what each one costs per turn before installing it.</text>
    </svg>