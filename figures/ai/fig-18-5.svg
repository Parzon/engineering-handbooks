<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" role="img" aria-label="The same three tasks, two arms, twelve runs on the reference build. Without the skill: 73 lines added per run, 4,092 output tokens, 15.6 cents, four of six runs passed every check. With a lean-code skill: 50 lines, 3,308 tokens, 15.3 cents, five of six passed. The skill's README claimed 53% less code; an independent replication found 15%; this measured 32%."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
