.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="250" fill="#ffffff"/>
      <text class="tl" x="16" y="22">THREE TASKS, TWO ARMS, TWELVE RUNS, THE SAME CHECKS AFTERWARDS</text>
      <rect class="n" x="16" y="34" width="386" height="120" rx="6"/><text class="tb" x="28" y="58">No skill</text>
      <text class="ts" x="28" y="82">73 lines added per run; 4,092 output tokens</text>
      <text class="ts" x="28" y="100">15.6 cents and 30 seconds per run</text>
      <text class="ts" x="28" y="118">4 of 6 runs green on lint, types, tests; same type slip once</text>
      <text class="ts" x="28" y="136">retry task: noticed the SDK already retried in 1 run of 2</text>
      <rect class="n-good" x="416" y="34" width="388" height="120" rx="6"/><text class="tb" x="428" y="58">With a "least code that works" skill</text>
      <text class="ts" x="428" y="82">50 lines added per run; 3,308 output tokens</text>
      <text class="ts" x="428" y="100">15.3 cents and 32 seconds per run</text>
      <text class="ts" x="428" y="118">5 of 6 runs green; the same type slip once</text>
      <text class="ts" x="428" y="136">retry task: noticed it in 1 run of 2, as well</text>
      <text class="tb" x="16" y="186">Read: a third less code at the same price and correctness.</text>
      <text class="ts" x="16" y="206">The skill's own benchmark said half the code and 41% less time. An independent replication on 80 tasks found 15% less code and 10% lower cost.</text>
      <text class="ts" x="16" y="224">Two runs per cell is a pilot. It was enough to see that the README number would not appear on this codebase.</text>
    </svg>