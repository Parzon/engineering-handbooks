<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" role="img" aria-label="Three columns. You own: the problem statement as an outcome with constraints, the acceptance check, stakeholder decisions, the risk tier, editing the plan, reading the tests first, the merge. The agent owns: the implementation in a worktree, the tests, the first review pass, the documentation and the decision record draft, the pull request text with the commands it ran. The gates own: format, lint and types on every edit; unit tests before a turn can end; CI's required checks; owners on the guardrail files; scoped credentials with no production-delete rights."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #7b2d84; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #f5e9f6; stroke: #7b2d84; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #7b2d84; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #7b2d84; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #7b2d84; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="260" fill="#ffffff"/>
      <rect class="n-acc" x="16" y="16" width="250" height="196" rx="6"/><text class="tb" x="28" y="40">You own</text>
      <text class="ts" x="28" y="64">the problem statement: an outcome,</text><text class="ts" x="28" y="80">its constraints, its acceptance check</text>
      <text class="ts" x="28" y="102">the stakeholder decisions</text>
      <text class="ts" x="28" y="124">the risk tier of the change</text>
      <text class="ts" x="28" y="146">the plan, edited before any code</text>
      <text class="ts" x="28" y="168">the review: tests first, then the diff</text>
      <text class="ts" x="28" y="190">the merge, and what was merged</text>
      <rect class="n" x="285" y="16" width="250" height="196" rx="6"/><text class="tb" x="297" y="40">The agent owns</text>
      <text class="ts" x="297" y="64">the implementation, in its own worktree</text>
      <text class="ts" x="297" y="86">the tests, placed where the contract says</text>
      <text class="ts" x="297" y="108">the first review pass and the simplify pass</text>
      <text class="ts" x="297" y="130">the docs and the draft decision record</text>
      <text class="ts" x="297" y="152">the pull request text: what changed, what it ran,</text><text class="ts" x="297" y="168">with the output</text>
      <text class="ts" x="297" y="190">what it skipped, said out loud</text>
      <rect class="n-good" x="554" y="16" width="250" height="196" rx="6"/><text class="tb" x="566" y="40">The gates own</text>
      <text class="ts" x="566" y="64">format, lint, types on every edit (hooks)</text>
      <text class="ts" x="566" y="86">unit tests before a turn may end (hook)</text>
      <text class="ts" x="566" y="108">the required checks on the pull request (CI)</text>
      <text class="ts" x="566" y="130">owners on every guardrail file</text>
      <text class="ts" x="566" y="152">credentials scoped and short-lived;</text><text class="ts" x="566" y="168">nothing that can delete production</text>
      <text class="ts" x="566" y="190">a sandbox for unattended runs</text>
      <text class="ts" x="16" y="244">The documented disasters, an agent deleting a production database twice in two years, were missing the third column, not the first two.</text>
    </svg>