<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 244" role="img" aria-label="Text is split by a tokenizer into subword tokens; each token becomes a vector; a stack of transformer layers turns the vectors into a score, a logit, for every token in the vocabulary; softmax and sampling pick one token; it is appended to the sequence and the model runs again, once per output token, until a stop token or the output limit."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #7b2d84; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #f5e9f6; stroke: #7b2d84; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #7b2d84; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #7b2d84; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #7b2d84; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="244" fill="#ffffff"/>
      <rect class="n" x="16" y="30" width="110" height="64" rx="5"/><text class="tb" x="71" y="56" text-anchor="middle">text</text><text class="ts" x="71" y="76" text-anchor="middle">"disk full on"</text>
      <rect class="n" x="148" y="30" width="120" height="64" rx="5"/><text class="tb" x="208" y="56" text-anchor="middle">tokens</text><text class="ts" x="208" y="76" text-anchor="middle">subword pieces</text>
      <rect class="n" x="290" y="30" width="110" height="64" rx="5"/><text class="tb" x="345" y="56" text-anchor="middle">vectors</text><text class="ts" x="345" y="76" text-anchor="middle">one per token</text>
      <rect class="n-acc" x="422" y="30" width="140" height="64" rx="5"/><text class="tb" x="492" y="56" text-anchor="middle">transformer</text><text class="ts" x="492" y="76" text-anchor="middle">attention + MLP × N</text>
      <rect class="n" x="584" y="30" width="100" height="64" rx="5"/><text class="tb" x="634" y="56" text-anchor="middle">logits</text><text class="ts" x="634" y="76" text-anchor="middle">a score per token</text>
      <rect class="n-warn" x="706" y="30" width="98" height="64" rx="5"/><text class="tb" x="755" y="56" text-anchor="middle">sample</text><text class="ts" x="755" y="76" text-anchor="middle">one token</text>
      <line class="e" x1="127" y1="62" x2="146" y2="62" marker-end="url(#a)"/><line class="e" x1="269" y1="62" x2="288" y2="62" marker-end="url(#a)"/><line class="e" x1="401" y1="62" x2="420" y2="62" marker-end="url(#a)"/><line class="e" x1="563" y1="62" x2="582" y2="62" marker-end="url(#a)"/><line class="e" x1="685" y1="62" x2="704" y2="62" marker-end="url(#a)"/>
      <path class="e-acc" d="M755,95 C755,150 208,150 208,97" marker-end="url(#a-acc)"/>
      <text class="ts ta" x="480" y="172" text-anchor="middle">append it and run again: one forward pass per output token</text>
      <text class="ts" x="16" y="208">English averages about four characters, or three quarters of a word, per token. Other languages, numbers and code cost more,</text>
      <text class="ts" x="16" y="226">and the same text gives different counts in different model families. Generation stops at a stop token or the output limit.</text>
    </svg>