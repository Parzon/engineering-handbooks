<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" role="img" aria-label="Causal attention for the last token of 'the disk is full': its query is compared with the keys of every earlier token, including itself; a softmax over the scores gives weights; the output is the weighted sum of the values. A token never attends to later tokens, which is what allows generating one at a time while reusing the past. Compute grows with the square of the context length; the memory for past keys and values, the KV cache, grows linearly."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #7b2d84; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #f5e9f6; stroke: #7b2d84; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #7b2d84; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #7b2d84; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #7b2d84; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="250" fill="#ffffff"/>
      <g class="ts">
      <rect class="n" x="16" y="30" width="96" height="40" rx="4"/><text x="64" y="55" text-anchor="middle">the</text>
      <rect class="n" x="126" y="30" width="96" height="40" rx="4"/><text x="174" y="55" text-anchor="middle">disk</text>
      <rect class="n" x="236" y="30" width="96" height="40" rx="4"/><text x="284" y="55" text-anchor="middle">is</text>
      <rect class="n-acc" x="346" y="30" width="96" height="40" rx="4"/><text x="394" y="55" text-anchor="middle">full</text>
      <rect class="n-soft" x="456" y="30" width="96" height="40" rx="4"/><text x="504" y="55" text-anchor="middle" class="tmu">(future)</text>
      </g>
      <text class="ts" x="16" y="20">keys and values of every earlier token, read by the last one</text>
      <path class="e-acc" d="M394,72 C394,130 64,130 64,74" marker-end="url(#a-acc)"/>
      <path class="e-acc" d="M394,72 C394,120 174,120 174,74" marker-end="url(#a-acc)"/>
      <path class="e-acc" d="M394,72 C394,108 284,108 284,74" marker-end="url(#a-acc)"/>
      <line class="e-bad dash" x1="444" y1="50" x2="454" y2="50"/><text class="ts tr" x="456" y="96">never attended: causal</text>
      <rect class="n" x="16" y="150" width="250" height="80" rx="5"/><text class="tb" x="28" y="172">Q, K, V</text><text class="ts" x="28" y="192">query: what this token looks for</text><text class="ts" x="28" y="208">key: what a token contains</text><text class="ts" x="28" y="224">value: what it passes on</text>
      <rect class="n" x="286" y="150" width="250" height="80" rx="5"/><text class="tb" x="298" y="172">The output</text><text class="ts" x="298" y="192">softmax of query · keys gives</text><text class="ts" x="298" y="208">weights; the output is the</text><text class="ts" x="298" y="224">weighted sum of the values</text>
      <rect class="n-warn" x="556" y="150" width="248" height="80" rx="5"/><text class="tb" x="568" y="172">The cost</text><text class="ts" x="568" y="192">compute: grows with the square</text><text class="ts" x="568" y="208">of the context; memory for past</text><text class="ts" x="568" y="224">keys and values: linear</text>
      <text class="ts" x="580" y="56">many heads in parallel,</text><text class="ts" x="580" y="72">each a kind of relation;</text><text class="ts" x="580" y="88">many layers stacked</text>
    </svg>