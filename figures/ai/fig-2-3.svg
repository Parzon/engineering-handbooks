<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" role="img" aria-label="Next-token probabilities after 'the disk is', as bars for full, nearly, at, almost and other tokens. Low temperature sharpens the distribution toward 'full'; high temperature flattens it. Temperature 0 is greedy: always the top token. Top-p keeps only the smallest set of tokens whose probabilities reach p, here full and nearly, and samples among them; top-k keeps only the k likeliest. Adjust temperature or top-p, usually not both. Low temperature suits extraction, classification, judges and tool calls; higher suits drafting."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #7b2d84; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #f5e9f6; stroke: #7b2d84; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #7b2d84; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #7b2d84; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #7b2d84; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="260" fill="#ffffff"/>
      <text class="tl" x="16" y="22">TEMPERATURE 0.3: SHARP</text>
      <g class="ts">
      <text x="16" y="52">full</text><rect class="fill-acc" x="80" y="40" width="210" height="16"/><text x="298" y="52">0.82</text>
      <text x="16" y="76">nearly</text><rect class="fill-acc" x="80" y="64" width="34" height="16"/><text x="122" y="76">0.13</text>
      <text x="16" y="100">at</text><rect class="fill-acc" x="80" y="88" width="10" height="16"/><text x="98" y="100">0.04</text>
      <text x="16" y="124">almost</text><rect class="fill-acc" x="80" y="112" width="3" height="16"/><text x="90" y="124">0.01</text>
      </g>
      <text class="tl" x="430" y="22">TEMPERATURE 1.5: FLAT</text>
      <g class="ts">
      <text x="430" y="52">full</text><rect class="fill-acc" x="494" y="40" width="97" height="16"/><text x="599" y="52">0.38</text>
      <text x="430" y="76">nearly</text><rect class="fill-acc" x="494" y="64" width="67" height="16"/><text x="569" y="76">0.26</text>
      <text x="430" y="100">at</text><rect class="fill-acc" x="494" y="88" width="54" height="16"/><text x="556" y="100">0.21</text>
      <text x="430" y="124">almost</text><rect class="fill-acc" x="494" y="112" width="41" height="16"/><text x="543" y="124">0.16</text>
      </g>
      <rect class="n-soft" x="16" y="150" width="788" height="96" rx="6"/>
      <text class="ts" x="28" y="172"><tspan class="tb">Temperature</tspan> divides the logits before softmax: below 1 sharpens toward the likeliest token, above 1 flattens.</text>
      <text class="ts" x="28" y="192"><tspan class="tb">0 is greedy</tspan>: always the top token, the most repeatable setting, though not bit-identical on GPUs that batch requests.</text>
      <text class="ts" x="28" y="212"><tspan class="tb">Top-p</tspan>: sample only from the smallest set reaching probability p; <tspan class="tb">top-k</tspan>: only the k likeliest. Adjust temperature or top-p, usually not both.</text>
      <text class="ts" x="28" y="232">Low temperature for extraction, classification, judges and tool calls; higher for drafting.</text>
    </svg>