<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" role="img" aria-label="A request's timeline. Prefill runs the whole prompt through the model in one parallel pass and builds the KV cache; it is compute-bound, grows with the prompt and sets the time to first token. Decode produces one token per forward pass, reading all the weights and the KV cache from GPU memory each time; it is memory-bandwidth-bound and sets tokens per second per stream. Total time is roughly the time to first token plus output tokens divided by tokens per second. Measured for a 20-billion-parameter model on one GPU: time to first token about 0.2 to 0.3 seconds, and 176 tokens per second for a single stream."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #7b2d84; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #f5e9f6; stroke: #7b2d84; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #7b2d84; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #7b2d84; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #7b2d84; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="250" fill="#ffffff"/>
      <rect class="n-acc" x="16" y="40" width="150" height="50" rx="4"/><text class="tb" x="91" y="62" text-anchor="middle">prefill</text><text class="ts" x="91" y="80" text-anchor="middle">whole prompt, parallel</text>
      <g class="fill-good"><rect x="172" y="50" width="22" height="30"/><rect x="198" y="50" width="22" height="30"/><rect x="224" y="50" width="22" height="30"/><rect x="250" y="50" width="22" height="30"/><rect x="276" y="50" width="22" height="30"/><rect x="302" y="50" width="22" height="30"/><rect x="328" y="50" width="22" height="30"/><rect x="354" y="50" width="22" height="30"/><rect x="380" y="50" width="22" height="30"/><rect x="406" y="50" width="22" height="30"/><rect x="432" y="50" width="22" height="30"/><rect x="458" y="50" width="22" height="30"/><rect x="484" y="50" width="22" height="30"/><rect x="510" y="50" width="22" height="30"/><rect x="536" y="50" width="22" height="30"/><rect x="562" y="50" width="22" height="30"/></g>
      <text class="ts" x="380" y="36" text-anchor="middle">decode: one token per forward pass</text>
      <line class="rule-strong" x1="166" y1="100" x2="166" y2="116"/><text class="ts" x="166" y="130" text-anchor="middle">first token</text>
      <text class="tb" x="600" y="70">total ≈ TTFT + N ÷ tok/s</text>
      <rect class="n" x="16" y="150" width="384" height="86" rx="6"/><text class="tb" x="28" y="172">Prefill: compute-bound</text><text class="ts" x="28" y="192">large matrix multiplications keep the GPU busy;</text><text class="ts" x="28" y="208">grows with the prompt; sets time to first token</text><text class="ts" x="28" y="226">measured: about 0.2 to 0.3 s</text>
      <rect class="n" x="420" y="150" width="384" height="86" rx="6"/><text class="tb" x="432" y="172">Decode: memory-bandwidth-bound</text><text class="ts" x="432" y="192">each pass reads all weights and the KV cache</text><text class="ts" x="432" y="208">to do little arithmetic; sets tokens per second</text><text class="ts" x="432" y="226">measured: 176 tokens/s, one stream</text>
    </svg>