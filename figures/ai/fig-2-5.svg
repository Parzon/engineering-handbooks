<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 230" role="img" aria-label="The reference service's typical request, to scale: instructions 401 tokens, 20 alerts 685, 4 runbook sections 304, a prompt of 1,318 tokens at the median; then an answer of 172 tokens at the median including hidden reasoning, under an output cap of 800. Reasoning tokens are output: they count against the cap and are billed. At the model's default reasoning effort, 3 of 5 answers spent all 800 tokens thinking and said nothing; at high effort, 4.1 times the answer tokens were billed and 13 of 22 questions went unanswered."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
