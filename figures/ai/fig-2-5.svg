.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="230" fill="#ffffff"/>
      <text class="tl" x="16" y="22">ONE QUESTION, TO SCALE (TOKENS, MEDIAN)</text>
      <rect class="n" x="16" y="34" width="144" height="40" rx="3"/><text class="ts" x="88" y="58" text-anchor="middle">instructions 401</text>
      <rect class="n-acc" x="160" y="34" width="247" height="40" rx="3"/><text class="ts" x="283" y="58" text-anchor="middle">20 alerts 685</text>
      <rect class="n" x="407" y="34" width="109" height="40" rx="3"/><text class="ts" x="461" y="58" text-anchor="middle">4 sections 304</text>
      <rect class="n-good" x="516" y="34" width="62" height="40" rx="3"/><text class="ts" x="547" y="58" text-anchor="middle">172</text>
      <rect class="n-soft dash" x="578" y="34" width="226" height="40" rx="3"/><text class="ts tmu" x="691" y="58" text-anchor="middle">room to the 800 cap</text>
      <text class="ts" x="16" y="96">the prompt: 1,318 tokens at the median</text><text class="ts" x="516" y="96">the answer, reasoning included</text>
      <rect class="n-bad" x="16" y="120" width="788" height="92" rx="6"/>
      <text class="tb tr" x="28" y="142">Reasoning is output</text>
      <text class="ts" x="28" y="164">It counts against the output cap and is billed. At the model's default effort, 3 of 5 answers spent all 800 tokens thinking</text>
      <text class="ts" x="28" y="182">and said nothing; at high effort, 4.1× the answer tokens were billed and 13 of 22 questions went unanswered. An empty answer</text>
      <text class="ts" x="28" y="200">is an error, never a blank success; a "length" finish means the answer was cut off. More reasoning is not more safety.</text>
    </svg>