<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" role="img" aria-label="A 48 GB GPU. A 20-billion-parameter model's weights take about 40 GB at 16 bits per parameter and about 10 GB at 4 bits, before the KV cache, activations and runtime overhead. The rest of memory holds KV cache for concurrent sequences. Precision: FP32 4 bytes, FP16 and BF16 2 bytes, the serving default; INT8 and FP8 1 byte; 4-bit formats such as GGUF Q4, AWQ and GPTQ. Fewer bytes mean less memory and usually faster decode, because decode is memory-bound; the price is quality, often fine for chat and worse for math, code and long reasoning."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #7b2d84; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #f5e9f6; stroke: #7b2d84; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #7b2d84; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #7b2d84; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #7b2d84; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="260" fill="#ffffff"/>
      <text class="tl" x="16" y="22">ONE 48 GB GPU, A 20B MODEL</text>
      <text class="ts" x="16" y="52">16-bit</text><rect class="n-acc" x="80" y="38" width="600" height="22" rx="3"/><text class="ts" x="380" y="54" text-anchor="middle">weights ≈ 40 GB</text><rect class="n-warn" x="680" y="38" width="120" height="22" rx="3"/><text class="ts" x="740" y="54" text-anchor="middle">8 GB left</text>
      <text class="ts" x="16" y="90">4-bit</text><rect class="n-acc" x="80" y="76" width="150" height="22" rx="3"/><text class="ts" x="155" y="92" text-anchor="middle">≈ 10 GB</text><rect class="n-good" x="230" y="76" width="570" height="22" rx="3"/><text class="ts" x="515" y="92" text-anchor="middle">room for KV cache: more sequences, longer contexts</text>
      <rect class="n" x="16" y="126" width="384" height="118" rx="6"/><text class="tb" x="28" y="148">Precision</text>
      <g class="ts"><text x="28" y="170">FP32: 4 bytes per number</text><text x="28" y="190">FP16, BF16: 2 bytes, the serving default</text><text x="28" y="210">INT8, FP8: 1 byte</text><text x="28" y="230">4-bit: GGUF Q4, AWQ, GPTQ</text></g>
      <rect class="n-warn" x="420" y="126" width="384" height="118" rx="6"/><text class="tb" x="432" y="148">The price is quality, unevenly</text>
      <g class="ts"><text x="432" y="170">often fine for chat; worse for math,</text><text x="432" y="190">code and long reasoning</text><text x="432" y="214">run your own evals on the quantized</text><text x="432" y="230">model; never assume</text></g>
    </svg>