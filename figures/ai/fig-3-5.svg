<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" role="img" aria-label="Cost per 1,000 questions for the reference service at list prices: GPT-5 mini 0.67 dollars; Claude Haiku 4.5 2.16; Claude Sonnet 5 4.33; one rented GPU running a 20-billion-parameter model around the clock at 33,000 questions a month, about 41 dollars per 1,000, roughly 60 times GPT-5 mini. Break-even against GPT-5 mini is about 2 million questions a month. Self-hosting pays when the GPU stays busy, or when data may not leave."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
