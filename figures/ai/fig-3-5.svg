.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="250" fill="#ffffff"/>
      <text class="tl" x="16" y="22">PER 1,000 QUESTIONS, LIST PRICES (LOG SCALE)</text>
      <line class="rule" x1="200" y1="34" x2="200" y2="186"/>
      <text class="ts" x="16" y="56">GPT-5 mini</text><rect class="fill-good" x="200" y="44" width="124" height="18"/><text class="ts" x="332" y="58">$0.67</text>
      <text class="ts" x="16" y="92">Claude Haiku 4.5</text><rect class="fill-acc" x="200" y="80" width="200" height="18"/><text class="ts" x="408" y="94">$2.16</text>
      <text class="ts" x="16" y="128">Claude Sonnet 5</text><rect class="fill-acc" x="200" y="116" width="245" height="18"/><text class="ts" x="453" y="130">$4.33</text>
      <text class="ts" x="16" y="164">self-hosted, 33k/month</text><rect class="n-bad" x="200" y="152" width="392" height="18"/><text class="ts" x="600" y="166">≈ $41: idle time is paid for</text>
      <text class="ts" x="16" y="212"><tspan class="tb">Break-even</tspan> against GPT-5 mini: about 2 million questions a month, near 40% of what eight batched slots can serve.</text>
      <text class="ts" x="16" y="232">It leaves out the people who run it, and assumes the smaller model answers as well, which the evals must show first.</text>
