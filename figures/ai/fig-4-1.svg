<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" role="img" aria-label="The RAG pipeline: documents, ingestion, parsing, chunking, embedding, indexing, retrieval with filtering, fusion and reranking, context construction, prompt, generation, answer, evaluation. Diagnose by walking backwards from the answer and stopping at the first stage that is wrong: is the check right; did the model misuse the right chunk; does a prompt rule misfire; was the right chunk retrieved then cut or buried; did one retriever find it and fusion rank it down; which retriever finds it at all; is the answer split across chunks; did the splitter cut in the wrong place; is the document stored, current and embedded with today's settings."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #7b2d84; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #f5e9f6; stroke: #7b2d84; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #7b2d84; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #7b2d84; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #7b2d84; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="300" fill="#ffffff"/>
      <g class="ts">
      <rect class="n" x="16" y="20" width="118" height="34" rx="4"/><text x="75" y="42" text-anchor="middle">ingestion</text>
      <rect class="n" x="148" y="20" width="100" height="34" rx="4"/><text x="198" y="42" text-anchor="middle">parsing</text>
      <rect class="n" x="262" y="20" width="100" height="34" rx="4"/><text x="312" y="42" text-anchor="middle">chunking</text>
      <rect class="n" x="376" y="20" width="110" height="34" rx="4"/><text x="431" y="42" text-anchor="middle">embedding</text>
      <rect class="n" x="500" y="20" width="96" height="34" rx="4"/><text x="548" y="42" text-anchor="middle">indexing</text>
      <rect class="n-acc" x="610" y="20" width="194" height="34" rx="4"/><text x="707" y="42" text-anchor="middle">retrieval + filtering</text>
      <rect class="n-acc" x="610" y="76" width="194" height="34" rx="4"/><text x="707" y="98" text-anchor="middle">fusion, reranking</text>
      <rect class="n" x="456" y="76" width="140" height="34" rx="4"/><text x="526" y="98" text-anchor="middle">context</text>
      <rect class="n" x="352" y="76" width="90" height="34" rx="4"/><text x="397" y="98" text-anchor="middle">prompt</text>
      <rect class="n" x="226" y="76" width="112" height="34" rx="4"/><text x="282" y="98" text-anchor="middle">generation</text>
      <rect class="n" x="120" y="76" width="92" height="34" rx="4"/><text x="166" y="98" text-anchor="middle">answer</text>
      <rect class="n-warn" x="16" y="76" width="90" height="34" rx="4"/><text x="61" y="98" text-anchor="middle">evaluation</text>
      </g>
      <g class="e"><line x1="135" y1="37" x2="146" y2="37" marker-end="url(#a)"/><line x1="249" y1="37" x2="260" y2="37" marker-end="url(#a)"/><line x1="363" y1="37" x2="374" y2="37" marker-end="url(#a)"/><line x1="487" y1="37" x2="498" y2="37" marker-end="url(#a)"/><line x1="597" y1="37" x2="608" y2="37" marker-end="url(#a)"/><line x1="707" y1="55" x2="707" y2="74" marker-end="url(#a)"/><line x1="609" y1="93" x2="598" y2="93" marker-end="url(#a)"/><line x1="455" y1="93" x2="444" y2="93" marker-end="url(#a)"/><line x1="351" y1="93" x2="340" y2="93" marker-end="url(#a)"/><line x1="225" y1="93" x2="214" y2="93" marker-end="url(#a)"/><line x1="119" y1="93" x2="108" y2="93" marker-end="url(#a)"/></g>
      <text class="tl" x="16" y="144">DIAGNOSE BACKWARDS; STOP AT THE FIRST STAGE THAT IS WRONG</text>
      <g class="ts">
      <text x="16" y="168">1 Is the check right? Read the answer, not just the score.</text>
      <text x="16" y="186">2 Did the model have the right chunk and misuse it? (generation)</text>
      <text x="16" y="204">3 Does a prompt rule misfire? (prompt)</text>
      <text x="16" y="222">4 Was the right chunk retrieved, then cut or buried? (context)</text>
      <text x="16" y="240">5 Did one retriever find it, and fusion rank it down? (fusion)</text>
      <text x="440" y="168">6 Which retriever finds it at all, at what distance?</text>
      <text x="440" y="186">7 Is the answer split across chunks, or diluted?</text>
      <text x="440" y="204">8 Did the splitter cut in the wrong place?</text>
      <text x="440" y="222">9 Is the document stored, current, and embedded</text>
      <text x="440" y="240">   the way today's settings embed?</text>
      </g>
      <text class="ts tmu" x="16" y="280">Everything after the first wrong stage only looks wrong.</text>
    </svg>