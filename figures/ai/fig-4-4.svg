<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" role="img" aria-label="The overfiltering trap, measured on 50,000 sections in 100 teams, as a viewer of one team. The HNSW index returns its nearest 40 candidates and the team filter runs after: all 40 belonged to other teams, so 0 of 20 results, in 5 milliseconds. With iterative scans on, 20 of 20 in 32 to 71 milliseconds, after discarding 3,032 rows. Comparing every row with no index: 20 in 6.5 milliseconds. The service's query, a plain team_id = ANY filter the planner can use first: 20 in 0.8 to 1.6 milliseconds."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #7b2d84; }
.tg { fill: #2b7a3d; }
