.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="260" fill="#ffffff"/>
      <text class="tl" x="16" y="22">50,000 SECTIONS IN 100 TEAMS; ONE TEAM'S VIEWER ASKS FOR 20</text>
      <text class="ts" x="16" y="58">index, filter after</text><rect class="n-bad" x="230" y="44" width="20" height="20" rx="2"/><text class="ts" x="258" y="59">0 of 20 found, 5 ms: all 40 candidates were other teams'</text>
      <text class="ts" x="16" y="98">index, iterative scans</text><rect class="fill-acc" x="230" y="84" width="400" height="20"/><text class="ts" x="638" y="99">20, 32-71 ms</text>
      <text class="ts" x="16" y="138">every row, no index</text><rect class="fill-acc" x="230" y="124" width="400" height="20"/><text class="ts" x="638" y="139">20, 6.5 ms</text>
      <text class="ts tb" x="16" y="178">plain team filter</text><rect class="fill-good" x="230" y="164" width="400" height="20"/><text class="ts" x="638" y="179">20, 0.8-1.6 ms</text>
      <text class="ts" x="16" y="218">Hidden behind an OR, "(all teams OR team in ...)", the filter could not be used first; row-level security's own policy is such</text>
      <text class="ts" x="16" y="236">an OR, so it is a second barrier, not the plan. Never retrieve a global top k and filter in the application.</text>
    </svg>