<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" role="img" aria-label="Measured on 8 runbooks, 31 sections, 19 answerable labeled questions and 3 that nothing answers. Hybrid search with nomic-embed-text: recall at 1 is 0.79, at 3 is 0.95, at 5 is 1.00; MRR 0.87. Keyword search alone: recall at 1 is 0.68, at 5 is 0.95; MRR 0.77. All three embedding models tried found every answer in the first five; differences at rank 1 were two questions of nineteen, noise at this size."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
