  </defs><rect width="820" height="250" fill="#ffffff"/>
      <text class="tl" x="16" y="22">RECALL@K AND MRR, 19 LABELED QUESTIONS</text>
      <line class="rule" x1="150" y1="34" x2="150" y2="176"/><line class="rule dash" x1="550" y1="34" x2="550" y2="176"/><text class="ts tmu" x="550" y="190" text-anchor="middle">1.00</text>
      <text class="ts" x="16" y="54">recall@1</text><rect class="fill-acc" x="150" y="42" width="316" height="14"/><text class="ts" x="474" y="54">0.79 hybrid</text><rect class="n-soft" x="150" y="58" width="272" height="10"/><text class="ts tmu" x="430" y="68">0.68 keyword</text>
      <text class="ts" x="16" y="96">recall@3</text><rect class="fill-acc" x="150" y="84" width="380" height="14"/><text class="ts" x="538" y="96">0.95</text>
      <text class="ts" x="16" y="128">recall@5</text><rect class="fill-acc" x="150" y="116" width="400" height="14"/><text class="ts" x="558" y="128">1.00</text><rect class="n-soft" x="150" y="132" width="380" height="10"/><text class="ts tmu" x="538" y="142">0.95 keyword</text>
      <text class="ts" x="16" y="166">MRR</text><rect class="fill-acc" x="150" y="154" width="348" height="14"/><text class="ts" x="506" y="166">0.87</text><rect class="n-soft" x="150" y="170" width="308" height="10"/><text class="ts tmu" x="466" y="180">0.77</text>
      <text class="ts" x="16" y="216"><tspan class="tb">recall@k:</tspan> a relevant chunk is in the top k; it bounds the answer. <tspan class="tb">MRR:</tspan> the mean of 1 ÷ rank of the first relevant chunk.</text>
      <text class="ts" x="16" y="236"><tspan class="tb">Read the benchmark's size:</tspan> 19 questions show that each model works; they cannot rank models two questions apart.</text>
    </svg>