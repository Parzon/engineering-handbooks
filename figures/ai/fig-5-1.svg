<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" role="img" aria-label="An operations knowledge graph. An alert FIRED_ON the Payments API. The Payments API DEPENDS_ON Postgres and is OWNED_BY the Payments team. A runbook COVERS Postgres. A deployment was DEPLOYED_TO the Payments API. An incident INCLUDES the alert and is LIKELY_CAUSED_BY the deployment, with a confidence. Each edge carries provenance: its source, as-of time and confidence."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
