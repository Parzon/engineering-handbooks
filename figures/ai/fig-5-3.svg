<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 240" role="img" aria-label="Start from decisions, not data. One: write 10 to 20 competency questions the graph must answer. Two: apply a value test to each: asked often or costly today, the answer lives in relationships, someone changes an action because of it, and you can name that person. Three: try cheaper tools first: a SQL join, a recursive query, a search index. Four: baseline: does GraphRAG beat vector plus keyword RAG on the eval set? If not, stop. Five: build the smallest slice, one domain and one consumer, 5 to 10 entity types and 10 relationship types. Six: set a kill criterion up front, such as no consumer after a quarter."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #7b2d84; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #f5e9f6; stroke: #7b2d84; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #7b2d84; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #7b2d84; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #7b2d84; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="240" fill="#ffffff"/>
      <g class="ts">
      <rect class="n" x="16" y="16" width="250" height="60" rx="5"/><text x="28" y="40" class="tb">1 Competency questions</text><text x="28" y="60">10-20 the graph must answer</text>
      <rect class="n" x="285" y="16" width="250" height="60" rx="5"/><text x="297" y="40" class="tb">2 Value test, per question</text><text x="297" y="60">asked often; answer in relationships</text>
      <rect class="n" x="554" y="16" width="250" height="60" rx="5"/><text x="566" y="40" class="tb">3 Cheaper tools first</text><text x="566" y="60">a join, a recursive query, search</text>
      <rect class="n-warn" x="554" y="100" width="250" height="60" rx="5"/><text x="566" y="124" class="tb">4 Baseline</text><text x="566" y="144">beat vector + keyword RAG, or stop</text>
      <rect class="n-acc" x="285" y="100" width="250" height="60" rx="5"/><text x="297" y="124" class="tb">5 The smallest slice</text><text x="297" y="144">one domain, one consumer</text>
      <rect class="n-bad" x="16" y="100" width="250" height="60" rx="5"/><text x="28" y="124" class="tb">6 A kill criterion</text><text x="28" y="144">no consumer after a quarter: stop</text>
      </g>
      <line class="e" x1="267" y1="46" x2="283" y2="46" marker-end="url(#a)"/><line class="e" x1="536" y1="46" x2="552" y2="46" marker-end="url(#a)"/><line class="e" x1="679" y1="77" x2="679" y2="98" marker-end="url(#a)"/><line class="e" x1="553" y1="130" x2="537" y2="130" marker-end="url(#a)"/><line class="e" x1="284" y1="130" x2="268" y2="130" marker-end="url(#a)"/>
      <text class="ts" x="16" y="196">The value test: the question is asked often or is costly to answer today; the answer lives in the relationships; someone changes</text>
      <text class="ts" x="16" y="214">an action because of it; and you can name that person. The failure to avoid: an enterprise-wide program with no user.</text>
    </svg>