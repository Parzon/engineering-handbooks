<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 240" role="img" aria-label="People design: the schema driven by the questions, which source is trusted for which fact, identity rules, and a sampled review; a domain expert and an engineer. Machines populate, in order of trust: pipelines from systems of record such as a service catalog, ticketing, an org chart or code dependencies; curated sources such as editors' taxonomy tags; language-model extraction from text with a reviewed sample and low-confidence facts routed to a person; and unreviewed extraction only for low-stakes uses with measured precision. Schema-free extraction is an experiment, not a foundation."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #7b2d84; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #f5e9f6; stroke: #7b2d84; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #7b2d84; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #7b2d84; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #7b2d84; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="240" fill="#ffffff"/>
      <rect class="n-acc" x="16" y="16" width="260" height="190" rx="6"/><text class="tb" x="28" y="40">People design</text>
      <g class="ts"><text x="28" y="66">the schema, from the questions</text><text x="28" y="88">which source is trusted for which fact</text><text x="28" y="110">identity rules: "PG" = "Postgres"</text><text x="28" y="132">a sampled review</text><text x="28" y="166">a domain expert and an engineer</text></g>
      <text class="tl" x="300" y="30">MACHINES POPULATE, MOST TRUSTED FIRST</text>
      <rect class="n-good" x="300" y="42" width="504" height="34" rx="4"/><text class="ts" x="312" y="64"><tspan class="tb">1</tspan> pipelines from systems of record: catalog, ticketing, org chart, code</text>
      <rect class="n" x="300" y="82" width="504" height="34" rx="4"/><text class="ts" x="312" y="104"><tspan class="tb">2</tspan> curated sources: editors' taxonomy tags</text>
      <rect class="n-warn" x="300" y="122" width="504" height="34" rx="4"/><text class="ts" x="312" y="144"><tspan class="tb">3</tspan> model extraction: a reviewed sample; low confidence to a person</text>
      <rect class="n-bad" x="300" y="162" width="504" height="34" rx="4"/><text class="ts" x="312" y="184"><tspan class="tb">4</tspan> unreviewed extraction: low-stakes only, precision measured</text>
      <text class="ts" x="16" y="228">Schema-free extraction ("find the entities") gives many names for one thing and dozens of near-identical relationship types.</text>
    </svg>