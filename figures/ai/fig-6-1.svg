<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 270" role="img" aria-label="The ladder of architectures, simplest first: one model call; one call with retrieved context; a workflow, where code decides the steps; one agent with tools, where the model decides; several agents. Climb a rung only when a measurement shows the lower one falls short. Workflow patterns: prompt chaining with checks between steps; routing by classification; parallelization by sectioning or voting; orchestrator and workers; evaluator and optimizer loops. Do not use an agent when the steps are known, when latency or cost matters, when results must be predictable and auditable, or with a small model. An agent pays for open-ended work where the next step depends on what the last one found."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #7b2d84; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #f5e9f6; stroke: #7b2d84; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #7b2d84; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #7b2d84; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #7b2d84; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="270" fill="#ffffff"/>
      <g class="ts">
      <rect class="n-good" x="16" y="190" width="150" height="40" rx="4"/><text x="91" y="214" text-anchor="middle">1 one call</text>
      <rect class="n-good" x="176" y="150" width="150" height="80" rx="4"/><text x="251" y="214" text-anchor="middle">2 + retrieval</text>
      <rect class="n-acc" x="336" y="110" width="150" height="120" rx="4"/><text x="411" y="214" text-anchor="middle">3 a workflow</text>
      <rect class="n-warn" x="496" y="70" width="150" height="160" rx="4"/><text x="571" y="214" text-anchor="middle">4 one agent</text>
      <rect class="n-bad" x="656" y="30" width="148" height="200" rx="4"/><text x="730" y="214" text-anchor="middle">5 several agents</text>
      </g>
      <text class="ts" x="350" y="134">code decides</text><text class="ts" x="350" y="150">the steps</text>
      <text class="ts" x="510" y="94">the model decides</text><text class="ts" x="510" y="110">its steps</text>
      <text class="ts" x="668" y="54">supervisor, workers,</text><text class="ts" x="668" y="70">handoffs</text>
      <text class="ts" x="16" y="30"><tspan class="tb">Climb only on a measurement.</tspan></text><text class="ts" x="16" y="50">Each rung costs more tokens, latency</text><text class="ts" x="16" y="66">and predictability than the last.</text>
      <text class="ts" x="16" y="256">Workflow patterns: prompt chaining · routing · parallelization · orchestrator-workers · evaluator-optimizer</text>
    </svg>