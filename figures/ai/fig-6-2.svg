<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 270" role="img" aria-label="Measured on the reference service's eval suite of 19 cases, three runs each, with a 20-billion-parameter model. Cases passed in all runs: pipeline 18, agent with its first prompt 14, agent with its second prompt 17. Prompt tokens per answer: 485, 1,553, 1,841. Model calls per answer: 1, 2.5, 2.7. First token at the median: 0.27, 0.50, 0.62 seconds. Under the first prompt the agent filtered too hard, picked the wrong tool, and stopped after an empty result."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
