.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="270" fill="#ffffff"/>
      <text class="tl" x="16" y="22">PIPELINE AGAINST AGENT, SAME DATA AND RETRIEVAL CODE</text>
      <g class="ts">
      <text x="230" y="48" class="tb" text-anchor="middle">Pipeline</text><text x="430" y="48" class="tb" text-anchor="middle">Agent, prompt 1</text><text x="640" y="48" class="tb" text-anchor="middle">Agent, prompt 2</text>
      <line class="rule" x1="16" y1="58" x2="804" y2="58"/>
      <text x="16" y="82">cases passed (of 19)</text><text x="230" y="82" text-anchor="middle" class="tb tg">18</text><text x="430" y="82" text-anchor="middle" class="tb tr">14</text><text x="640" y="82" text-anchor="middle" class="tb">17</text>
      <text x="16" y="110">prompt tokens per answer</text><text x="230" y="110" text-anchor="middle">485</text><text x="430" y="110" text-anchor="middle">1,553</text><text x="640" y="110" text-anchor="middle">1,841 (3.8×)</text>
      <text x="16" y="138">model calls per answer</text><text x="230" y="138" text-anchor="middle">1</text><text x="430" y="138" text-anchor="middle">2.5</text><text x="640" y="138" text-anchor="middle">2.7</text>
      <text x="16" y="166">first token, median</text><text x="230" y="166" text-anchor="middle">0.27 s</text><text x="430" y="166" text-anchor="middle">0.50 s</text><text x="640" y="166" text-anchor="middle">0.62 s (2.3×)</text>
      <line class="rule" x1="16" y1="178" x2="804" y2="178"/>
      </g>
      <text class="ts" x="16" y="204"><tspan class="tb">Under prompt 1:</tspan> "critical alerts matter most" became a filter that hid the cause; it searched runbooks when the answer</text>
      <text class="ts" x="16" y="222">was an alert; it stopped after an empty result. <tspan class="tb">Prompt 2</tspan> told it to read what the pipeline reads.</text>
      <text class="ts" x="16" y="250"><tspan class="tb">The lesson:</tspan> making the agent reliable meant scripting it back into the pipeline. When the steps are known, code them.</text>
    </svg>