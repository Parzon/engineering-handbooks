<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" role="img" aria-label="The loop. The messages start as the system prompt and the question. Call the model, offering the tools. If it asks for tools, run each call and append each result as a tool message under the call's id, then loop. If it asks for none, it has answered. Guards: a step limit, after which one last call offers no tools and forces an answer; the same call with the same arguments twice is refused; a timeout per tool and for the whole answer; optionally a token budget. A failed tool returns an error the model can read and correct; retries of transient failures belong to the tool, not the model."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #7b2d84; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #f5e9f6; stroke: #7b2d84; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #7b2d84; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #7b2d84; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #7b2d84; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="260" fill="#ffffff"/>
      <rect class="n" x="16" y="40" width="160" height="60" rx="6"/><text class="tb" x="28" y="64">messages</text><text class="ts" x="28" y="84">system + question</text>
      <rect class="n-acc" x="226" y="40" width="180" height="60" rx="6"/><text class="tb" x="238" y="64">call the model</text><text class="ts" x="238" y="84">tools offered</text>
      <rect class="n-warn" x="456" y="40" width="170" height="60" rx="6"/><text class="tb" x="468" y="64">run each tool</text><text class="ts" x="468" y="84">as the asker, bounded</text>
      <rect class="n-good" x="226" y="150" width="180" height="56" rx="6"/><text class="tb" x="238" y="174">answer</text><text class="ts" x="238" y="192">no tool asked for</text>
      <line class="e" x1="177" y1="70" x2="224" y2="70" marker-end="url(#a)"/>
      <line class="e" x1="407" y1="62" x2="454" y2="62" marker-end="url(#a)"/><text class="ts" x="430" y="54" text-anchor="middle">tool calls</text>
      <path class="e" d="M541,101 C541,126 316,126 316,103" marker-end="url(#a)"/><text class="ts" x="430" y="138" text-anchor="middle">append results, loop</text>
      <line class="e-good" x1="316" y1="101" x2="316" y2="148" marker-end="url(#a-good)"/>
      <rect class="n-soft" x="650" y="16" width="154" height="206" rx="6"/><text class="tb" x="662" y="40">Guards</text>
      <g class="ts"><text x="662" y="64">a step limit; then one</text><text x="662" y="80">call with no tools</text><text x="662" y="104">a repeated call refused</text><text x="662" y="128">a timeout per tool and</text><text x="662" y="144">per answer</text><text x="662" y="168">optional token budget</text><text x="662" y="192">errors returned to the</text><text x="662" y="208">model, never a crash</text></g>
      <text class="ts" x="16" y="244">Tool calls stream as fragments from some providers and whole from others: accumulate by index until the model says it wants tools.</text>
    </svg>