      <rect class="n-acc" x="30" y="150" width="130" height="36" rx="4"/><text class="ts" x="95" y="173" text-anchor="middle">client B</text>
      <text class="ts" x="30" y="210">client primitives: sampling, elicitation, roots</text>
      <rect class="n" x="330" y="40" width="220" height="80" rx="6"/><text class="tb" x="342" y="64">Local server (stdio)</text><text class="ts" x="342" y="84">a subprocess; stdout belongs</text><text class="ts" x="342" y="100">to the protocol</text>
      <rect class="n" x="330" y="140" width="220" height="80" rx="6"/><text class="tb" x="342" y="164">Remote server</text><text class="ts" x="342" y="184">Streamable HTTP,</text><text class="ts" x="342" y="200">authorized with OAuth 2.1</text>
      <path class="e" d="M161,122 C250,122 250,80 328,80" marker-end="url(#a)"/><path class="e" d="M161,168 C250,168 250,180 328,180" marker-end="url(#a)"/>
      <rect class="n-soft" x="580" y="40" width="224" height="180" rx="6"/><text class="tb" x="592" y="64">Server primitives</text><text class="ts" x="592" y="88">tools: the model calls them</text><text class="ts" x="592" y="110">resources: data the app reads</text><text class="ts" x="592" y="132">prompts: templates a user picks</text><text class="tb" x="592" y="164">The wire</text><text class="ts" x="592" y="186">JSON-RPC 2.0:</text><text class="ts" x="592" y="202">tools/list, tools/call</text>
      <text class="ts" x="16" y="262"><tspan class="tb">Two kinds of error:</tspan> an unknown tool is a protocol error; a tool that ran and failed returns a result marked</text>
      <text class="ts" x="16" y="280"><tspan class="tm">isError</tspan>, which the model can read and correct.</text>
    </svg>