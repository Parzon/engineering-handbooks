<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" role="img" aria-label="Three places an agent can run. Your code: a Python service whose loop, tools, prompts and evaluations live in your repository; you host it, on ECS or Kubernetes for example, and you build sign-in, sessions, sandboxing and tracing. n8n: a workflow of nodes, where a trigger starts it and an AI Agent node with sub-nodes for the chat model, memory and tools runs the loop; it runs on n8n Cloud or on your own n8n instance, with Postgres and, to scale, Redis and workers; credentials are stored in n8n. AWS AgentCore: either the harness, where you declare the model, tools and prompt and AgentCore runs the loop, or Runtime, where your agent code in any framework runs in a container; each session gets its own microVM, and Gateway, Identity, Memory and Observability are managed services around it. Along the bottom: on the left you own the most and operate the most; on the right AWS operates the infrastructure."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #7b2d84; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #f5e9f6; stroke: #7b2d84; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #7b2d84; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #7b2d84; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #7b2d84; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="340" fill="#ffffff"/>
      <rect class="n" x="16" y="16" width="252" height="244" rx="8"/>
      <text class="tl" x="30" y="38">YOUR CODE</text>
      <text class="tb" x="30" y="62">A Python service</text>
      <text class="ts" x="30" y="84">loop, tools, prompts and evals</text>
      <text class="ts" x="30" y="100">in your repository</text>
      <text class="ts" x="30" y="124">tools act as the asking user,</text>
      <text class="ts" x="30" y="140">tested with the rest of the code</text>
      <rect class="n-soft" x="30" y="160" width="224" height="86" rx="5"/>
      <text class="ts" x="42" y="180">you host it: ECS, Kubernetes</text>
      <text class="ts" x="42" y="198">you build: sign-in, sessions,</text>
      <text class="ts" x="42" y="214">sandboxing, tracing</text>
      <text class="ts tmu" x="42" y="236">the reference service</text>

      <rect class="n" x="284" y="16" width="252" height="244" rx="8"/>
      <text class="tl" x="298" y="38">N8N</text>
      <text class="tb" x="298" y="62">A workflow of nodes</text>
      <text class="ts" x="298" y="84">a trigger starts it; an AI Agent</text>
      <text class="ts" x="298" y="100">node runs the loop, with sub-</text>
      <text class="ts" x="298" y="116">nodes: chat model, memory, tools</text>
      <text class="ts" x="298" y="140">hundreds of app integrations</text>
      <rect class="n-soft" x="298" y="160" width="224" height="86" rx="5"/>
      <text class="ts" x="310" y="180">n8n Cloud, or your instance:</text>
      <text class="ts" x="310" y="198">Docker, Postgres; to scale,</text>
      <text class="ts" x="310" y="214">Redis and workers</text>
      <text class="ts tmu" x="310" y="236">credentials stored in n8n</text>

      <rect class="n-acc" x="552" y="16" width="252" height="244" rx="8"/>
      <text class="tl" x="566" y="38">AWS AGENTCORE</text>
      <text class="tb" x="566" y="62">Harness or Runtime</text>
      <text class="ts" x="566" y="84">harness: declare model, tools,</text>
      <text class="ts" x="566" y="100">prompt; AgentCore runs the loop</text>
      <text class="ts" x="566" y="116">Runtime: your agent code, any</text>
      <text class="ts" x="566" y="132">framework, in a container</text>
      <rect class="n-soft" x="566" y="160" width="224" height="86" rx="5"/>
      <text class="ts" x="578" y="180">a microVM per session</text>
      <text class="ts" x="578" y="198">managed around it: Gateway,</text>
      <text class="ts" x="578" y="214">Identity, Memory, Observability</text>
      <text class="ts tmu" x="578" y="236">AWS runs the infrastructure</text>

      <line class="rule-strong" x1="40" y1="290" x2="780" y2="290"/>
      <text class="ts" x="40" y="284">you own and operate the most</text>
      <text class="ts" x="780" y="284" text-anchor="end">the platform operates the most</text>
      <text class="ts tmu" x="410" y="314" text-anchor="middle">All three can use the same patterns: a workflow or an agent, tools over MCP, a person approving actions.</text>
      <text class="ts tmu" x="410" y="330" text-anchor="middle">What differs is who builds and runs the parts around the model.</text>
    </svg>