<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" role="img" aria-label="An n8n agent workflow. A Chat Trigger node starts the workflow. The AI Agent node is a root node; below it hang sub-nodes: a chat model, which is required; memory, optional; and tools, at least one: an HTTP Request tool, a call to another n8n workflow, or an MCP Client Tool that uses an external MCP server's tools. A tool marked for approval pauses the workflow until a person approves in Slack or chat. The agent's answer, as items, passes to a Slack node. If any node fails, the error workflow runs. Items flowing between nodes look like a list of objects with a json key."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #7b2d84; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #f5e9f6; stroke: #7b2d84; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #7b2d84; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #7b2d84; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #7b2d84; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="300" fill="#ffffff"/>
      <rect class="n" x="16" y="40" width="130" height="58" rx="6"/>
      <text class="tb" x="81" y="64" text-anchor="middle">Chat Trigger</text>
      <text class="ts" x="81" y="84" text-anchor="middle">starts the run</text>
      <line class="e" x1="147" y1="69" x2="214" y2="69" marker-end="url(#a)"/>
      <rect class="n-acc" x="218" y="30" width="250" height="78" rx="6"/>
      <text class="tb" x="232" y="54">AI Agent (root node)</text>
      <text class="ts" x="232" y="74">runs the loop: the model picks</text>
      <text class="ts" x="232" y="90">tools until it can answer</text>
      <line class="e" x1="469" y1="69" x2="560" y2="69" marker-end="url(#a)"/>
      <text class="ts tmu" x="514" y="60" text-anchor="middle">items</text>
      <rect class="n" x="564" y="40" width="130" height="58" rx="6"/>
      <text class="tb" x="629" y="64" text-anchor="middle">Slack</text>
      <text class="ts" x="629" y="84" text-anchor="middle">posts the answer</text>
      <rect class="n-soft" x="708" y="40" width="96" height="58" rx="6"/>
      <text class="ts" x="756" y="62" text-anchor="middle">error</text>
      <text class="ts" x="756" y="78" text-anchor="middle">workflow, if</text>
      <text class="ts" x="756" y="94" text-anchor="middle">a node fails</text>

      <line class="e" x1="262" y1="109" x2="140" y2="150" marker-end="url(#a)"/>
      <line class="e" x1="320" y1="109" x2="300" y2="150" marker-end="url(#a)"/>
      <line class="e" x1="400" y1="109" x2="480" y2="150" marker-end="url(#a)"/>
      <text class="tl" x="218" y="134">SUB-NODES</text>
      <rect class="n" x="40" y="154" width="190" height="56" rx="5"/>
      <text class="tb" x="52" y="176">Chat model</text><text class="ts" x="52" y="194">required: one per agent</text>
      <rect class="n" x="246" y="154" width="150" height="56" rx="5"/>
      <text class="tb" x="258" y="176">Memory</text><text class="ts" x="258" y="194">optional: chat history</text>
      <rect class="n-acc" x="412" y="154" width="392" height="56" rx="5"/>
      <text class="tb" x="424" y="176">Tools, at least one</text>
      <text class="ts" x="424" y="194">HTTP Request · another workflow · MCP Client Tool</text>
      <rect class="n-soft" x="412" y="222" width="392" height="40" rx="5"/>
      <text class="ts" x="424" y="246">a tool marked for approval pauses until a person approves</text>
      <text class="tm ts" x="16" y="250">[ {"json": {...}}, {"json": {...}} ]</text>
      <text class="ts tmu" x="16" y="268">what flows between nodes: items</text>
    </svg>