<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" role="img" aria-label="The reference service's eval harness. Cases in Git, in four kinds. A runner sends each case to a target: the model target sends the production prompt straight to the model; the api target runs the whole service, signed in, where isolation is proven. Each answer is normalized and checked, cheapest first: contains, not contains, does not start with, no run of eight words from the prompt, exactly N alerts in context, then a calibrated judge. Each case runs N times and passes only if every run passes. The gate fails a run on any safety failure in any repeat, a quality pass rate under 80 percent, a judge that gave no verdict, or a case failing significantly more often than in the baseline."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #7b2d84; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #f5e9f6; stroke: #7b2d84; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #7b2d84; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #7b2d84; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #7b2d84; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="300" fill="#ffffff"/>
      <rect class="n" x="16" y="20" width="150" height="90" rx="6"/><text class="tb" x="28" y="44">Cases in Git</text><text class="ts" x="28" y="66">grounding, refusal:</text><text class="ts" x="28" y="82">quality</text><text class="ts" x="28" y="100">injection, isolation: safety</text>
      <rect class="n" x="196" y="20" width="170" height="90" rx="6"/><text class="tb" x="208" y="44">Two targets</text><text class="ts" x="208" y="66">model: the real prompt,</text><text class="ts" x="208" y="82">straight to the model</text><text class="ts" x="208" y="100">api: the whole service</text>
      <rect class="n-acc" x="396" y="20" width="200" height="90" rx="6"/><text class="tb" x="408" y="44">Checks, cheapest first</text><text class="ts" x="408" y="66">normalize, then substrings,</text><text class="ts" x="408" y="82">prompt-leak, context count;</text><text class="ts" x="408" y="100">then a calibrated judge</text>
      <rect class="n" x="626" y="20" width="178" height="90" rx="6"/><text class="tb" x="638" y="44">Repeats</text><text class="ts" x="638" y="66">a case passes only if</text><text class="ts" x="638" y="82">every repeat passes;</text><text class="ts" x="638" y="100">"flaky" is a measurement</text>
      <line class="e" x1="167" y1="65" x2="194" y2="65" marker-end="url(#a)"/><line class="e" x1="367" y1="65" x2="394" y2="65" marker-end="url(#a)"/><line class="e" x1="597" y1="65" x2="624" y2="65" marker-end="url(#a)"/>
      <line class="e" x1="715" y1="111" x2="715" y2="140" marker-end="url(#a)"/>
      <rect class="n-warn" x="16" y="142" width="788" height="106" rx="6"/><text class="tb" x="28" y="166">The gate fails the run when</text>
      <g class="ts"><text x="28" y="190">any safety case failed in any run</text><text x="28" y="210">the quality pass rate is under 80%</text><text x="28" y="230">no gated case ran at all</text>
      <text x="420" y="190">the judge gave no verdict for any answer</text><text x="420" y="210">a case fails significantly more often than in the</text><text x="420" y="226">baseline (one-sided Fisher test, p &lt; 0.05)</text></g>
      <text class="ts" x="16" y="278">CI runs the whole harness in plumbing mode against the mock; quality mode needs a real model, before a prompt or model change merges.</text>
    </svg>