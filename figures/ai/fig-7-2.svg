<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" role="img" aria-label="Three curves of the chance of seeing at least one failure against the number of runs, on a log scale from 1 to 1,000. For a 10 percent failure rate the chance passes 95 percent at 30 runs; for 2.5 percent at 120 runs; for 1 percent at 300 runs. At 110 runs, a 2.5 percent failure is seen 94 percent of the time and a 1 percent failure only 67 percent."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
