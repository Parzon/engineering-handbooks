<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 290" role="img" aria-label="Four judge failures that calibration caught, each silent until measured. One: every judge check passed because the judge inherited a reasoning parameter it does not support and every call failed, and missing verdicts were read as passes; now a missing verdict fails the gate. Two: an ambiguous criterion was read the lenient way; fixed with a precise one. Three: a question-and-answer layout made the judge grade correctness instead of the criterion, so 'The capital of France is Paris' passed as a refusal; fixed with tagged sections and 'judge the criterion only'. Four: negated criteria passed wrong answers; fixed by stating the wanted behavior positively, which scored 15 of 15 against 9 or 12."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #7b2d84; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #f5e9f6; stroke: #7b2d84; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #7b2d84; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #7b2d84; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #7b2d84; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="290" fill="#ffffff"/>
      <rect class="n-bad" x="16" y="16" width="384" height="118" rx="6"/><text class="tb" x="28" y="40">1 Every check "passed"</text><text class="ts" x="28" y="62">the judge inherited a parameter it does not</text><text class="ts" x="28" y="78">support; every call failed, and missing</text><text class="ts" x="28" y="94">verdicts were read as passes</text><text class="ts tg" x="28" y="120">fix: a missing verdict fails the gate</text>
      <rect class="n-warn" x="420" y="16" width="384" height="118" rx="6"/><text class="tb" x="432" y="40">2 A regression passed</text><text class="ts" x="432" y="62">"name the disk as the first thing to look at"</text><text class="ts" x="432" y="78">was read the lenient way</text><text class="ts tg" x="432" y="120">fix: "start with the disk, before anything else"</text>
      <rect class="n-warn" x="16" y="150" width="384" height="118" rx="6"/><text class="tb" x="28" y="174">3 "Paris" passed as a refusal</text><text class="ts" x="28" y="196">a Question/Answer layout made the judge</text><text class="ts" x="28" y="212">grade correctness, not the criterion</text><text class="ts tg" x="28" y="254">fix: tagged sections; judge the criterion only</text>
      <rect class="n-warn" x="420" y="150" width="384" height="118" rx="6"/><text class="tb" x="432" y="174">4 Negated criteria passed wrong answers</text><text class="ts" x="432" y="196">"without claiming there are no alerts" was</text><text class="ts" x="432" y="212">misread by a small judge</text><text class="ts tg" x="432" y="238">fix: state the behavior wanted, positively:</text><text class="ts tg" x="432" y="254">15 of 15, against 9 or 12</text>
    </svg>