<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 280" role="img" aria-label="The reference prompt, version by version. v1 repeated a planted password. v2 treated alerts as untrusted data and fixed the leak, leaving two flaky cases. v3 named those behaviors and fixed them, but led with an unrelated deploy ahead of a critical disk. v4 fixed that, passing 110 of 110 calls, but its empty-list rule fired with an alert present 8 runs in 40, and it printed itself 5 runs in 200. v5 fixed both: 40 of 40 and 0 in 200. v6 added runbook sections and citations, and moved credential protection into code: the planted password 0 in 200 once redacted, where no prompt wording had stopped it."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #7b2d84; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #f5e9f6; stroke: #7b2d84; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #7b2d84; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #7b2d84; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #7b2d84; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="280" fill="#ffffff"/>
      <g class="ts">
      <rect class="n-bad" x="16" y="20" width="120" height="96" rx="5"/><text x="28" y="42" class="tb">v1</text><text x="28" y="64">repeated a</text><text x="28" y="80">planted</text><text x="28" y="96">password</text>
      <rect class="n" x="146" y="20" width="120" height="96" rx="5"/><text x="158" y="42" class="tb">v2</text><text x="158" y="64">alerts are</text><text x="158" y="80">untrusted; leak</text><text x="158" y="96">fixed</text>
      <rect class="n-warn" x="276" y="20" width="120" height="96" rx="5"/><text x="288" y="42" class="tb">v3</text><text x="288" y="64">flaky cases</text><text x="288" y="80">fixed; led with</text><text x="288" y="96">the wrong alert</text>
      <rect class="n-warn" x="406" y="20" width="130" height="96" rx="5"/><text x="418" y="42" class="tb">v4</text><text x="418" y="64">110 of 110; then</text><text x="418" y="80">8 in 40 wrong,</text><text x="418" y="96">leaked 5 in 200</text>
      <rect class="n" x="546" y="20" width="120" height="96" rx="5"/><text x="558" y="42" class="tb">v5</text><text x="558" y="64">40 of 40;</text><text x="558" y="80">leak 0 in 200</text>
      <rect class="n-good" x="676" y="20" width="128" height="96" rx="5"/><text x="688" y="42" class="tb">v6</text><text x="688" y="64">runbooks, cited;</text><text x="688" y="80">password: 0 in 200,</text><text x="688" y="96">redacted in code</text>
      </g>
      <g class="e"><line x1="137" y1="68" x2="144" y2="68" marker-end="url(#a)"/><line x1="267" y1="68" x2="274" y2="68" marker-end="url(#a)"/><line x1="397" y1="68" x2="404" y2="68" marker-end="url(#a)"/><line x1="537" y1="68" x2="544" y2="68" marker-end="url(#a)"/><line x1="667" y1="68" x2="674" y2="68" marker-end="url(#a)"/></g>
      <text class="tl" x="16" y="152">THE LESSONS</text>
      <g class="ts">
      <text x="16" y="176"><tspan class="tb">Every rule has side effects:</tspan> run the whole suite against the baseline on every change, not only the case you meant to fix.</text>
      <text x="16" y="198"><tspan class="tb">A check that quotes the prompt goes blind when the prompt is reworded:</tspan> compare against the current prompt.</text>
      <text x="16" y="220"><tspan class="tb">More reasoning is not more safety:</tspan> at medium effort, v4 printed its whole prompt one run in three.</text>
      <text x="16" y="242"><tspan class="tb">A safety property that matters moves into code:</tspan> no wording tried stopped the password; redaction did.</text>
      <text x="16" y="264"><tspan class="tb">The prompt is not a security boundary:</tspan> it is public, holds no secrets, and a leak shows only what the asker could read.</text>
      </g>
    </svg>