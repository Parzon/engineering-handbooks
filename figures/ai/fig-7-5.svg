<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" role="img" aria-label="Four kinds of dataset: golden, small and reviewed by domain experts, changed only deliberately; representative, sampled from real traffic with consent and redaction, refreshed from production; adversarial and edge cases, the safety half that must always pass; synthetic, generated by a model from documents, cheap but biased toward what the generator finds easy. Keep a held-out part you never tune against. Offline evaluation before release catches the failures you thought of; online signals in production catch the unknown, slowly and noisily: feedback, outcomes, guardrail hits, sampled grading, latency and cost. An A/B test needs traffic, a success metric and guardrails; with little traffic, a canary plus offline evals."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #7b2d84; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #f5e9f6; stroke: #7b2d84; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #7b2d84; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #7b2d84; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #7b2d84; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="250" fill="#ffffff"/>
      <g class="ts">
      <rect class="n-good" x="16" y="16" width="190" height="96" rx="5"/><text x="28" y="38" class="tb">Golden</text><text x="28" y="58">tens to hundreds, reviewed</text><text x="28" y="74">by domain experts; changed</text><text x="28" y="90">only deliberately</text>
      <rect class="n" x="216" y="16" width="190" height="96" rx="5"/><text x="228" y="38" class="tb">Representative</text><text x="228" y="58">sampled from real traffic,</text><text x="228" y="74">with consent, redacted;</text><text x="228" y="90">golden sets drift from it</text>
      <rect class="n-warn" x="416" y="16" width="190" height="96" rx="5"/><text x="428" y="38" class="tb">Adversarial</text><text x="428" y="58">injection, other tenants,</text><text x="428" y="74">empty context, off-topic:</text><text x="428" y="90">must pass every run</text>
      <rect class="n-soft" x="616" y="16" width="188" height="96" rx="5"/><text x="628" y="38" class="tb">Synthetic</text><text x="628" y="58">a model writes questions:</text><text x="628" y="74">cheap, biased to the easy;</text><text x="628" y="90">review a sample</text>
      <rect class="n-acc" x="16" y="134" width="384" height="96" rx="6"/><text x="28" y="158" class="tb">Offline: the regression gate</text><text x="28" y="180">the suite, before every prompt, model or</text><text x="28" y="196">retrieval change; catches only the failures</text><text x="28" y="212">you thought of</text>
      <rect class="n" x="420" y="134" width="384" height="96" rx="6"/><text x="432" y="158" class="tb">Online: production signals</text><text x="432" y="180">feedback, escalations, guardrail hits, sampled</text><text x="432" y="196">grading, latency, cost; catches the unknown,</text><text x="432" y="212">slowly; A/B or a canary, by traffic</text>
      </g>
    </svg>