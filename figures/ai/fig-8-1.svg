<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" role="img" aria-label="The trace of one question. The request span carries how many alerts and sections the prompt held, how many credentials were redacted, the outcome, retrieval mode and citations. Under it: SQL for the session and row-level security settings; a retrieval span with the mode, the embedding key and each document's id, fused score, keyword rank, semantic rank and distance; under retrieval, an embeddings span and the hybrid search SQL; the alerts query; and the model span with the prompt name, version and hash, the output limit and reasoning level, the model that answered, time to first chunk, a first token event, token counts, finish reasons and outcome."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #7b2d84; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #f5e9f6; stroke: #7b2d84; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #7b2d84; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #7b2d84; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #7b2d84; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="300" fill="#ffffff"/>
      <g class="ts">
      <rect class="n-acc" x="16" y="16" width="380" height="34" rx="4"/><text x="28" y="38"><tspan class="tb">POST /chat/stream</tspan>: the request</text>
      <rect class="n" x="46" y="58" width="350" height="28" rx="4"/><text x="58" y="77">SELECT: session, row-level security settings</text>
      <rect class="n" x="46" y="92" width="350" height="28" rx="4"/><text x="58" y="111"><tspan class="tb">retrieval runbooks</tspan></text>
      <rect class="n" x="76" y="126" width="320" height="28" rx="4"/><text x="88" y="145">embeddings: the question</text>
      <rect class="n" x="76" y="160" width="320" height="28" rx="4"/><text x="88" y="179">the hybrid search's SQL</text>
      <rect class="n" x="46" y="194" width="350" height="28" rx="4"/><text x="58" y="213">SELECT: the asker's alerts</text>
      <rect class="n-acc" x="46" y="228" width="350" height="34" rx="4"/><text x="58" y="250"><tspan class="tb">chat {model}</tspan>: the whole stream; "first token"</text>
      </g>
      <text class="tl" x="420" y="30">ATTRIBUTES THAT ANSWER "WHY"</text>
      <g class="ts">
      <text x="420" y="54">request: alerts and sections in the prompt,</text><text x="420" y="70">redactions, outcome, citations valid and invented</text>
      <text x="420" y="104">retrieval: mode (hybrid, keyword-only), embedding</text><text x="420" y="120">key; each document's id, score, ranks, distance</text>
      <text x="420" y="154">embeddings: model, input tokens, error type</text>
      <text x="420" y="196">model: prompt name, version and hash; output limit;</text><text x="420" y="212">reasoning level; the model that answered; time to</text><text x="420" y="228">first chunk; tokens; finish reasons; outcome</text>
      </g>
      <text class="ts tmu" x="16" y="290">Every log line of the request carries the same trace id, and so does the stream's first event.</text>
    </svg>