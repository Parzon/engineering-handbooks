<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" role="img" aria-label="Four incidents. Embedding timeout set to one millisecond: the answer looked fine but lost its safety conditions; the trace showed the embedding span in error, retrieval keyword-only, and the 'Free space' section fifth by keyword and cut; metrics showed keyword-only searches and an alert after 15 minutes. Context set to one section: the answer invented a dangerous step; the trace showed top_k 1 and one section; no metric showed anything. Output limit of 60 tokens: the answer stopped after step one; the trace showed finish reason length and outcome truncated; a truncation metric and alert. A changed document prefix: the answer skipped freeing space; the trace showed keyword-only with no current vectors, and a new embedding key hash; metrics showed keyword-only searches and a warning to re-embed."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
