<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" role="img" aria-label="Why content stays out of traces: the service enforces team isolation twice, in its queries and in row-level security, but a trace store shows every trace to whoever can open it; it keeps data on its own retention, often at a vendor; and it escapes deletion requests. Measured with content on: one reader saw a finance user's question about a payroll export failing for 1,200 employees, and another team's runbooks; redaction had removed the password and nothing else. Three patterns: no content, the default, only ids, counts, durations and hashes; content on spans, pre-production only; content in a separate store under its own access control, with references on spans."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #7b2d84; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #f5e9f6; stroke: #7b2d84; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #7b2d84; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #7b2d84; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #7b2d84; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="250" fill="#ffffff"/>
      <rect class="n-bad" x="16" y="16" width="384" height="120" rx="6"/><text class="tb tr" x="28" y="40">A trace store ignores tenancy</text>
      <g class="ts"><text x="28" y="62">isolation is enforced twice in the service, then</text><text x="28" y="78">undone by whoever can open the trace viewer</text><text x="28" y="100">measured: a reader saw another team's question,</text><text x="28" y="116">"payroll export failed for 1,200 employees"</text></g>
      <rect class="n-warn" x="420" y="16" width="384" height="120" rx="6"/><text class="tb" x="432" y="40">Redaction removes formats, not facts</text>
      <g class="ts"><text x="432" y="62">it removed the password in that question,</text><text x="432" y="78">and nothing else</text><text x="432" y="100">and traces keep their own retention, often at</text><text x="432" y="116">a vendor, beyond deletion requests</text></g>
      <text class="tl" x="16" y="166">THREE PATTERNS</text>
      <rect class="n-good" x="16" y="178" width="250" height="56" rx="5"/><text class="tb" x="28" y="200">1 No content: the default</text><text class="ts" x="28" y="220">ids, counts, durations, hashes</text>
      <rect class="n" x="285" y="178" width="250" height="56" rx="5"/><text class="tb" x="297" y="200">2 Content on spans</text><text class="ts" x="297" y="220">pre-production only, redacted</text>
      <rect class="n" x="554" y="178" width="250" height="56" rx="5"/><text class="tb" x="566" y="200">3 A separate store</text><text class="ts" x="566" y="220">its own access rules; ids on spans</text>
    </svg>