<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" role="img" aria-label="The chain: what the model reads, the model, its decision, a tool, a system or data, and afterwards. Controls in the reference service. What it reads: only what the asker may read, credentials redacted before any model call, alert and runbook text marked untrusted. The model: evals with injection and isolation cases gate every prompt or model change. Its decision: no tool changes anything; a person reads the answer. The answer on screen: rendered as text, never HTML; a content security policy allows only this site. Systems and data: tools read with the asker's rights; the database role cannot change the schema. Afterwards: the audit trail; traces and logs hold no content."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #7b2d84; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #f5e9f6; stroke: #7b2d84; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #7b2d84; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #7b2d84; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #7b2d84; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="320" fill="#ffffff"/>
      <g class="ts">
      <rect class="n-warn" x="16" y="20" width="140" height="56" rx="5"/><text x="86" y="44" text-anchor="middle" class="tb">what it reads</text><text x="86" y="62" text-anchor="middle">alerts, runbooks</text>
      <rect class="n-acc" x="182" y="20" width="110" height="56" rx="5"/><text x="237" y="44" text-anchor="middle" class="tb">the model</text><text x="237" y="62" text-anchor="middle">may be steered</text>
      <rect class="n" x="318" y="20" width="120" height="56" rx="5"/><text x="378" y="44" text-anchor="middle" class="tb">its decision</text><text x="378" y="62" text-anchor="middle">an answer, a call</text>
      <rect class="n" x="464" y="20" width="110" height="56" rx="5"/><text x="519" y="44" text-anchor="middle" class="tb">a tool</text><text x="519" y="62" text-anchor="middle">whose rights?</text>
      <rect class="n" x="600" y="20" width="204" height="56" rx="5"/><text x="702" y="44" text-anchor="middle" class="tb">systems and data</text><text x="702" y="62" text-anchor="middle">what can change</text>
      </g>
      <g class="e"><line x1="157" y1="48" x2="180" y2="48" marker-end="url(#a)"/><line x1="293" y1="48" x2="316" y2="48" marker-end="url(#a)"/><line x1="439" y1="48" x2="462" y2="48" marker-end="url(#a)"/><line x1="575" y1="48" x2="598" y2="48" marker-end="url(#a)"/></g>
      <text class="tl" x="16" y="108">WHAT BOUNDS IT IN THE REFERENCE SERVICE</text>
      <g class="ts">
      <rect class="n-good" x="16" y="118" width="384" height="58" rx="5"/><text x="28" y="140"><tspan class="tb">Reads:</tspan> only what the asker may read; credentials</text><text x="28" y="158">redacted before any model call; text marked untrusted</text>
      <rect class="n-good" x="420" y="118" width="384" height="58" rx="5"/><text x="432" y="140"><tspan class="tb">Model:</tspan> injection and isolation evals gate every</text><text x="432" y="158">prompt or model change</text>
      <rect class="n-good" x="16" y="184" width="384" height="58" rx="5"/><text x="28" y="206"><tspan class="tb">Decision:</tspan> no tool changes anything; in agent mode,</text><text x="28" y="224">two read-only tools; a person reads the answer</text>
      <rect class="n-good" x="420" y="184" width="384" height="58" rx="5"/><text x="432" y="206"><tspan class="tb">Screen:</tspan> answers rendered as text, never HTML;</text><text x="432" y="224">a content security policy: this site only</text>
      <rect class="n-good" x="16" y="250" width="384" height="58" rx="5"/><text x="28" y="272"><tspan class="tb">Systems:</tspan> tools act with the asker's rights; the</text><text x="28" y="290">database role cannot change the schema</text>
      <rect class="n-good" x="420" y="250" width="384" height="58" rx="5"/><text x="432" y="272"><tspan class="tb">Afterwards:</tspan> an append-only audit trail; traces</text><text x="432" y="290">and logs hold no content</text>
      </g>
    </svg>