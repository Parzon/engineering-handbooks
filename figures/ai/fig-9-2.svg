<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" role="img" aria-label="The lethal trifecta: private data, untrusted content, and a way to send data out such as an HTTP call, an email, a link or an image URL. With all three, an injection can steal the data. Remove a leg rather than trying to filter the traffic. Exfiltration through output: a chat interface that renders markdown fetches images by itself, so an injected image URL carrying data leaks it with no click; a known incident against a commercial assistant used this, passing a content security policy through a domain the policy trusted. Defense: render output as text, or sanitize it and allow no outside images; a content security policy as the second layer."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #7b2d84; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #f5e9f6; stroke: #7b2d84; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #7b2d84; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #7b2d84; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #7b2d84; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="250" fill="#ffffff"/>
      <polygon class="n-soft" points="160,22 300,206 20,206"/>
      <text class="ts tb" x="160" y="16" text-anchor="middle">untrusted content</text>
      <text class="ts tb" x="16" y="226">private data</text>
      <text class="ts tb" x="222" y="226">a way to send out</text>
      <text class="ts" x="160" y="140" text-anchor="middle">all three: an</text><text class="ts" x="160" y="156" text-anchor="middle">injection can</text><text class="ts tr" x="160" y="172" text-anchor="middle">steal the data</text>
      <text class="ts" x="16" y="244"><tspan class="tb">Remove a leg;</tspan> do not try to filter the traffic.</text>
      <rect class="n-warn" x="350" y="22" width="454" height="100" rx="6"/><text class="tb" x="362" y="46">The quietest way out: a rendered image</text>
      <text class="ts" x="362" y="68">a chat UI that renders markdown fetches images itself; an</text><text class="ts" x="362" y="84">injected image URL carrying data leaks it with no click. A</text><text class="ts" x="362" y="100">known incident passed a CSP through a domain it trusted.</text>
      <rect class="n-good" x="350" y="136" width="454" height="88" rx="6"/><text class="tb" x="362" y="160">The reference service</text>
      <text class="ts" x="362" y="182">answers rendered as text: a markdown image or a script shows</text><text class="ts" x="362" y="198">as characters; a UI test fails if output is ever rendered as</text><text class="ts" x="362" y="214">HTML; the content security policy is the second layer</text>
    </svg>