<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" role="img" aria-label="From a complaint to its author in two queries. A chat.asked event, written before the answer starts, records who asked, their teams, the prompt version and hash, the model, and the alert ids and runbook sections given, each with its runbook's version hash. That hash leads to the runbook.saved event that wrote the version, with its author. Events hold ids and hashes, never text; they are written in the same transaction as the change; the app cannot update or delete them. Traces: a sample, kept days, answering where time went. Audit trail: every event, kept by policy, answering who did what."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #7b2d84; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #f5e9f6; stroke: #7b2d84; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #7b2d84; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #7b2d84; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #7b2d84; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="260" fill="#ffffff"/>
      <rect class="n-bad" x="16" y="20" width="160" height="60" rx="6"/><text class="tb" x="28" y="44">A harmful answer</text><text class="ts" x="28" y="64">reported by a user</text>
      <rect class="n-acc" x="216" y="20" width="270" height="90" rx="6"/><text class="tb" x="228" y="44">chat.asked</text><text class="ts" x="228" y="64">who asked, prompt version and hash, model,</text><text class="ts" x="228" y="80">the alert ids and runbook sections given,</text><text class="ts" x="228" y="96">each with its version hash</text>
      <rect class="n-acc" x="526" y="20" width="278" height="90" rx="6"/><text class="tb" x="538" y="44">runbook.saved</text><text class="ts" x="538" y="64">the author, the runbook, the hash of</text><text class="ts" x="538" y="80">its text and of the version it replaced</text>
      <line class="e" x1="177" y1="50" x2="214" y2="50" marker-end="url(#a)"/><text class="ts" x="196" y="128" text-anchor="middle">query 1</text>
      <line class="e" x1="487" y1="64" x2="524" y2="64" marker-end="url(#a)"/><text class="ts" x="506" y="128" text-anchor="middle">query 2</text>
      <rect class="n" x="16" y="146" width="384" height="96" rx="6"/><text class="tb" x="28" y="170">Traces</text><text class="ts" x="28" y="192">a sample of requests, kept for days</text><text class="ts" x="28" y="210">answers: where did this request's time go?</text><text class="ts" x="28" y="228">holds ids and counts, no content</text>
      <rect class="n-good" x="420" y="146" width="384" height="96" rx="6"/><text class="tb" x="432" y="170">The audit trail</text><text class="ts" x="432" y="192">every event, kept as long as policy says</text><text class="ts" x="432" y="210">answers: who did what, and what was given?</text><text class="ts" x="432" y="228">same transaction as the change; append-only</text>
    </svg>