<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" role="img" aria-label="The delivery path in two rows. Top: developer, pull request, CI checks, protected main branch, version tag. Bottom, right to left: release builds and scans once, images in two registries, a deploy gated by a GitHub environment, a rolling update with a circuit breaker, and a smoke test through the load balancer. Rollback runs the same deploy with the previous tag."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #146b55; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #e2f1eb; stroke: #146b55; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #146b55; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #146b55; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #146b55; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="330" fill="#ffffff"/>
      <rect class="n" x="16" y="34" width="136" height="64" rx="5"/>
      <text class="tb" x="84" y="60" text-anchor="middle">Developer</text>
      <text class="ts" x="84" y="78" text-anchor="middle">branch, commits</text>
      <rect class="n" x="182" y="34" width="136" height="64" rx="5"/>
      <text class="tb" x="250" y="60" text-anchor="middle">Pull request</text>
      <text class="ts" x="250" y="78" text-anchor="middle">review, one concern</text>
      <rect class="n" x="348" y="34" width="136" height="64" rx="5"/>
      <text class="tb" x="416" y="60" text-anchor="middle">CI checks</text>
      <text class="ts" x="416" y="78" text-anchor="middle">lint, tests, e2e, scans</text>
      <rect class="n" x="514" y="34" width="136" height="64" rx="5"/>
      <text class="tb" x="582" y="60" text-anchor="middle">Protected main</text>
      <text class="ts" x="582" y="78" text-anchor="middle">green and reviewed</text>
      <rect class="n-acc" x="680" y="34" width="124" height="64" rx="5"/>
      <text class="tb" x="742" y="60" text-anchor="middle">Version tag</text>
      <text class="tm" x="742" y="80" text-anchor="middle">v0.8.2</text>
      <line class="e" x1="153" y1="66" x2="180" y2="66" marker-end="url(#a)"/>
      <line class="e" x1="319" y1="66" x2="346" y2="66" marker-end="url(#a)"/>
      <line class="e" x1="485" y1="66" x2="512" y2="66" marker-end="url(#a)"/>
      <line class="e" x1="651" y1="66" x2="678" y2="66" marker-end="url(#a)"/>
      <text class="ts ta" x="250" y="116" text-anchor="middle">Chapter 2</text>
      <text class="ts ta" x="416" y="116" text-anchor="middle">Chapters 3, 4</text>

      <path class="e-acc" d="M742,99 V150" marker-end="url(#a-acc)"/>
      <rect class="n" x="680" y="152" width="124" height="76" rx="5"/>
      <text class="tb" x="742" y="176" text-anchor="middle">Release</text>
      <text class="ts" x="742" y="194" text-anchor="middle">build once, scan,</text>
      <text class="ts" x="742" y="210" text-anchor="middle">amd64 and arm64</text>
      <rect class="n" x="514" y="152" width="136" height="76" rx="5"/>
      <text class="tb" x="582" y="176" text-anchor="middle">Registries</text>
      <text class="ts" x="582" y="194" text-anchor="middle">GHCR, then ECR</text>
      <text class="ts" x="582" y="210" text-anchor="middle">same digest in both</text>
      <rect class="n" x="348" y="152" width="136" height="76" rx="5"/>
      <text class="tb" x="416" y="176" text-anchor="middle">Deploy gate</text>
      <text class="ts" x="416" y="194" text-anchor="middle">GitHub environment,</text>
      <text class="ts" x="416" y="210" text-anchor="middle">keyless credentials</text>
      <rect class="n" x="182" y="152" width="136" height="76" rx="5"/>
      <text class="tb" x="250" y="176" text-anchor="middle">Rolling update</text>
      <text class="ts" x="250" y="194" text-anchor="middle">new tasks first; a</text>
      <text class="ts" x="250" y="210" text-anchor="middle">circuit breaker</text>
      <rect class="n-good" x="16" y="152" width="136" height="76" rx="5"/>
      <text class="tb" x="84" y="176" text-anchor="middle">Smoke test</text>
      <text class="ts" x="84" y="194" text-anchor="middle">through the load</text>
      <text class="ts" x="84" y="210" text-anchor="middle">balancer</text>
      <line class="e" x1="679" y1="190" x2="652" y2="190" marker-end="url(#a)"/>
      <line class="e" x1="513" y1="190" x2="486" y2="190" marker-end="url(#a)"/>
      <line class="e" x1="347" y1="190" x2="320" y2="190" marker-end="url(#a)"/>
      <line class="e" x1="181" y1="190" x2="154" y2="190" marker-end="url(#a)"/>
      <text class="ts ta" x="742" y="246" text-anchor="middle">Chapter 3</text>
      <text class="ts ta" x="582" y="246" text-anchor="middle">Chapters 3, 5</text>
      <text class="ts ta" x="416" y="246" text-anchor="middle">Chapters 5, 13</text>
      <text class="ts ta" x="250" y="246" text-anchor="middle">Chapter 9</text>

      <path class="e dash" d="M84,229 V276 H470 V232" marker-end="url(#a)"/>
      <text class="ts" x="277" y="294" text-anchor="middle">rollback: run the same deploy with the previous tag</text>
      <text class="ts" x="16" y="320">The infrastructure itself is code in the same repository, changed by pull request (Chapter 7).</text>
