<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 264" role="img" aria-label="One image, identified by its version and digest, runs in staging, the cloud demo and production. Each environment supplies its own configuration: an env file on a VM, Secrets Manager on ECS, the organization's secret store in production."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #146b55; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #e2f1eb; stroke: #146b55; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #146b55; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #146b55; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #146b55; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="264" fill="#ffffff"/>
      <rect class="n-acc" x="16" y="88" width="214" height="88" rx="6"/>
      <text class="tl" x="30" y="110">ONE RELEASE IMAGE</text>
      <text class="tm tb" x="30" y="132">triage-assistant-api:0.8.2</text>
      <text class="tm" x="30" y="152">sha256:fcbc59d1…</text>
      <text class="ts" x="30" y="168">built once, never rebuilt</text>

      <rect class="n" x="320" y="18" width="214" height="58" rx="5"/>
      <text class="tb" x="427" y="42" text-anchor="middle">Staging or demo VM</text>
      <text class="ts" x="427" y="60" text-anchor="middle">pulls the tag, rolls it in</text>
      <rect class="n" x="320" y="103" width="214" height="58" rx="5"/>
      <text class="tb" x="427" y="127" text-anchor="middle">Cloud demo on ECS</text>
      <text class="ts" x="427" y="145" text-anchor="middle">same tag, copied to ECR</text>
      <rect class="n" x="320" y="188" width="214" height="58" rx="5"/>
      <text class="tb" x="427" y="212" text-anchor="middle">Production</text>
      <text class="ts" x="427" y="230" text-anchor="middle">the same tag, later</text>
      <path class="e-acc" d="M231,122 C270,122 270,47 318,47" marker-end="url(#a-acc)"/>
      <line class="e-acc" x1="231" y1="132" x2="318" y2="132" marker-end="url(#a-acc)"/>
      <path class="e-acc" d="M231,142 C270,142 270,217 318,217" marker-end="url(#a-acc)"/>
      <text class="ts" x="275" y="124" text-anchor="middle">same</text>
      <text class="ts" x="275" y="152" text-anchor="middle">digest</text>

      <rect class="n-soft" x="612" y="18" width="192" height="58" rx="5"/>
      <text class="tb" x="708" y="42" text-anchor="middle">an env file</text>
      <text class="ts" x="708" y="60" text-anchor="middle">generated at first boot</text>
      <rect class="n-soft" x="612" y="103" width="192" height="58" rx="5"/>
      <text class="tb" x="708" y="127" text-anchor="middle">Secrets Manager</text>
      <text class="ts" x="708" y="145" text-anchor="middle">injected at task start</text>
      <rect class="n-soft" x="612" y="188" width="192" height="58" rx="5"/>
      <text class="tb" x="708" y="212" text-anchor="middle">The organization's</text>
      <text class="ts" x="708" y="230" text-anchor="middle">secret store and settings</text>
      <line class="e" x1="611" y1="47" x2="536" y2="47" marker-end="url(#a)"/>
      <line class="e" x1="611" y1="132" x2="536" y2="132" marker-end="url(#a)"/>
      <line class="e" x1="611" y1="217" x2="536" y2="217" marker-end="url(#a)"/>
      <text class="tl" x="573" y="14" text-anchor="middle">CONFIG</text>
    </svg>