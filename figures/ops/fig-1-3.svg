<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" role="img" aria-label="A Windows laptop set up for containerized development. The Windows host runs the editor, the browser, Docker Desktop if licensed, and the proxy certificate store. Inside it, a WSL2 distribution holds the repository in its own file system, Git, the toolchain, the coding agent with its sandbox, and the container engine: Docker Desktop's WSL backend, Docker Engine installed in the distribution, or Rancher or Podman Desktop. Containers run from there with bind mounts from the Linux file system. A crossed path shows the Windows drive mounted at /mnt/c: slow for file access and file watchers never fire, so hot reload breaks. A dev container definition in the repository makes the same environment reproducible, with Codespaces as the no-local-Docker alternative."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #146b55; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #e2f1eb; stroke: #146b55; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #146b55; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #146b55; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #146b55; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="300" fill="#ffffff"/>
      <rect class="n-soft" x="16" y="16" width="788" height="270" rx="8"/>
      <text class="tb" x="28" y="40">Windows host</text><text class="ts" x="150" y="40">the editor, the browser, the certificate store the proxy needs; Docker Desktop, if licensed</text>
      <rect class="n" x="28" y="56" width="560" height="216" rx="6"/>
      <text class="tb" x="40" y="78">WSL2 distribution: the workstation</text>
      <rect class="n-good" x="40" y="92" width="256" height="76" rx="5"/><text class="tb" x="50" y="112">The repository, in the Linux file system</text><text class="ts" x="50" y="130">Git, the toolchain (make, uv, Node), the agent</text><text class="ts" x="50" y="146">installed in the distribution, its sandbox on;</text><text class="ts" x="50" y="162">file watchers work, searches are fast</text>
      <rect class="n-good" x="316" y="92" width="256" height="76" rx="5"/><text class="tb" x="326" y="112">The container engine</text><text class="ts" x="326" y="130">Docker Desktop's WSL backend (licensed), or</text><text class="ts" x="326" y="146">Docker Engine inside the distribution (free),</text><text class="ts" x="326" y="162">or Rancher or Podman Desktop</text>
      <rect class="n" x="40" y="184" width="532" height="40" rx="5"/><text class="ts" x="50" y="208">Containers: Postgres, the api, the web app; bind mounts from the Linux file system; Compose as on Linux</text>
      <text class="ts" x="40" y="246">Limits in .wslconfig: memory, processors, swap; the defaults are half the RAM and every core.</text>
      <text class="ts" x="40" y="262">Changes take effect after wsl --shutdown.</text>
      <rect class="n-bad" x="604" y="56" width="188" height="100" rx="6"/><text class="tb" x="616" y="78">/mnt/c: do not work here</text><text class="ts" x="616" y="98">the Windows drive seen from Linux:</text><text class="ts" x="616" y="114">every file operation crosses a VM</text><text class="ts" x="616" y="130">boundary, and watchers never fire,</text><text class="ts" x="616" y="146">so reloads and searches break</text>
      <rect class="n-acc" x="604" y="172" width="188" height="100" rx="6"/><text class="tb" x="616" y="194">Dev container, in the repo</text><text class="ts" x="616" y="214">the toolchain and the agent in</text><text class="ts" x="616" y="230">a container definition, the same</text><text class="ts" x="616" y="246">on every laptop; Codespaces if</text><text class="ts" x="616" y="262">the laptop cannot run Docker</text>
    </svg>