<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" role="img" aria-label="The control plane holds API server replicas behind a load balancer, etcd with three or five members using Raft, a scheduler and controllers with leader election. Worker nodes run the kubelet and pods. A reconcile loop: observe, compare with desired state, act. If the control plane fails, running pods keep running, but deploys, scaling and recovery from a dead node stop."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #146b55; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #e2f1eb; stroke: #146b55; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #146b55; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #146b55; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #146b55; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="320" fill="#ffffff"/>
      <rect class="zone" x="16" y="16" width="380" height="290" rx="8"/>
      <text class="tl" x="30" y="36">CONTROL PLANE (RUN BY THE PROVIDER ON EKS)</text>
      <rect class="n-acc" x="30" y="50" width="352" height="54" rx="5"/>
      <text class="tb" x="206" y="72" text-anchor="middle">API server, several replicas</text>
      <text class="ts" x="206" y="90" text-anchor="middle">stateless, behind a load balancer; everything talks to it</text>
      <rect class="n" x="30" y="116" width="170" height="70" rx="5"/>
      <text class="tb" x="115" y="140" text-anchor="middle">etcd, 3 or 5</text>
      <text class="ts" x="115" y="158" text-anchor="middle">the cluster's database;</text>
      <text class="ts" x="115" y="174" text-anchor="middle">Raft consensus</text>
      <rect class="n" x="212" y="116" width="170" height="70" rx="5"/>
      <text class="tb" x="297" y="140" text-anchor="middle">Scheduler</text>
      <text class="ts" x="297" y="158" text-anchor="middle">places pods on nodes;</text>
      <text class="ts" x="297" y="174" text-anchor="middle">one leader at a time</text>
      <rect class="n" x="30" y="198" width="352" height="94" rx="5"/>
      <text class="tb" x="206" y="220" text-anchor="middle">Controllers: the reconcile loop</text>
      <rect class="n-soft" x="50" y="234" width="90" height="40" rx="4"/><text class="ts" x="95" y="259" text-anchor="middle">observe</text>
      <rect class="n-soft" x="162" y="234" width="90" height="40" rx="4"/><text class="ts" x="207" y="259" text-anchor="middle">compare</text>
      <rect class="n-soft" x="274" y="234" width="90" height="40" rx="4"/><text class="ts" x="319" y="259" text-anchor="middle">act</text>
      <line class="e" x1="141" y1="254" x2="160" y2="254" marker-end="url(#a)"/>
      <line class="e" x1="253" y1="254" x2="272" y2="254" marker-end="url(#a)"/>
      <path class="e dash" d="M319,275 V286 H95 V277" marker-end="url(#a)"/>

      <rect class="zone" x="436" y="16" width="368" height="200" rx="8"/>
      <text class="tl" x="450" y="36">WORKER NODES (YOURS, OR AUTO MODE)</text>
      <rect class="n" x="450" y="50" width="160" height="150" rx="5"/>
      <text class="tb" x="530" y="72" text-anchor="middle">Node 1</text>
      <text class="ts" x="530" y="90" text-anchor="middle">kubelet, networking</text>
      <rect class="n-acc" x="466" y="102" width="128" height="40" rx="4"/><text class="ts" x="530" y="127" text-anchor="middle">pod: api</text>
      <rect class="n-acc" x="466" y="148" width="128" height="40" rx="4"/><text class="ts" x="530" y="173" text-anchor="middle">pod: web</text>
      <rect class="n" x="628" y="50" width="160" height="150" rx="5"/>
      <text class="tb" x="708" y="72" text-anchor="middle">Node 2</text>
      <text class="ts" x="708" y="90" text-anchor="middle">kubelet, networking</text>
      <rect class="n-acc" x="644" y="102" width="128" height="40" rx="4"/><text class="ts" x="708" y="127" text-anchor="middle">pod: api</text>
      <rect class="n-acc" x="644" y="148" width="128" height="40" rx="4"/><text class="ts" x="708" y="173" text-anchor="middle">pod: worker</text>
      <path class="e" d="M383,77 C410,77 410,110 448,110" marker-end="url(#a)"/>
      <text class="ts" x="412" y="70" text-anchor="middle">desired</text>

      <rect class="n-warn" x="436" y="232" width="368" height="74" rx="6"/>
      <text class="tb" x="620" y="256" text-anchor="middle">If the control plane is down</text>
      <text class="ts" x="620" y="276" text-anchor="middle">running pods keep running; deploys, autoscaling</text>
      <text class="ts" x="620" y="292" text-anchor="middle">and recovery from a dead node stop</text>
    </svg>