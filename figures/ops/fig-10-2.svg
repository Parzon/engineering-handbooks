<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" role="img" aria-label="During a database outage on Kubernetes, the readiness probe at /ready fails, so the pod stops receiving traffic but keeps running; the liveness probe at /health passes, so nothing restarts. On ECS, both the container health check and the load balancer's check end in a replaced task, so neither can act as readiness, and a deep check in either restarts tasks."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #146b55; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #e2f1eb; stroke: #146b55; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #146b55; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #146b55; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #146b55; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="250" fill="#ffffff"/>
      <text class="tb" x="16" y="26">Kubernetes: the database is down</text>
      <rect class="n" x="16" y="42" width="160" height="84" rx="6"/>
      <text class="tb" x="96" y="70" text-anchor="middle">api pod</text>
      <text class="ts" x="96" y="90" text-anchor="middle">process alive,</text>
      <text class="ts" x="96" y="106" text-anchor="middle">database unreachable</text>
      <rect class="n-warn" x="236" y="42" width="250" height="38" rx="5"/>
      <text class="ts" x="250" y="66">readiness: <tspan class="tm">/ready</tspan> fails</text>
      <rect class="n-good" x="236" y="88" width="250" height="38" rx="5"/>
      <text class="ts" x="250" y="112">liveness: <tspan class="tm">/health</tspan> passes</text>
      <line class="e" x1="177" y1="61" x2="234" y2="61" marker-end="url(#a)"/>
      <line class="e" x1="177" y1="107" x2="234" y2="107" marker-end="url(#a)"/>
      <text class="ts" x="512" y="66">removed from the Service: no new traffic</text>
      <text class="ts" x="512" y="112">no restart: it reconnects when the database is back</text>

      <line class="rule" x1="16" y1="148" x2="804" y2="148"/>
      <text class="tb" x="16" y="174">ECS: no readiness-only signal</text>
      <rect class="n" x="16" y="186" width="160" height="50" rx="6"/>
      <text class="tb" x="96" y="216" text-anchor="middle">api task</text>
      <rect class="n-bad" x="236" y="192" width="250" height="38" rx="5"/>
      <text class="ts" x="250" y="216">container check, load balancer check</text>
      <line class="e" x1="177" y1="211" x2="234" y2="211" marker-end="url(#a)"/>
      <text class="ts" x="512" y="204">either one deep: tasks replaced in an outage</text>
      <text class="ts" x="512" y="222">so on ECS both must be shallow (Chapter 9)</text>
    </svg>