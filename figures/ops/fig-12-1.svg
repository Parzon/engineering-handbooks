.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="328" fill="#ffffff"/>
      <line class="rule-strong" x1="40" y1="40" x2="40" y2="318"/>
      <circle class="fill-acc" cx="40" cy="44" r="6"/><text class="tb" x="60" y="49">0  Account access</text><text class="ts" x="330" y="49">a new account is not usable until verified; check with read-only calls</text>
      <circle class="fill-acc" cx="40" cy="72" r="6"/><text class="tb" x="60" y="77">1  Images and ECR</text><text class="ts" x="330" y="77">same digest as the source registry; overwriting a tag refused</text>
      <circle class="fill-acc" cx="40" cy="100" r="6"/><text class="tb" x="60" y="105">2  Keyless CI</text><text class="ts" x="330" y="105">OIDC roles; a trust policy fixed from the real token (Chapter 5)</text>
      <circle class="fill-acc" cx="40" cy="128" r="6"/><text class="tb" x="60" y="133">3  One VM done properly</text><text class="ts" x="330" y="133">no SSH; rollback across a migration, 139 requests, 0 failed</text>
      <circle class="fill-acc" cx="40" cy="156" r="6"/><text class="tb" x="60" y="161">4  ECS, RDS, load balancer</text><text class="ts" x="330" y="161">init containers, URL rewrite, a least-privileged database role</text>
      <circle class="fill-acc" cx="40" cy="184" r="6"/><text class="tb" x="60" y="189">5  Deploys and rollbacks</text><text class="ts" x="330" y="189">352 requests, 0 failed; a bad release rolled itself back</text>
      <circle class="fill-acc" cx="40" cy="212" r="6"/><text class="tb" x="60" y="217">6  Tag to live, no human step</text><text class="ts" x="330" y="217">8 min 37 s, 967 probes, 0 failed; rollback by the same pipeline</text>
      <circle class="fill-acc" cx="40" cy="240" r="6"/><text class="tb" x="60" y="245">7  Scale, drift, drills</text><text class="ts" x="330" y="245">a shared-state bug; drift found; autoscaling; outages survived</text>
      <circle class="fill-acc" cx="40" cy="268" r="6"/><text class="tb" x="60" y="273">8  Observability</text><text class="ts" x="330" y="273">logs per container, load balancer metrics, alarms</text>
      <circle class="fill-acc" cx="40" cy="296" r="6"/><text class="tb" x="60" y="301">9  A review, then the fixes</text><text class="ts" x="330" y="301">eight gaps against the code's own rules; each fixed, shown before and after</text>
    </svg>