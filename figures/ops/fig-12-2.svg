<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" role="img" aria-label="The deployment as code. On GitHub, a version tag starts release.yml, which builds, scans, publishes and smoke-tests the images and copies them to ECR; after it, deploy.yml waits for approval, runs cdk deploy on the application stack and smoke-tests through the load balancer. The infra/aws folder is one CDK app of five stacks: triage-cicd (GitHub OIDC and the two roles the workflows assume), triage-registry (ECR repositories with immutable tags), triage-network (a VPC over two zones without NAT), triage-vm (one VM without SSH) and triage-app (the load balancer, ECS, RDS, Valkey, secrets and alarms). The first three cost nothing or only storage, and stay up; the VM and the application stack are billed by the hour and torn down after each session."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #146b55; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #e2f1eb; stroke: #146b55; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #146b55; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #146b55; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #146b55; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="380" fill="#ffffff"/>
      <rect class="zone" x="16" y="20" width="176" height="340" rx="8"/>
      <text class="tl" x="28" y="40">GITHUB</text>
      <rect class="n-acc" x="28" y="52" width="152" height="44" rx="5"/>
      <text class="tb" x="104" y="71" text-anchor="middle">A version tag</text>
      <text class="ts" x="104" y="88" text-anchor="middle">vX.Y.Z on main</text>
      <line class="e" x1="104" y1="97" x2="104" y2="115" marker-end="url(#a)"/>
      <rect class="n" x="28" y="118" width="152" height="90" rx="5"/>
      <text class="tm tb" x="40" y="138">release.yml</text>
      <text class="ts" x="40" y="157">build, scan, publish</text>
      <text class="ts" x="40" y="173">smoke-test the images</text>
      <text class="ts" x="40" y="189">ecr job: copy to ECR</text>
      <line class="e" x1="104" y1="209" x2="104" y2="229" marker-end="url(#a)"/>
      <rect class="n" x="28" y="232" width="152" height="114" rx="5"/>
      <text class="tm tb" x="40" y="252">deploy.yml</text>
      <text class="ts" x="40" y="271">after the release</text>
      <text class="ts" x="40" y="287">waits for approval</text>
      <text class="ts" x="40" y="303">cdk deploy triage-app</text>
      <text class="ts" x="40" y="319">rolling, with a breaker</text>
      <text class="ts" x="40" y="335">smoke test via the ALB</text>

      <rect class="zone" x="226" y="20" width="324" height="340" rx="8"/>
      <text class="tl" x="238" y="40">INFRA/AWS: ONE CDK APP OF FIVE STACKS</text>
      <rect class="n" x="238" y="52" width="300" height="50" rx="5"/>
      <text class="tb" x="250" y="72">triage-cicd</text><text class="tm ts" x="526" y="72" text-anchor="end">cicd.py</text>
      <text class="ts" x="250" y="91">OIDC; roles for the release and the deploy</text>
      <rect class="n" x="238" y="112" width="300" height="50" rx="5"/>
      <text class="tb" x="250" y="132">triage-registry</text><text class="tm ts" x="526" y="132" text-anchor="end">registry.py</text>
      <text class="ts" x="250" y="151">ECR repositories, immutable tags</text>
      <rect class="n" x="238" y="172" width="300" height="50" rx="5"/>
      <text class="tb" x="250" y="192">triage-network</text><text class="tm ts" x="526" y="192" text-anchor="end">network.py</text>
      <text class="ts" x="250" y="211">VPC over two zones; no NAT gateway</text>
      <rect class="n-soft" x="238" y="232" width="300" height="50" rx="5"/>
      <text class="tb" x="250" y="252">triage-vm</text><text class="tm ts" x="526" y="252" text-anchor="end">vm.py</text>
      <text class="ts" x="250" y="271">one VM, no SSH; uses network, images</text>
      <rect class="n-acc" x="238" y="292" width="300" height="56" rx="5"/>
      <text class="tb" x="250" y="313">triage-app</text><text class="tm ts" x="526" y="313" text-anchor="end">service.py</text>
      <text class="ts" x="250" y="333">ALB, ECS, RDS, Valkey, secrets, alarms</text>

      <path class="e-acc" d="M181,188 C210,188 210,140 236,140" marker-end="url(#a-acc)"/>
      <path class="e-acc" d="M181,303 C210,303 210,320 236,320" marker-end="url(#a-acc)"/>

      <line class="rule" x1="584" y1="56" x2="584" y2="218"/>
      <text class="tl" x="598" y="72">ALWAYS UP</text>
      <text class="ts" x="598" y="92">free, or storage only:</text>
      <text class="ts" x="598" y="108">identity, images and the</text>
      <text class="ts" x="598" y="124">network wait between</text>
      <text class="ts" x="598" y="140">sessions</text>
      <line class="rule" x1="584" y1="236" x2="584" y2="346"/>
      <text class="tl" x="598" y="252">HOURLY, TORN DOWN</text>
      <text class="ts" x="598" y="272">built for a session and</text>
      <text class="ts" x="598" y="288">destroyed after it</text>
      <rect class="n-soft" x="598" y="302" width="206" height="46" rx="4"/>
      <text class="ts" x="608" y="321">container/*.sh: task start-up</text>
      <text class="ts" x="608" y="339">ops.sh: deploy, logs, leftovers</text>
    </svg>