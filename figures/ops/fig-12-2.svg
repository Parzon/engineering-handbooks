<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 404" role="img" aria-label="The deployment as code. On GitHub, a version tag starts release.yml, which builds, scans, publishes and smoke-tests the images; its ecr job, as the ECR role, copies them into the registry stack's repositories. After the release succeeds, deploy.yml waits for approval and, as the deploy role, runs cdk deploy on the application stack, then smoke-tests through the load balancer. Both workflows reach AWS with GitHub's OIDC tokens, through the identity stack triage-cicd, which holds the two roles. The infra/aws folder is one CDK app of five stacks: triage-cicd, triage-registry (ECR repositories with immutable tags), triage-network (a VPC over two zones without NAT), triage-vm (one VM without SSH) and triage-app (the load balancer, ECS, RDS, Valkey, secrets and alarms). The VM and the application stack use the registry's images and the network. The first three stacks cost nothing or only storage, and stay up; the VM and the application stack are billed by the hour and torn down after each session."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #146b55; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #e2f1eb; stroke: #146b55; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #146b55; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #146b55; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #146b55; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="404" fill="#ffffff"/>
      <rect class="zone" x="16" y="20" width="180" height="370" rx="8"/>
      <text class="tl" x="28" y="40">GITHUB</text>
      <rect class="n-acc" x="28" y="52" width="156" height="44" rx="5"/>
      <text class="tb" x="106" y="71" text-anchor="middle">A version tag</text>
      <text class="ts" x="106" y="88" text-anchor="middle">vX.Y.Z on main</text>
      <line class="e" x1="106" y1="97" x2="106" y2="115" marker-end="url(#a)"/>
      <rect class="n" x="28" y="118" width="156" height="98" rx="5"/>
      <text class="tm tb" x="40" y="138">release.yml</text>
      <text class="ts" x="40" y="157">build, scan, publish</text>
      <text class="ts" x="40" y="173">smoke-test the images</text>
      <text class="ts" x="40" y="189">ecr job, as the ECR role:</text>
      <text class="ts" x="40" y="205">copy them to ECR</text>
      <line class="e" x1="106" y1="217" x2="106" y2="237" marker-end="url(#a)"/>
      <text class="ts tmu" x="116" y="231">if it succeeds</text>
      <rect class="n" x="28" y="240" width="156" height="138" rx="5"/>
      <text class="tm tb" x="40" y="260">deploy.yml</text>
      <text class="ts" x="40" y="279">waits for approval</text>
      <text class="ts" x="40" y="295">as the deploy role:</text>
      <text class="ts" x="40" y="311">cdk deploy triage-app</text>
      <text class="ts" x="40" y="327">rolling, with a breaker</text>
      <text class="ts" x="40" y="343">smoke test through</text>
      <text class="ts" x="40" y="359">the load balancer</text>

      <rect class="zone" x="256" y="20" width="334" height="370" rx="8"/>
      <text class="tl" x="268" y="40">INFRA/AWS: ONE CDK APP OF FIVE STACKS</text>
      <rect class="n-soft" x="268" y="52" width="272" height="52" rx="5"/>
      <text class="tb" x="280" y="72">triage-cicd</text><text class="tm ts" x="528" y="72" text-anchor="end">cicd.py</text>
      <text class="ts" x="280" y="91">trusts GitHub's OIDC; ECR and deploy roles</text>
      <rect class="n" x="268" y="120" width="272" height="52" rx="5"/>
      <text class="tb" x="280" y="140">triage-registry</text><text class="tm ts" x="528" y="140" text-anchor="end">registry.py</text>
      <text class="ts" x="280" y="159">ECR repositories, immutable tags</text>
      <rect class="n" x="268" y="188" width="272" height="52" rx="5"/>
      <text class="tb" x="280" y="208">triage-network</text><text class="tm ts" x="528" y="208" text-anchor="end">network.py</text>
      <text class="ts" x="280" y="227">VPC over two zones; no NAT gateway</text>
      <rect class="n" x="268" y="256" width="272" height="52" rx="5"/>
      <text class="tb" x="280" y="276">triage-vm</text><text class="tm ts" x="528" y="276" text-anchor="end">vm.py</text>
      <text class="ts" x="280" y="295">one VM running compose, no SSH</text>
      <rect class="n-acc" x="268" y="324" width="272" height="52" rx="5"/>
      <text class="tb" x="280" y="344">triage-app</text><text class="tm ts" x="528" y="344" text-anchor="end">service.py</text>
      <text class="ts" x="280" y="363">ALB, ECS, RDS, Valkey, secrets, alarms</text>

      <path class="e" d="M197,38 C234,38 228,76 265,76" marker-end="url(#a)"/>
      <text class="ts" x="226" y="32" text-anchor="middle">OIDC</text>
      <path class="e-acc" d="M185,197 C228,197 224,146 265,146" marker-end="url(#a-acc)"/>
      <path class="e-acc" d="M185,303 C228,303 224,350 265,350" marker-end="url(#a-acc)"/>

      <line class="e" x1="540" y1="282" x2="562" y2="282"/>
      <line class="e" x1="540" y1="350" x2="562" y2="350"/>
      <line class="e" x1="562" y1="146" x2="562" y2="350"/>
      <line class="e" x1="562" y1="146" x2="543" y2="146" marker-end="url(#a)"/>
      <line class="e" x1="562" y1="214" x2="543" y2="214" marker-end="url(#a)"/>
      <text class="ts tmu" x="578" y="248" text-anchor="middle" transform="rotate(-90 578 248)">use the images, network</text>

      <line class="rule" x1="606" y1="56" x2="606" y2="236"/>
      <text class="tl" x="620" y="72">ALWAYS UP</text>
      <text class="ts" x="620" y="92">free, or storage only:</text>
      <text class="ts" x="620" y="108">identity, images and the</text>
      <text class="ts" x="620" y="124">network wait between</text>
      <text class="ts" x="620" y="140">sessions</text>
      <line class="rule" x1="606" y1="256" x2="606" y2="376"/>
      <text class="tl" x="620" y="272">HOURLY, TORN DOWN</text>
      <text class="ts" x="620" y="292">built for a session and</text>
      <text class="ts" x="620" y="308">destroyed after it</text>
      <rect class="n-soft" x="620" y="322" width="190" height="54" rx="4"/>
      <text class="ts" x="630" y="343">container/*.sh: task start-up</text>
      <text class="ts" x="630" y="363">ops.sh: deploy, cli, logs, leftovers</text>
    </svg>