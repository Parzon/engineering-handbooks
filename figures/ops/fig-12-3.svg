<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" role="img" aria-label="Three orderings the AWS stack keeps, on one scale of 0 to 150 seconds. Idle connections: the load balancer keeps them 130 seconds, so the api and nginx keep them 140; before the review they closed at 75 and 65. A task leaving: the deregistration delay of 130 seconds covers the longest answer of 120; at 30 seconds, longer answers were cut. After SIGTERM: gunicorn's graceful timeout of 110 seconds ends inside the 120-second stop timeout, after which ECS kills the process."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #146b55; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #e2f1eb; stroke: #146b55; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #146b55; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #146b55; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #146b55; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="300" fill="#ffffff"/>
      <text class="tb" x="16" y="24">Idle connections: the side behind closes last</text>
      <text class="ts" x="16" y="56">else a 502 on a</text>
      <text class="ts" x="16" y="72">reused connection</text>
      <line class="rule-strong" x1="210" y1="52" x2="780" y2="52"/>
      <circle class="dot-muted" cx="457" cy="52" r="6"/><circle class="dot-muted" cx="495" cy="52" r="6"/>
      <text class="ts tmu" x="476" y="76" text-anchor="middle">before: nginx 65 s, api 75 s</text>
      <circle class="fill-acc" cx="704" cy="52" r="6"/><text class="ts" x="704" y="40" text-anchor="middle">load balancer 130 s</text>
      <circle class="fill-good" cx="742" cy="52" r="6"/><text class="ts" x="790" y="76" text-anchor="end">api and nginx 140 s</text>

      <text class="tb" x="16" y="114">A task leaving: the drain covers the longest answer</text>
      <text class="ts" x="16" y="146">deregistration</text>
      <text class="ts" x="16" y="162">delay</text>
      <rect class="fill-acc" x="210" y="134" width="494" height="14" rx="2"/>
      <text class="ts" x="712" y="146">130 s</text>
      <rect class="n-soft" x="210" y="154" width="114" height="10" rx="2"/>
      <text class="ts tmu" x="332" y="163">before: 30 s, longer answers were cut</text>
      <line class="rule dash" x1="666" y1="126" x2="666" y2="172"/>
      <text class="ts" x="666" y="186" text-anchor="middle">longest answer 120 s</text>

      <text class="tb" x="16" y="214">After SIGTERM: the graceful shutdown ends inside the stop timeout</text>
      <text class="ts" x="16" y="246">gunicorn graceful</text>
      <text class="ts" x="16" y="262">timeout</text>
      <rect class="fill-good" x="210" y="234" width="418" height="14" rx="2"/>
      <text class="ts" x="210" y="228">110 s</text>
      <line class="rule dash" x1="666" y1="226" x2="666" y2="262"/>
      <text class="ts" x="666" y="276" text-anchor="middle">stop timeout 120 s, then SIGKILL</text>

      <line class="rule" x1="210" y1="290" x2="780" y2="290"/>
      <text class="ts tmu" x="210" y="300" text-anchor="middle">0</text>
      <text class="ts tmu" x="438" y="300" text-anchor="middle">60</text>
      <text class="ts tmu" x="780" y="300" text-anchor="end">150 s</text>
    </svg>