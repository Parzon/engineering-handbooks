.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="230" fill="#ffffff"/>
      <rect class="n-bad" x="16" y="30" width="380" height="180" rx="6"/>
      <text class="tl" x="32" y="52">WHAT A PROBE ON A LAPTOP SAW</text>
      <text class="tb tr" x="32" y="84">15 failed requests</text>
      <text class="ts" x="32" y="112">DNS lookup: <tspan class="tm">dns=5.01s</tspan></text>
      <text class="ts" x="32" y="130">the local resolver chain waited out a timeout</text>
      <text class="ts" x="32" y="158">TCP connect: <tspan class="tm">connect=1.03s</tspan></text>
      <text class="ts" x="32" y="176">a lost packet, retransmitted after one second,</text>
      <text class="ts" x="32" y="192">even when connecting to the load balancer's IP</text>

      <rect class="n-good" x="424" y="30" width="380" height="180" rx="6"/>
      <text class="tl" x="440" y="52">WHAT THE LOAD BALANCER RECORDED</text>
      <text class="tb" x="440" y="84">1,478 requests in the window</text>
      <text class="ts" x="440" y="112">load balancer 5xx: <tspan class="tb">0</tspan></text>
      <text class="ts" x="440" y="134">target 5xx: <tspan class="tb">0</tspan></text>
      <text class="ts" x="440" y="156">target connection errors: <tspan class="tb">0</tspan></text>
      <text class="ts" x="440" y="178">slowest response: <tspan class="tb">0.475 s</tspan></text>
    </svg>