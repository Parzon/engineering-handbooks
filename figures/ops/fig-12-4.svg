<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 230" role="img" aria-label="Left, what the client-side probe saw: 15 failed requests, with DNS lookups taking 5.01 seconds and TCP connects 1.03 seconds because of the local resolver chain and a lost packet. Right, what the load balancer recorded over the same window: 1,478 requests, zero load balancer 5xx, zero target 5xx, zero connection errors, and a maximum response time of 0.475 seconds."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #146b55; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
