<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" role="img" aria-label="Four release strategies. Rolling: instances replaced a few at a time; protects against crashes and startup failures. Canary: a small share of traffic on the new version, watched, then widened; protects against subtle regressions. Blue/green: a full second environment, traffic switched at once, the old kept for an instant switch back. Feature flag: code shipped dark and turned on per tenant or percentage without a deploy."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #146b55; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #e2f1eb; stroke: #146b55; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #146b55; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #146b55; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #146b55; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="300" fill="#ffffff"/>
      <text class="tb" x="16" y="24">Rolling</text>
      <text class="ts" x="16" y="42">replace instances a few at a time</text>
      <rect class="n" x="16" y="54" width="380" height="22" rx="3"/>
      <rect class="n-acc" x="16" y="54" width="130" height="22" rx="3"/>
      <text class="ts" x="16" y="96">catches: crashes, failed starts</text>
      <text class="ts" x="16" y="112">reference: the default on VM and ECS</text>

      <text class="tb" x="424" y="24">Canary</text>
      <text class="ts" x="424" y="42">a small share first, watched, then widened</text>
      <rect class="n" x="424" y="54" width="380" height="22" rx="3"/>
      <rect class="n-acc" x="424" y="54" width="22" height="22" rx="3"/>
      <text class="ts ta tb" x="452" y="70">5%</text>
      <text class="ts" x="424" y="96">catches: subtle regressions, by comparing metrics</text>
      <text class="ts" x="424" y="112">needs: per-version metrics and enough traffic</text>

      <line class="rule" x1="16" y1="134" x2="804" y2="134"/>
      <text class="tb" x="16" y="164">Blue/green</text>
      <text class="ts" x="16" y="182">a second full environment; switch at once</text>
      <rect class="n" x="16" y="194" width="180" height="22" rx="3"/><text class="ts" x="106" y="210" text-anchor="middle">blue: old, kept warm</text>
      <rect class="n-acc" x="216" y="194" width="180" height="22" rx="3"/><text class="ts" x="306" y="210" text-anchor="middle">green: new, all traffic</text>
      <text class="ts" x="16" y="236">catches: anything, with an instant switch back</text>
      <text class="ts" x="16" y="252">costs: double capacity during the release</text>

      <text class="tb" x="424" y="164">Feature flag</text>
      <text class="ts" x="424" y="182">code ships dark; turned on without a deploy</text>
      <rect class="n" x="424" y="194" width="380" height="22" rx="3"/>
      <rect class="n-acc" x="424" y="194" width="90" height="22" rx="3"/>
      <text class="ts" x="524" y="210">on for one tenant, then more</text>
      <text class="ts" x="424" y="236">catches: a feature that misbehaves in production</text>
      <text class="ts" x="424" y="252">costs: flags to remove later, or they become debt</text>
      <text class="ts" x="16" y="288">On a platform: ECS's built-in canary and blue/green, weighted revisions (Cloud Run, Container Apps), Argo Rollouts (Kubernetes).</text>
    </svg>