<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 272" role="img" aria-label="Expand and contract across five releases. Release 1 expands: adds a nullable column; old code ignores it. Release 2 writes both old and new and still reads the old; a backfill fills history. Release 3 reads the new column and still writes both. Release 4 writes only the new; the old column is no longer used. Release 5 contracts: removes the old column. Each release can be rolled back to the one before it. Skipping from release 1 straight to release 5 is not safe, and from release 4 or 5 only a one-release rollback is: the old column is stale after release 4 and gone after release 5."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #146b55; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #e2f1eb; stroke: #146b55; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #146b55; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #146b55; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #146b55; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="272" fill="#ffffff"/>
      <text class="tl" x="16" y="18">FIVE RELEASES, ONE SCHEMA CHANGE</text>
      <rect class="n-acc" x="16" y="30" width="146" height="100" rx="6"/>
      <text class="tb" x="28" y="54">1  Expand</text>
      <text class="ts" x="28" y="74">add the new column,</text>
      <text class="ts" x="28" y="90">nullable; old code</text>
      <text class="ts" x="28" y="106">simply ignores it</text>
      <rect class="n" x="174" y="30" width="146" height="100" rx="6"/>
      <text class="tb" x="186" y="54">2  Write both</text>
      <text class="ts" x="186" y="74">write old and new,</text>
      <text class="ts" x="186" y="90">still read the old;</text>
      <text class="ts" x="186" y="106">backfill the history</text>
      <rect class="n" x="332" y="30" width="146" height="100" rx="6"/>
      <text class="tb" x="344" y="54">3  Read the new</text>
      <text class="ts" x="344" y="74">read the new column,</text>
      <text class="ts" x="344" y="90">still write both</text>
      <rect class="n" x="490" y="30" width="146" height="100" rx="6"/>
      <text class="tb" x="502" y="54">4  Write only new</text>
      <text class="ts" x="502" y="74">the old column is</text>
      <text class="ts" x="502" y="90">no longer used</text>
      <rect class="n-warn" x="648" y="30" width="146" height="100" rx="6"/>
      <text class="tb" x="660" y="54">5  Contract</text>
      <text class="ts" x="660" y="74">remove the old column,</text>
      <text class="ts" x="660" y="90">in a later release</text>
      <line class="e" x1="163" y1="80" x2="172" y2="80" marker-end="url(#a)"/>
      <line class="e" x1="321" y1="80" x2="330" y2="80" marker-end="url(#a)"/>
      <line class="e" x1="479" y1="80" x2="488" y2="80" marker-end="url(#a)"/>
      <line class="e" x1="637" y1="80" x2="646" y2="80" marker-end="url(#a)"/>

      <path class="e-good" d="M239,144 C239,174 97,174 97,136" marker-end="url(#a-good)"/>
      <text class="ts tg" x="168" y="154" text-anchor="middle">roll 2 back to 1: safe</text>
      <path class="e-good" d="M397,144 C397,174 255,174 255,136" marker-end="url(#a-good)"/>
      <text class="ts tg" x="326" y="154" text-anchor="middle">roll 3 back to 2: safe</text>
      <path class="e-good" d="M555,144 C555,174 413,174 413,136" marker-end="url(#a-good)"/>
      <text class="ts tg" x="484" y="154" text-anchor="middle">roll 4 back to 3: safe</text>
      <path class="e-good" d="M713,144 C713,174 571,174 571,136" marker-end="url(#a-good)"/>
      <text class="ts tg" x="642" y="154" text-anchor="middle">roll 5 back to 4: safe</text>
      <path class="e-bad" d="M729,144 C729,234 81,234 81,138" marker-end="url(#a-bad)"/>
      <text class="ts tr" x="410" y="258" text-anchor="middle">never skip from 1 to 5; from 4 or 5, roll back one release only: the old column is stale after 4, gone after 5</text>
    </svg>