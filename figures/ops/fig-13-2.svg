<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" role="img" aria-label="Expand and contract across four releases. Release 1 expands: adds a nullable column; old code ignores it. Release 2 writes both old and new; a backfill fills history. Release 3 reads and writes only the new. Release 4 contracts: removes the old column. Rolling back is safe between adjacent releases up to the one before a contract; skipping from release 1 straight to release 4 is not."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #146b55; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #e2f1eb; stroke: #146b55; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #146b55; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #146b55; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #146b55; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="260" fill="#ffffff"/>
      <text class="tl" x="16" y="18">FOUR RELEASES, ONE SCHEMA CHANGE</text>
      <rect class="n-acc" x="16" y="30" width="186" height="96" rx="6"/>
      <text class="tb" x="30" y="54">1  Expand</text>
      <text class="ts" x="30" y="74">add the new column,</text>
      <text class="ts" x="30" y="90">nullable; old code</text>
      <text class="ts" x="30" y="106">simply ignores it</text>
      <rect class="n" x="218" y="30" width="186" height="96" rx="6"/>
      <text class="tb" x="232" y="54">2  Write both</text>
      <text class="ts" x="232" y="74">code writes old and new;</text>
      <text class="ts" x="232" y="90">a backfill fills history</text>
      <text class="ts" x="232" y="106">in batches</text>
      <rect class="n" x="420" y="30" width="186" height="96" rx="6"/>
      <text class="tb" x="434" y="54">3  Use only the new</text>
      <text class="ts" x="434" y="74">code reads and writes</text>
      <text class="ts" x="434" y="90">only the new column</text>
      <rect class="n-warn" x="622" y="30" width="182" height="96" rx="6"/>
      <text class="tb" x="636" y="54">4  Contract</text>
      <text class="ts" x="636" y="74">remove the old column,</text>
      <text class="ts" x="636" y="90">in a later release</text>
      <line class="e" x1="203" y1="78" x2="216" y2="78" marker-end="url(#a)"/>
      <line class="e" x1="405" y1="78" x2="418" y2="78" marker-end="url(#a)"/>
      <line class="e" x1="607" y1="78" x2="620" y2="78" marker-end="url(#a)"/>

      <path class="e-good" d="M300,140 C300,170 110,170 110,132" marker-end="url(#a-good)"/>
      <text class="ts tg" x="205" y="150" text-anchor="middle">roll 2 back to 1: safe</text>
      <path class="e-good" d="M510,140 C510,170 310,170 310,132" marker-end="url(#a-good)"/>
      <text class="ts tg" x="410" y="150" text-anchor="middle">roll 3 back to 2: safe</text>
      <path class="e-bad" d="M713,140 C713,222 110,222 110,134" marker-end="url(#a-bad)"/>
      <text class="ts tr" x="410" y="248" text-anchor="middle">never skip from 1 to 4, or roll 4 back past 3: the old code needs the column that was removed</text>
    </svg>