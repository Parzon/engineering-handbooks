<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" role="img" aria-label="Five stages, each ending in something measurable: 1 a cloud host behind HTTPS, done when a backup restores onto a fresh host and the time is written down; 2 the organization's identity provider, done when each role is checked by a real member; 3 a hosted model provider, done when the eval gate passes against it and a budget alarm exists; 4 a pilot team, done when objectives held and every reported bad answer is an eval case; 5 general availability, team by team, with a second host planned before the first outage."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #146b55; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #e2f1eb; stroke: #146b55; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #146b55; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #146b55; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #146b55; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="260" fill="#ffffff"/>
      <rect class="n" x="16" y="190" width="150" height="56" rx="5"/><text class="tb" x="28" y="212">1  A real host</text><text class="ts" x="28" y="230">behind HTTPS</text>
      <rect class="n" x="180" y="150" width="150" height="96" rx="5"/><text class="tb" x="192" y="172">2  Real sign-in</text><text class="ts" x="192" y="190">the organization's</text><text class="ts" x="192" y="206">identity provider</text>
      <rect class="n" x="344" y="110" width="150" height="136" rx="5"/><text class="tb" x="356" y="132">3  A real model</text><text class="ts" x="356" y="150">a hosted provider,</text><text class="ts" x="356" y="166">under contract</text>
      <rect class="n-acc" x="508" y="70" width="150" height="176" rx="5"/><text class="tb" x="520" y="92">4  A pilot team</text><text class="ts" x="520" y="110">two to four weeks,</text><text class="ts" x="520" y="126">objectives watched</text>
      <rect class="n-good" x="672" y="30" width="132" height="216" rx="5"/><text class="tb" x="684" y="52">5  Everyone</text><text class="ts" x="684" y="70">team by team;</text><text class="ts" x="684" y="86">a second host</text><text class="ts" x="684" y="102">planned first</text>
      <text class="tl" x="16" y="22">DONE WHEN</text>
      <text class="ts" x="16" y="44">1: a backup restores onto a fresh host, timed: your recovery time</text>
      <text class="ts" x="16" y="62">2: every role checked by a real member</text>
      <text class="ts" x="16" y="80">3: the eval gate passes on the real model; a budget alarm exists</text>
      <text class="ts" x="16" y="98">4: objectives held; every bad answer is now an eval case</text>
    </svg>