      <text class="ts" x="16" y="48">2 api tasks (0.5 vCPU, 1 GB)</text><rect class="f1" x="260" y="34" width="390" height="20" rx="3"/><text class="ts tb" x="658" y="49">5.2</text>
      <text class="ts" x="16" y="78">6 public IPv4 addresses</text><rect class="f1" x="260" y="64" width="225" height="20" rx="3"/><text class="ts tb" x="493" y="79">3.0</text>
      <text class="ts" x="16" y="108">2 web tasks (0.25 vCPU, 0.5 GB)</text><rect class="f1" x="260" y="94" width="195" height="20" rx="3"/><text class="ts tb" x="463" y="109">2.6</text>
      <text class="ts" x="16" y="138">Load balancer</text><rect class="f1" x="260" y="124" width="180" height="20" rx="3"/><text class="ts tb" x="448" y="139">2.4</text>
      <text class="ts" x="16" y="168">Postgres, smallest RDS size</text><rect class="f1" x="260" y="154" width="165" height="20" rx="3"/><text class="ts tb" x="433" y="169">2.2</text>
      <text class="ts" x="16" y="198">Valkey, smallest cache size</text><rect class="f1" x="260" y="184" width="120" height="20" rx="3"/><text class="ts tb" x="388" y="199">1.6</text>
      <text class="ts" x="16" y="228">4 secrets</text><rect class="f1" x="260" y="214" width="15" height="20" rx="3"/><text class="ts tb" x="283" y="229">0.2</text>
