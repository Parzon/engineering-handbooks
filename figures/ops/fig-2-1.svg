<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 236" role="img" aria-label="A commit graph: main has commits A, B, C, D; a feature branch splits from B with commits E and F. Labels: main points at D, the feature branch at F, HEAD at the feature branch, origin/main at C, and the tag v0.8.1 at B."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #146b55; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #e2f1eb; stroke: #146b55; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #146b55; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #146b55; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #146b55; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="236" fill="#ffffff"/>
      <line class="e" x1="113" y1="150" x2="137" y2="150"/>
      <line class="e" x1="203" y1="150" x2="227" y2="150"/>
      <line class="e" x1="293" y1="150" x2="317" y2="150"/>
      <path class="e" d="M170,133 C170,90 200,70 227,70"/>
      <line class="e" x1="293" y1="70" x2="317" y2="70"/>
      <circle class="n" cx="90" cy="150" r="22"/><text class="tb" x="90" y="155" text-anchor="middle">A</text>
      <circle class="n" cx="170" cy="150" r="22"/><text class="tb" x="170" y="155" text-anchor="middle">B</text>
      <circle class="n" cx="260" cy="150" r="22"/><text class="tb" x="260" y="155" text-anchor="middle">C</text>
      <circle class="n" cx="350" cy="150" r="22"/><text class="tb" x="350" y="155" text-anchor="middle">D</text>
      <circle class="n-acc" cx="260" cy="70" r="22"/><text class="tb" x="260" y="75" text-anchor="middle">E</text>
      <circle class="n-acc" cx="350" cy="70" r="22"/><text class="tb" x="350" y="75" text-anchor="middle">F</text>

      <rect class="n-soft" x="320" y="190" width="60" height="22" rx="4"/><text class="tm" x="350" y="205" text-anchor="middle">main</text>
      <line class="e" x1="350" y1="189" x2="350" y2="174" marker-end="url(#a)"/>
      <rect class="n-soft" x="214" y="190" width="92" height="22" rx="4"/><text class="tm" x="260" y="205" text-anchor="middle">origin/main</text>
      <line class="e" x1="260" y1="189" x2="260" y2="174" marker-end="url(#a)"/>
      <rect class="n-warn" x="136" y="190" width="68" height="22" rx="4"/><text class="tm" x="170" y="205" text-anchor="middle">v0.8.1</text>
      <line class="e" x1="170" y1="189" x2="170" y2="174" marker-end="url(#a)"/>
      <rect class="n-acc" x="390" y="59" width="152" height="22" rx="4"/><text class="tm" x="466" y="74" text-anchor="middle">feat/12-post-alerts</text>
      <line class="e-acc" x1="389" y1="70" x2="374" y2="70" marker-end="url(#a-acc)"/>
      <rect class="n-soft" x="420" y="16" width="52" height="22" rx="4"/><text class="tm" x="446" y="31" text-anchor="middle">HEAD</text>
      <line class="e" x1="446" y1="39" x2="446" y2="57" marker-end="url(#a)"/>
      <text class="ts" x="60" y="190" text-anchor="middle">each commit</text>
      <text class="ts" x="60" y="205" text-anchor="middle">points to its parent</text>

      <text class="tb" x="580" y="40">Commit</text>
      <text class="ts" x="580" y="58">a snapshot plus its parent; its ID is a</text>
      <text class="ts" x="580" y="73">hash of both, so it never changes</text>
      <text class="tb" x="580" y="102">Branch</text>
      <text class="ts" x="580" y="120">a label that moves on each commit</text>
      <text class="tb" x="580" y="149">Tag</text>
      <text class="ts" x="580" y="167">a label that never moves</text>
      <text class="tb" x="580" y="196">Remote-tracking label</text>
      <text class="ts" x="580" y="214">where main was at the last fetch</text>
    </svg>