<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 236" role="img" aria-label="The working tree, the staging area and the last commit. git add copies a file into the staging area as it is now; git commit records the staging area. git diff compares the working tree with the staging area; git diff --staged compares the staging area with the last commit. git restore --staged empties the staging copy; git restore on a file discards your edits."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #146b55; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #e2f1eb; stroke: #146b55; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #146b55; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #146b55; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #146b55; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="236" fill="#ffffff"/>
      <rect class="n" x="16" y="60" width="210" height="76" rx="6"/>
      <text class="tb" x="121" y="90" text-anchor="middle">Working tree</text>
      <text class="ts" x="121" y="110" text-anchor="middle">the files on disk: what</text>
      <text class="ts" x="121" y="125" text-anchor="middle">a program actually reads</text>
      <rect class="n-acc" x="305" y="60" width="210" height="76" rx="6"/>
      <text class="tb" x="410" y="90" text-anchor="middle">Staging area (index)</text>
      <text class="ts" x="410" y="110" text-anchor="middle">exactly what the next</text>
      <text class="ts" x="410" y="125" text-anchor="middle">commit will contain</text>
      <rect class="n" x="594" y="60" width="210" height="76" rx="6"/>
      <text class="tb" x="699" y="90" text-anchor="middle">Last commit (HEAD)</text>
      <text class="ts" x="699" y="110" text-anchor="middle">the snapshot you are on</text>
      <text class="ts" x="699" y="125" text-anchor="middle">recorded and permanent</text>

      <line class="e-acc" x1="227" y1="80" x2="303" y2="80" marker-end="url(#a-acc)"/>
      <text class="tm" x="265" y="36" text-anchor="middle">git add</text>
      <text class="ts" x="265" y="52" text-anchor="middle">copies it as it is now</text>
      <line class="e-acc" x1="516" y1="80" x2="592" y2="80" marker-end="url(#a-acc)"/>
      <text class="tm" x="554" y="52" text-anchor="middle">git commit</text>
      <line class="e" x1="592" y1="118" x2="516" y2="118" marker-end="url(#a)"/>
      <text class="tm" x="554" y="160" text-anchor="middle">git restore --staged</text>
      <text class="ts" x="554" y="176" text-anchor="middle">unstages; your edits stay</text>
      <line class="e-bad" x1="303" y1="118" x2="227" y2="118" marker-end="url(#a-bad)"/>
      <text class="tm" x="265" y="160" text-anchor="middle">git restore file</text>
      <text class="ts tr" x="265" y="176" text-anchor="middle">discards your edits</text>

      <path class="rule-strong" d="M121,196 V206 H410 V196"/>
      <text class="tm" x="265" y="224" text-anchor="middle">git diff</text>
      <path class="rule-strong" d="M410,196 V206 H699 V196"/>
      <text class="tm" x="554" y="224" text-anchor="middle">git diff --staged</text>
    </svg>