      <rect class="n" x="382" y="34" width="72" height="34" rx="4"/><text class="tm" x="418" y="56" text-anchor="middle">api</text>
      <rect class="n" x="302" y="76" width="72" height="34" rx="4"/><text class="tm" x="338" y="98" text-anchor="middle">web</text>
      <rect class="n" x="382" y="76" width="72" height="34" rx="4"/><text class="tm" x="418" y="98" text-anchor="middle">web</text>
      <rect class="n" x="302" y="118" width="72" height="34" rx="4"/><text class="tm" x="338" y="140" text-anchor="middle">edge</text>
      <rect class="n" x="382" y="118" width="72" height="34" rx="4"/><text class="tm" x="418" y="140" text-anchor="middle">edge</text>
      <text class="ts" x="338" y="170" text-anchor="middle">amd64</text>
      <text class="ts" x="418" y="170" text-anchor="middle">arm64</text>
      <text class="ts" x="378" y="196" text-anchor="middle">each pushed by digest,</text>
      <text class="ts" x="378" y="212" text-anchor="middle">with provenance and SBOM</text>

      <rect class="n" x="478" y="100" width="118" height="96" rx="6"/>
      <text class="tb" x="537" y="124" text-anchor="middle">Merge</text>
      <text class="ts" x="537" y="144" text-anchor="middle">one tag, both</text>
      <text class="ts" x="537" y="160" text-anchor="middle">architectures:</text>
      <text class="ts" x="537" y="176" text-anchor="middle">0.8.2, 0.8, sha-…</text>

      <rect class="n-good" x="620" y="40" width="186" height="70" rx="6"/>
      <text class="tb" x="713" y="64" text-anchor="middle">Smoke test and scan</text>
      <text class="ts" x="713" y="82" text-anchor="middle">pull what was published, run</text>
      <text class="ts" x="713" y="98" text-anchor="middle">and scan it, amd64 and arm64</text>
      <rect class="n" x="620" y="186" width="186" height="70" rx="6"/>
      <text class="tb" x="713" y="210" text-anchor="middle">Copy to ECR</text>
      <text class="ts" x="713" y="228" text-anchor="middle">keyless (Chapter 5), the</text>
      <text class="ts" x="713" y="244" text-anchor="middle">whole index, same digest</text>

      <line class="e" x1="127" y1="148" x2="148" y2="148" marker-end="url(#a)"/>
      <line class="e" x1="279" y1="148" x2="300" y2="135" marker-end="url(#a)"/>
      <line class="e" x1="455" y1="135" x2="476" y2="148" marker-end="url(#a)"/>
      <path class="e" d="M597,135 C610,135 605,75 618,75" marker-end="url(#a)"/>
      <line class="e" x1="713" y1="111" x2="713" y2="183" marker-end="url(#a)"/>
      <text class="ts" x="721" y="152">once both pass</text>
      <text class="ts" x="600" y="286" text-anchor="middle">when the whole release succeeds, the deploy workflow starts (Chapter 13)</text>
      <line class="e-acc" x1="713" y1="257" x2="713" y2="270" marker-end="url(#a-acc)"/>
    </svg>