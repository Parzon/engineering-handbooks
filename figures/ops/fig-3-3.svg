      <text class="ts" x="196" y="158">processor type</text>

      <rect class="n" x="450" y="20" width="200" height="56" rx="5"/>
      <text class="tb" x="466" y="44">linux/amd64</text>
      <text class="ts" x="466" y="62">most cloud servers</text>
      <rect class="n" x="450" y="96" width="200" height="56" rx="5"/>
      <text class="tb" x="466" y="120">linux/arm64</text>
      <text class="ts" x="466" y="138">Graviton, Apple silicon</text>
      <rect class="n-soft" x="450" y="172" width="200" height="56" rx="5"/>
      <text class="tm" x="466" y="196">unknown/unknown</text>
      <text class="ts" x="466" y="214">attestations, not images</text>
      <path class="e" d="M391,110 C420,110 420,48 448,48" marker-end="url(#a)"/>
      <line class="e" x1="391" y1="124" x2="448" y2="124" marker-end="url(#a)"/>
      <path class="e dash" d="M391,138 C420,138 420,200 448,200" marker-end="url(#a)"/>

      <text class="tb" x="676" y="44">An amd64 host</text>
      <text class="ts" x="676" y="62">pulls this one</text>
      <text class="tb" x="676" y="120">An arm64 host</text>
      <text class="ts" x="676" y="138">pulls this one</text>
      <text class="ts tr" x="450" y="252">An image for the wrong processor fails to start with</text>
      <text class="tm tr" x="450" y="270">exec format error</text>
    </svg>