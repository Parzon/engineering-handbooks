      <text class="ts" x="30" y="165">operating system packages, the language runtime</text>
      <text class="ts" x="470" y="155">the tag is re-pointed</text>
      <text class="ts" x="660" y="155">tag plus digest</text>
      <rect class="n" x="16" y="180" width="430" height="44" rx="4"/>
      <text class="tb" x="30" y="201">How it was built</text>
      <text class="ts" x="30" y="217">CI actions, build tools, the registry</text>
      <text class="ts" x="470" y="207">an action's tag is moved</text>
      <text class="ts" x="660" y="207">actions pinned by SHA</text>
      <rect class="n" x="16" y="232" width="430" height="44" rx="4"/>
      <text class="tb" x="30" y="253">How it is checked</text>
