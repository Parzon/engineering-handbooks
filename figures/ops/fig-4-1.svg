<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" role="img" aria-label="Layers from top to bottom: your code; application dependencies from PyPI and npm; the base image's operating system packages; the CI actions and build tools that produced the image; the scanners that check it. Each layer has a control: review, lockfiles with hashes, base image digests, actions pinned by commit SHA, scanner images pinned by digest."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
