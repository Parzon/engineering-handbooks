<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" role="img" aria-label="A HIGH or CRITICAL finding is checked: does a fixed version exist? If not, the scan does not report it at all, so nothing records it and it needs a separate review. If one exists, the build fails. When the fix can be taken, the dependency or base image is bumped, usually by the bot's pull request. When it cannot be taken yet, for example because no rebuilt base image exists, a person accepts the risk in the accepted-risks file with a reason and an expiry at most 90 days out; code owners approve; at expiry the scan fails again. Findings in third-party images the team does not build are reported, not failed."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #146b55; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #e2f1eb; stroke: #146b55; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #146b55; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #146b55; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #146b55; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="300" fill="#ffffff"/>
      <rect class="n-acc" x="16" y="120" width="140" height="58" rx="6"/>
      <text class="tb" x="86" y="145" text-anchor="middle">A finding</text>
      <text class="ts" x="86" y="163" text-anchor="middle">HIGH or CRITICAL</text>

      <rect class="n-soft" x="200" y="120" width="150" height="58" rx="6"/>
      <text class="tb" x="275" y="145" text-anchor="middle">Is a fixed</text>
      <text class="tb" x="275" y="163" text-anchor="middle">version out?</text>
      <line class="e" x1="157" y1="149" x2="198" y2="149" marker-end="url(#a)"/>

      <rect class="n-bad" x="410" y="28" width="190" height="64" rx="6"/>
      <text class="tb tr" x="505" y="54" text-anchor="middle">The build fails</text>
      <text class="ts" x="505" y="74" text-anchor="middle">merge and release blocked</text>
      <rect class="n-good" x="640" y="28" width="166" height="64" rx="6"/>
      <text class="tb" x="723" y="54" text-anchor="middle">Bump it</text>
      <text class="ts" x="723" y="74" text-anchor="middle">fix usable: the bot's PR</text>
      <path class="e-bad" d="M275,119 V60 H408" marker-end="url(#a-bad)"/>
      <text class="ts" x="300" y="52">yes</text>
      <line class="e" x1="601" y1="60" x2="638" y2="60" marker-end="url(#a)"/>

      <rect class="n-warn" x="410" y="160" width="190" height="78" rx="6"/>
      <text class="tb" x="505" y="184" text-anchor="middle">Accept, explicitly</text>
      <text class="ts" x="505" y="202" text-anchor="middle">a reason and an approver;</text>
      <text class="ts" x="505" y="218" text-anchor="middle">expires within 90 days</text>
      <rect class="n" x="640" y="160" width="166" height="78" rx="6"/>
      <text class="tb" x="723" y="184" text-anchor="middle">Code owners</text>
      <text class="ts" x="723" y="202" text-anchor="middle">approve the change</text>
      <text class="ts" x="723" y="218" text-anchor="middle">to the risk file</text>
      <line class="e" x1="505" y1="93" x2="505" y2="158" marker-end="url(#a)"/>
      <text class="ts" x="515" y="122">fix not yet usable,</text>
      <text class="ts" x="515" y="138">e.g. no new base yet</text>

      <rect class="n-soft" x="200" y="214" width="150" height="70" rx="6"/>
      <text class="tb" x="275" y="238" text-anchor="middle">Reported, not blocking</text>
      <text class="ts" x="275" y="256" text-anchor="middle">listed by the weekly</text>
      <text class="ts" x="275" y="272" text-anchor="middle">report-only scan</text>
      <line class="e" x1="275" y1="179" x2="275" y2="212" marker-end="url(#a)"/>
      <text class="ts" x="284" y="200">no</text>
      <line class="e" x1="601" y1="199" x2="638" y2="199" marker-end="url(#a)"/>
      <path class="e dash" d="M723,239 V268 H505 V240" marker-end="url(#a)"/>
      <text class="ts" x="614" y="286" text-anchor="middle">at expiry the scan fails again, and someone decides again</text>

      <text class="ts" x="16" y="232">Third-party images the</text>
      <text class="ts" x="16" y="248">team does not build:</text>
      <text class="ts" x="16" y="264">reported, never failed</text>
    </svg>