<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 416" role="img" aria-label="Sequence: the job requests an ID token from GitHub, presents it to AWS STS, STS verifies the signature and checks aud and sub against the role's trust policy, returns one-hour credentials, and the job uses them to push images to ECR. A mismatch returns AccessDenied."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #146b55; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #e2f1eb; stroke: #146b55; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #146b55; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #146b55; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #146b55; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="416" fill="#ffffff"/>
      <rect class="n" x="20" y="14" width="140" height="46" rx="5"/>
      <text class="tb" x="90" y="34" text-anchor="middle">GitHub Actions job</text>
      <text class="ts" x="90" y="51" text-anchor="middle">the release workflow</text>
      <rect class="n" x="200" y="14" width="140" height="46" rx="5"/>
      <text class="tb" x="270" y="34" text-anchor="middle">GitHub token service</text>
      <text class="ts" x="270" y="51" text-anchor="middle">the OIDC issuer</text>
      <rect class="n" x="380" y="14" width="140" height="46" rx="5"/>
      <text class="tb" x="450" y="34" text-anchor="middle">AWS STS</text>
      <text class="ts" x="450" y="51" text-anchor="middle">security token service</text>
      <rect class="n" x="550" y="14" width="140" height="46" rx="5"/>
      <text class="tb" x="620" y="34" text-anchor="middle">IAM role</text>
      <text class="ts" x="620" y="51" text-anchor="middle">its trust policy</text>
      <rect class="n" x="710" y="14" width="100" height="46" rx="5"/>
      <text class="tb" x="760" y="34" text-anchor="middle">Amazon ECR</text>
      <text class="ts" x="760" y="51" text-anchor="middle">the registry</text>

      <line class="rule dash" x1="90" y1="60" x2="90" y2="404"/>
      <line class="rule dash" x1="270" y1="60" x2="270" y2="404"/>
      <line class="rule dash" x1="450" y1="60" x2="450" y2="404"/>
      <line class="rule dash" x1="620" y1="60" x2="620" y2="404"/>
      <line class="rule dash" x1="760" y1="60" x2="760" y2="404"/>

      <line class="e" x1="90" y1="96" x2="268" y2="96" marker-end="url(#a)"/>
      <text class="ts" x="180" y="88" text-anchor="middle">1  request an ID token</text>
      <line class="e dash" x1="270" y1="134" x2="92" y2="134" marker-end="url(#a)"/>
      <text class="ts" x="180" y="126" text-anchor="middle">2  signed JWT: iss, aud, sub</text>
      <line class="e" x1="90" y1="176" x2="448" y2="176" marker-end="url(#a)"/>
      <text class="ts" x="270" y="168" text-anchor="middle">3  AssumeRoleWithWebIdentity(role, JWT)</text>
      <path class="e" d="M450,200 h28 v20 h-26" marker-end="url(#a)"/>
      <text class="ts" x="486" y="208">4  verify the signature</text>
      <text class="ts" x="486" y="223">with the issuer's keys</text>
      <line class="e" x1="450" y1="262" x2="618" y2="262" marker-end="url(#a)"/>
      <text class="ts" x="535" y="254" text-anchor="middle">5  do aud and sub match?</text>
      <line class="e-good dash" x1="620" y1="294" x2="452" y2="294" marker-end="url(#a-good)"/>
      <text class="ts" x="535" y="286" text-anchor="middle">6  yes</text>
      <line class="e-acc dash" x1="450" y1="334" x2="92" y2="334" marker-end="url(#a-acc)"/>
      <text class="ts" x="270" y="326" text-anchor="middle">7  temporary credentials, valid for one hour</text>
      <line class="e" x1="90" y1="384" x2="758" y2="384" marker-end="url(#a)"/>
      <text class="ts" x="424" y="376" text-anchor="middle">8  push the images, as the role</text>

      <rect class="n-bad" x="638" y="300" width="174" height="46" rx="5"/>
      <text class="ts" x="650" y="318">if aud or sub differ:</text>
      <text class="tb tr" x="650" y="336">AccessDenied</text>
    </svg>