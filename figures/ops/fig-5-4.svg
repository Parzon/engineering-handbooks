<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 262" role="img" aria-label="Two lanes. The release workflow's ecr job, on a version tag, presents a token that the ecr-push role trusts, and may push and pull three ECR repositories. The deploy workflow, inside the aws-demo environment, presents a token the deploy role trusts, and may only assume the CDK bootstrap roles."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
