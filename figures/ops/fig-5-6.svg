<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 230" role="img" aria-label="Four steps: breaking the policy on purpose failed as expected; restoring the name failed again; reading the real subject showed it embeds owner and repository IDs; fixing the prefix made all three image copies pass with matching digests."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
