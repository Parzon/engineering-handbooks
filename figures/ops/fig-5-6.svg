      <text class="tb" x="234" y="88">2  Restore the name</text>
      <text class="ts" x="234" y="108">re-run only the failed</text>
      <text class="ts" x="234" y="124">jobs, no new release</text>

      <rect class="n-acc" x="428" y="30" width="182" height="130" rx="6"/>
      <rect class="fill-surface" x="440" y="42" width="80" height="20" rx="10"/>
      <text class="ts ta tb" x="480" y="56" text-anchor="middle">the cause</text>
      <text class="tb" x="440" y="88">3  Read the real subject</text>
      <text class="ts" x="440" y="108">the repository's OIDC</text>
      <text class="ts" x="440" y="124">setting: owner and repo</text>
      <text class="ts" x="440" y="140">IDs are embedded</text>

      <rect class="n-good" x="634" y="30" width="170" height="130" rx="6"/>
      <rect class="fill-surface" x="646" y="42" width="64" height="20" rx="10"/>
      <text class="ts tg tb" x="678" y="56" text-anchor="middle">passed</text>
      <text class="tb" x="646" y="88">4  Fix and re-run</text>
      <text class="ts" x="646" y="108">all three image copies</text>
      <text class="ts" x="646" y="124">succeed; digests match</text>
      <text class="ts" x="646" y="140">the originals</text>

      <line class="e" x1="199" y1="95" x2="220" y2="95" marker-end="url(#a)"/>
      <line class="e" x1="405" y1="95" x2="426" y2="95" marker-end="url(#a)"/>
      <line class="e" x1="611" y1="95" x2="632" y2="95" marker-end="url(#a)"/>

      <text class="ts" x="410" y="196" text-anchor="middle">Step 1 failed for the wrong reason: the policy had never matched at all.</text>
      <text class="ts" x="410" y="214" text-anchor="middle">A negative test proves a check works only after a positive test has passed.</text>
