      <text class="ts" x="342" y="216" text-anchor="middle">reproducible; one box</text>
      <rect class="n" x="412" y="124" width="124" height="160" rx="4"/>
      <text class="tb" x="474" y="146" text-anchor="middle">3  Several servers</text>
      <text class="ts" x="474" y="164" text-anchor="middle">behind a load balancer</text>
      <rect class="n-acc" x="544" y="88" width="124" height="196" rx="4"/>
      <text class="tb" x="606" y="110" text-anchor="middle">4  Orchestrator</text>
      <text class="ts" x="606" y="128" text-anchor="middle">declare N copies of X;</text>
      <text class="ts" x="606" y="144" text-anchor="middle">it reconciles</text>
      <rect class="n-acc" x="676" y="52" width="128" height="232" rx="4"/>
      <text class="tb" x="740" y="74" text-anchor="middle">5  Serverless</text>
      <text class="ts" x="740" y="92" text-anchor="middle">the platform owns</text>
      <text class="ts" x="740" y="108" text-anchor="middle">the machines</text>

      <text class="ts tmu" x="342" y="252" text-anchor="middle">the reference VM</text>
      <text class="ts tmu" x="606" y="252" text-anchor="middle">ECS, Kubernetes</text>
      <text class="ts tmu" x="740" y="252" text-anchor="middle">Fargate, Cloud Run,</text>
      <text class="ts tmu" x="740" y="268" text-anchor="middle">Lambda</text>
      <text class="tl" x="16" y="22">EACH RUNG HANDS ANOTHER JOB TO AUTOMATION</text>
      <path class="e-acc" d="M40,212 L760,30" marker-end="url(#a-acc)"/>
    </svg>