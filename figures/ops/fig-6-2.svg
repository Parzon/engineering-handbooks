<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 292" role="img" aria-label="Two timelines. A plain recreate stops the old container first, so new requests are refused during the drain: 6.7 seconds of 502 errors, and as long as the longest stream. The rolling deploy runs migrations, starts the new api beside the old, waits until it is healthy and resolved by nginx, then drains the old api; only replacing nginx leaves a gap of about 0.3 seconds."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #146b55; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #e2f1eb; stroke: #146b55; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #146b55; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #146b55; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #146b55; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="292" fill="#ffffff"/>
      <text class="tb" x="16" y="30">Plain recreate</text>
      <text class="ts" x="16" y="48">compose up replaces a container by stopping it first</text>
      <rect class="n" x="16" y="62" width="180" height="30" rx="3"/><text class="ts" x="106" y="82" text-anchor="middle">old api serving</text>
      <rect class="n-bad" x="196" y="62" width="200" height="30" rx="3"/><text class="ts tr tb" x="296" y="82" text-anchor="middle">nothing accepts: 502</text>
      <rect class="n-good" x="396" y="62" width="408" height="30" rx="3"/><text class="ts" x="600" y="82" text-anchor="middle">new api serving</text>
      <text class="ts tr" x="296" y="110" text-anchor="middle">6.7 s, or as long as the longest answer in flight</text>

      <line class="rule" x1="16" y1="130" x2="804" y2="130"/>
      <text class="tb" x="16" y="156">Rolling deploy on one host</text>
      <text class="ts" x="16" y="174">the reference deploy script</text>
      <text class="ts" x="96" y="200" text-anchor="middle">migrate</text>
      <text class="ts" x="250" y="200" text-anchor="middle">start new</text>
      <text class="ts" x="380" y="200" text-anchor="middle">healthy</text>
      <text class="ts" x="446" y="200" text-anchor="start">stop old</text>
      <line class="e" x1="96" y1="206" x2="96" y2="220"/>
      <line class="e" x1="250" y1="206" x2="250" y2="252"/>
      <line class="e" x1="380" y1="206" x2="380" y2="252"/>
      <line class="e" x1="446" y1="206" x2="446" y2="220"/>
      <rect class="n" x="16" y="222" width="430" height="26" rx="3"/><text class="ts" x="231" y="240" text-anchor="middle">old api serving, then draining its in-flight requests</text>
      <rect class="n-good" x="250" y="254" width="554" height="26" rx="3"/><text class="ts" x="527" y="272" text-anchor="middle">new api: started beside the old, healthy, then serving</text>
      <rect class="n-warn" x="620" y="192" width="12" height="30" rx="2"/>
      <text class="ts tw" x="640" y="204">nginx replaced:</text>
      <text class="ts tw" x="640" y="219">about 0.3 s gap</text>
    </svg>