<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 276" role="img" aria-label="Two lanes. CDK: Python code is synthesized into a CloudFormation template; cdk diff compares it with the deployed stack; CloudFormation creates, updates or deletes only what differs and remembers every resource in the stack. Terraform: HCL code is planned against a state file stored remotely with a lock; apply calls the provider's APIs for the difference and updates the state."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
