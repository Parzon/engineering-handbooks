      <line class="e-acc" x1="537" y1="70" x2="574" y2="70" marker-end="url(#a-acc)"/>
      <text class="ts" x="16" y="124">CloudFormation keeps the record in AWS, so deleting the stack removes exactly what it created.</text>

      <line class="rule" x1="16" y1="142" x2="804" y2="142"/>
      <text class="tb" x="16" y="170">Terraform, any cloud</text>
      <rect class="n" x="16" y="182" width="140" height="64" rx="5"/><text class="tb" x="86" y="208" text-anchor="middle">HCL code</text><text class="ts" x="86" y="226" text-anchor="middle">resources, modules</text>
      <rect class="n-soft" x="196" y="182" width="150" height="64" rx="5"/><text class="tb" x="271" y="208" text-anchor="middle">State file</text><text class="ts" x="271" y="226" text-anchor="middle">remote, with a lock</text>
      <rect class="n-acc" x="386" y="182" width="150" height="64" rx="5"/><text class="tb" x="461" y="208" text-anchor="middle">terraform plan</text><text class="ts" x="461" y="226" text-anchor="middle">read it in review</text>
      <rect class="n" x="576" y="182" width="228" height="64" rx="5"/><text class="tb" x="690" y="208" text-anchor="middle">terraform apply</text><text class="ts" x="690" y="226" text-anchor="middle">provider API calls, state updated</text>
