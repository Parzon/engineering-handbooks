  </defs><rect width="820" height="276" fill="#ffffff"/>
      <text class="tb" x="16" y="26">CDK on AWS</text>
      <rect class="n" x="16" y="38" width="140" height="64" rx="5"/><text class="tb" x="86" y="64" text-anchor="middle">Python code</text><text class="ts" x="86" y="82" text-anchor="middle">constructs, loops</text>
