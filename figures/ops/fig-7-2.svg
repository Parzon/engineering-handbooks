<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" role="img" aria-label="Five stacks. triage-registry, triage-cicd and triage-network are permanent and free or nearly so. triage-vm and triage-app cost money per hour and are created and destroyed at will. The CI stack and both compute stacks reference the registry's repositories; both compute stacks use the network's VPC."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #146b55; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #e2f1eb; stroke: #146b55; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #146b55; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #146b55; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #146b55; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="250" fill="#ffffff"/>
      <text class="tl" x="16" y="20">PERMANENT, FREE OR CENTS</text>
      <text class="tl" x="560" y="20">BILLED BY THE HOUR, DISPOSABLE</text>
      <rect class="n" x="16" y="34" width="200" height="58" rx="5"/><text class="tm tb" x="116" y="58" text-anchor="middle">triage-registry</text><text class="ts" x="116" y="76" text-anchor="middle">3 image repositories</text>
      <rect class="n" x="16" y="104" width="200" height="58" rx="5"/><text class="tm tb" x="116" y="128" text-anchor="middle">triage-cicd</text><text class="ts" x="116" y="146" text-anchor="middle">OIDC provider, 2 roles</text>
      <rect class="n" x="16" y="174" width="200" height="58" rx="5"/><text class="tm tb" x="116" y="198" text-anchor="middle">triage-network</text><text class="ts" x="116" y="216" text-anchor="middle">VPC, 2 zones, no NAT</text>
      <rect class="n-acc" x="560" y="56" width="244" height="58" rx="5"/><text class="tm tb" x="682" y="80" text-anchor="middle">triage-vm</text><text class="ts" x="682" y="98" text-anchor="middle">one VM, about $0.10 an hour</text>
      <rect class="n-acc" x="560" y="146" width="244" height="58" rx="5"/><text class="tm tb" x="682" y="170" text-anchor="middle">triage-app</text><text class="ts" x="682" y="188" text-anchor="middle">ECS, RDS, cache, ALB: $0.17/h</text>
      <path class="e" d="M217,63 C300,63 300,133 218,133" marker-end="url(#a)"/>
      <text class="ts" x="300" y="100">repositories</text>
      <path class="e" d="M217,55 C400,55 450,85 558,85" marker-end="url(#a)"/>
      <path class="e" d="M217,70 C400,70 450,165 558,170" marker-end="url(#a)"/>
      <path class="e" d="M217,203 C400,203 450,100 558,96" marker-end="url(#a)"/>
      <path class="e" d="M217,210 C400,210 450,185 558,182" marker-end="url(#a)"/>
      <text class="ts" x="390" y="48" text-anchor="middle">image repositories</text>
      <text class="ts" x="390" y="226" text-anchor="middle">VPC and subnets</text>
    </svg>