<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 200" role="img" aria-label="Drift in four steps: the code says one task; a command-line change sets two; drift detection reports DesiredCount expected 1, actual 2; the change is made in code, reviewed, merged and deployed, and drift shows IN_SYNC."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #146b55; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #e2f1eb; stroke: #146b55; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #146b55; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #146b55; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #146b55; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="200" fill="#ffffff"/>
      <rect class="n" x="16" y="40" width="176" height="84" rx="6"/>
      <text class="tb" x="104" y="66" text-anchor="middle">The code says</text>
      <text class="tm" x="104" y="90" text-anchor="middle">desired count: 1</text>
      <rect class="n-warn" x="220" y="40" width="176" height="84" rx="6"/>
      <text class="tb" x="308" y="66" text-anchor="middle">A manual change</text>
      <text class="tm" x="308" y="90" text-anchor="middle">update-service</text>
      <text class="tm" x="308" y="108" text-anchor="middle">--desired-count 2</text>
      <rect class="n-bad" x="424" y="40" width="176" height="84" rx="6"/>
      <text class="tb" x="512" y="66" text-anchor="middle">Drift detected</text>
      <text class="tm" x="512" y="90" text-anchor="middle">expected 1</text>
      <text class="tm" x="512" y="108" text-anchor="middle">actual 2</text>
      <rect class="n-good" x="628" y="40" width="176" height="84" rx="6"/>
      <text class="tb" x="716" y="66" text-anchor="middle">Fixed in code</text>
      <text class="ts" x="716" y="90" text-anchor="middle">pull request, CI, deploy</text>
      <text class="tm" x="716" y="108" text-anchor="middle">IN_SYNC</text>
      <line class="e" x1="193" y1="82" x2="218" y2="82" marker-end="url(#a)"/>
      <line class="e" x1="397" y1="82" x2="422" y2="82" marker-end="url(#a)"/>
      <line class="e" x1="601" y1="82" x2="626" y2="82" marker-end="url(#a)"/>
      <text class="ts" x="410" y="160" text-anchor="middle">Without detection, the next deploy would have reset the count to 1, silently.</text>
      <text class="ts" x="410" y="178" text-anchor="middle">The same pull request added autoscaling, so the count is now managed in code.</text>
    </svg>