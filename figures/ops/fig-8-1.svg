<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 272" role="img" aria-label="Home network concepts mapped to AWS: the router's doorway to the internet is an internet gateway; its outbound address translation is a NAT gateway; its firewall is security groups; the home address range is the VPC's CIDR block; a device on Wi-Fi is an instance in a private subnet; the router's DMZ host is a public subnet; guest Wi-Fi is a second subnet with restricted routing."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #146b55; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #e2f1eb; stroke: #146b55; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #146b55; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #146b55; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #146b55; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="272" fill="#ffffff"/>
      <text class="tl" x="16" y="20">AT HOME</text>
      <text class="tl" x="470" y="20">ON AWS</text>
      <g>
        <rect class="n-soft" x="16" y="30" width="330" height="30" rx="4"/><text class="ts" x="28" y="50">the router's doorway to the internet</text>
        <rect class="n-acc" x="470" y="30" width="334" height="30" rx="4"/><text class="tb" x="482" y="50">Internet gateway</text>
        <line class="e" x1="347" y1="45" x2="468" y2="45" marker-end="url(#a)"/>
        <rect class="n-soft" x="16" y="64" width="330" height="30" rx="4"/><text class="ts" x="28" y="84">outbound translation for your devices</text>
        <rect class="n-acc" x="470" y="64" width="334" height="30" rx="4"/><text class="tb" x="482" y="84">NAT gateway</text>
        <line class="e" x1="347" y1="79" x2="468" y2="79" marker-end="url(#a)"/>
        <rect class="n-soft" x="16" y="98" width="330" height="30" rx="4"/><text class="ts" x="28" y="118">the router's firewall</text>
        <rect class="n-acc" x="470" y="98" width="334" height="30" rx="4"/><text class="tb" x="482" y="118">Security groups (and network ACLs)</text>
        <line class="e" x1="347" y1="113" x2="468" y2="113" marker-end="url(#a)"/>
        <rect class="n-soft" x="16" y="132" width="330" height="30" rx="4"/><text class="ts" x="28" y="152">the home address range, 192.168.1.0/24</text>
        <rect class="n" x="470" y="132" width="334" height="30" rx="4"/><text class="tb" x="482" y="152">The VPC's CIDR block, such as 10.20.0.0/16</text>
        <line class="e" x1="347" y1="147" x2="468" y2="147" marker-end="url(#a)"/>
        <rect class="n-soft" x="16" y="166" width="330" height="30" rx="4"/><text class="ts" x="28" y="186">a laptop on the Wi-Fi</text>
        <rect class="n" x="470" y="166" width="334" height="30" rx="4"/><text class="tb" x="482" y="186">An instance in a private subnet</text>
        <line class="e" x1="347" y1="181" x2="468" y2="181" marker-end="url(#a)"/>
        <rect class="n-soft" x="16" y="200" width="330" height="30" rx="4"/><text class="ts" x="28" y="220">the router's DMZ host</text>
        <rect class="n" x="470" y="200" width="334" height="30" rx="4"/><text class="tb" x="482" y="220">A public subnet</text>
        <line class="e" x1="347" y1="215" x2="468" y2="215" marker-end="url(#a)"/>
        <rect class="n-soft" x="16" y="234" width="330" height="30" rx="4"/><text class="ts" x="28" y="254">guest Wi-Fi</text>
        <rect class="n" x="470" y="234" width="334" height="30" rx="4"/><text class="tb" x="482" y="254">A second subnet with restricted routing</text>
        <line class="e" x1="347" y1="249" x2="468" y2="249" marker-end="url(#a)"/>
      </g>
    </svg>