<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" role="img" aria-label="Left, a chain: api depends on migrate, which depends on dbinit. dbinit fails fast, migrate never runs, and the api waits: the task stays pending, measured more than four minutes in a test and 13 minutes in an outage. Right, direct dependencies: api depends on dbinit and on migrate. dbinit fails, the api gives up, and ECS stops the task in about 1.5 minutes, then retries."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #146b55; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #e2f1eb; stroke: #146b55; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #146b55; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #146b55; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #146b55; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="260" fill="#ffffff"/>
      <text class="tb" x="16" y="26">A chain</text>
      <text class="ts" x="16" y="44">api waits on migrate, which waits on dbinit</text>
      <rect class="n-bad" x="16" y="60" width="110" height="50" rx="5"/><text class="tm tb" x="71" y="82" text-anchor="middle">dbinit</text><text class="ts tr" x="71" y="100" text-anchor="middle">exits 2</text>
      <rect class="n-soft" x="150" y="60" width="110" height="50" rx="5"/><text class="tm tb" x="205" y="82" text-anchor="middle">migrate</text><text class="ts" x="205" y="100" text-anchor="middle">never runs</text>
      <rect class="n-warn" x="284" y="60" width="110" height="50" rx="5"/><text class="tm tb" x="339" y="82" text-anchor="middle">api</text><text class="ts tw" x="339" y="100" text-anchor="middle">waits forever</text>
      <line class="e" x1="149" y1="85" x2="128" y2="85" marker-end="url(#a)"/>
      <line class="e" x1="283" y1="85" x2="262" y2="85" marker-end="url(#a)"/>
      <rect class="n-bad" x="16" y="140" width="378" height="56" rx="6"/>
      <text class="tb tr" x="205" y="164" text-anchor="middle">Task PENDING, still billed</text>
      <text class="ts" x="205" y="184" text-anchor="middle">over 4 minutes in a test; 13 minutes in an outage</text>

      <line class="rule" x1="418" y1="16" x2="418" y2="240"/>
      <text class="tb" x="440" y="26">Direct dependencies</text>
      <text class="ts" x="440" y="44">api waits on each init container itself</text>
      <rect class="n-bad" x="440" y="60" width="110" height="50" rx="5"/><text class="tm tb" x="495" y="82" text-anchor="middle">dbinit</text><text class="ts tr" x="495" y="100" text-anchor="middle">exits 2</text>
      <rect class="n-soft" x="440" y="120" width="110" height="50" rx="5"/><text class="tm tb" x="495" y="142" text-anchor="middle">migrate</text><text class="ts" x="495" y="160" text-anchor="middle">never runs</text>
      <rect class="n" x="640" y="88" width="110" height="50" rx="5"/><text class="tm tb" x="695" y="110" text-anchor="middle">api</text><text class="ts" x="695" y="128" text-anchor="middle">gives up</text>
      <line class="e" x1="639" y1="105" x2="552" y2="85" marker-end="url(#a)"/>
      <line class="e" x1="639" y1="122" x2="552" y2="145" marker-end="url(#a)"/>
      <rect class="n-good" x="440" y="190" width="364" height="56" rx="6"/>
      <text class="tb" x="622" y="214" text-anchor="middle">Task stopped in 1.5 minutes</text>
      <text class="ts" x="622" y="234" text-anchor="middle">ECS starts a fresh one; it succeeds once the database is back</text>
    </svg>