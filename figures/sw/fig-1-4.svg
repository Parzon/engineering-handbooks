<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 230" role="img" aria-label="Configuration flow: .env.example, committed, lists every variable; setup generates .env with fresh secrets, never committed; Compose passes only variables listed under each service's environment; the container reads them into typed settings; in production mode, unsafe values stop the service at startup with each problem named. A check in lint makes sure every setting is listed in Compose."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #2349a3; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
