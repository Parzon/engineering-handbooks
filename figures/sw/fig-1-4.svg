.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #2349a3; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #2349a3; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #2349a3; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="230" fill="#ffffff"/>
      <rect class="n-acc" x="16" y="40" width="140" height="70" rx="5"/><text class="tm tb" x="86" y="66" text-anchor="middle">.env.example</text><text class="ts" x="86" y="84" text-anchor="middle">committed: the</text><text class="ts" x="86" y="99" text-anchor="middle">contract</text>
      <rect class="n" x="186" y="40" width="140" height="70" rx="5"/><text class="tm tb" x="256" y="66" text-anchor="middle">.env</text><text class="ts" x="256" y="84" text-anchor="middle">secrets generated;</text><text class="ts" x="256" y="99" text-anchor="middle">never committed</text>
      <rect class="n" x="356" y="40" width="140" height="70" rx="5"/><text class="tb" x="426" y="66" text-anchor="middle">Compose</text><text class="ts" x="426" y="84" text-anchor="middle">passes only what a</text><text class="ts" x="426" y="99" text-anchor="middle">service lists</text>
      <rect class="n" x="526" y="40" width="130" height="70" rx="5"/><text class="tb" x="591" y="66" text-anchor="middle">Typed settings</text><text class="ts" x="591" y="84" text-anchor="middle">validated at</text><text class="ts" x="591" y="99" text-anchor="middle">startup</text>
      <rect class="n-bad" x="686" y="40" width="118" height="70" rx="5"/><text class="tb" x="745" y="66" text-anchor="middle">Refuses</text><text class="ts" x="745" y="84" text-anchor="middle">in production, on</text><text class="ts" x="745" y="99" text-anchor="middle">unsafe values</text>
      <line class="e" x1="157" y1="75" x2="184" y2="75" marker-end="url(#a)"/>
      <line class="e" x1="327" y1="75" x2="354" y2="75" marker-end="url(#a)"/>
      <line class="e" x1="497" y1="75" x2="524" y2="75" marker-end="url(#a)"/>
      <line class="e-bad" x1="657" y1="75" x2="684" y2="75" marker-end="url(#a-bad)"/>
      <rect class="n-warn" x="356" y="140" width="300" height="74" rx="5"/>
      <text class="tb" x="370" y="162">The trap a lint check now closes</text>
      <text class="ts" x="370" y="182">22 settings could not be changed from .env:</text>
      <text class="ts" x="370" y="198">Compose never passed them, and nothing said so</text>
