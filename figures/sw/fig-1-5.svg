      <line class="e" x1="108" y1="141" x2="108" y2="158"/><line class="e" x1="309" y1="141" x2="309" y2="158"/><line class="e" x1="510" y1="141" x2="510" y2="158"/><line class="e" x1="711" y1="141" x2="711" y2="158"/>
