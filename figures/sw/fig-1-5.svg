<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 230" role="img" aria-label="One base compose file shared by every environment, with overlays: the development override, merged automatically, adds hot reload and binds ports to localhost; the production overlay uses release images, limits, read-only filesystems and publishes only the edge; the test overlay runs a throwaway stack under its own project name; the debug overlay runs the api under a debugger."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
