  </defs><rect width="820" height="230" fill="#ffffff"/>
      <rect class="n-acc" x="16" y="160" width="788" height="54" rx="6"/>
      <text class="tm tb" x="30" y="184">compose.yaml</text>
      <text class="ts" x="30" y="203">every service, shared by all environments; never run alone</text>
      <rect class="n" x="16" y="30" width="185" height="110" rx="5"/><text class="tm tb" x="28" y="52">compose.override</text><text class="ts" x="28" y="72">development, merged</text><text class="ts" x="28" y="88">automatically: hot reload,</text><text class="ts" x="28" y="104">ports on localhost only</text>
