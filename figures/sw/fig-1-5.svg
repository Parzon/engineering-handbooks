      <rect class="n" x="418" y="30" width="185" height="110" rx="5"/><text class="tm tb" x="430" y="52">compose.test</text><text class="ts" x="430" y="72">a throwaway stack under</text><text class="ts" x="430" y="88">its own project name,</text><text class="ts" x="430" y="104">deleted after the run</text>
