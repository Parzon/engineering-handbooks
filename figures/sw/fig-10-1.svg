      <text class="tl" x="580" y="30">THE FRAMEWORK ITSELF</text>
      <text class="ts" x="580" y="56"><tspan class="tb">React</tspan>: largest ecosystem and hiring pool</text>
      <text class="ts" x="580" y="80"><tspan class="tb">Vue</tspan>: gentler curve, more built in</text>
      <text class="ts" x="580" y="104"><tspan class="tb">Svelte</tspan>: compiles away, small bundles</text>
