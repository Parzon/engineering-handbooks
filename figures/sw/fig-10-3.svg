<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 240" role="img" aria-label="Three ways to push data. Server-Sent Events: one HTTP response that stays open, server to browser, events as lines of text; right for a model's tokens or live status. WebSockets: a persistent two-way connection, needed when the client also streams continuously, such as collaborative editing or multiplayer; heavier to run behind ordinary load balancers. Polling: the browser asks repeatedly; simple, wasteful and laggy; the fallback."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #2349a3; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #e7edf9; stroke: #2349a3; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #2349a3; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #2349a3; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #2349a3; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="240" fill="#ffffff"/>
      <text class="tb" x="16" y="26">Server-Sent Events</text>
      <rect class="n" x="16" y="38" width="90" height="40" rx="5"/><text class="ts" x="61" y="62" text-anchor="middle">browser</text>
      <rect class="n" x="290" y="38" width="90" height="40" rx="5"/><text class="ts" x="335" y="62" text-anchor="middle">server</text>
      <line class="e" x1="107" y1="48" x2="288" y2="48" marker-end="url(#a)"/><text class="ts" x="197" y="44" text-anchor="middle">one request</text>
      <line class="e-acc" x1="289" y1="64" x2="109" y2="64" marker-end="url(#a-acc)"/><line class="e-acc" x1="289" y1="72" x2="109" y2="72" marker-end="url(#a-acc)"/>
      <text class="ts" x="400" y="52">one long HTTP response, events as text lines</text><text class="ts" x="400" y="70">use for: model tokens, live status</text>

      <text class="tb" x="16" y="112">WebSockets</text>
      <rect class="n" x="16" y="124" width="90" height="40" rx="5"/><text class="ts" x="61" y="148" text-anchor="middle">browser</text>
      <rect class="n" x="290" y="124" width="90" height="40" rx="5"/><text class="ts" x="335" y="148" text-anchor="middle">server</text>
      <line class="e" x1="107" y1="136" x2="288" y2="136" marker-end="url(#a)"/><line class="e" x1="289" y1="152" x2="109" y2="152" marker-end="url(#a)"/>
      <text class="ts" x="400" y="138">persistent and two-way; heavier to run</text><text class="ts" x="400" y="156">use only when the client must stream too</text>

      <text class="tb" x="16" y="198">Polling</text>
      <text class="ts" x="16" y="216">ask, wait, ask again: simple, wasteful and laggy; the fallback when neither fits</text>
    </svg>