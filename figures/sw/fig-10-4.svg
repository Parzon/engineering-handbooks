<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" role="img" aria-label="The event stream: a meta event first, with the request id and how many alerts were in context; token events with JSON deltas; comment heartbeats every 15 seconds of silence; a done event with usage and timings, or an error event. Errors before the stream starts are ordinary JSON errors. Stop: the button aborts the fetch, the connection closes, the server cancels its producer task, which closes the provider's stream, and billing stops."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #2349a3; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #e7edf9; stroke: #2349a3; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #2349a3; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #2349a3; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #2349a3; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="300" fill="#ffffff"/>
      <rect class="n" x="16" y="16" width="120" height="40" rx="5"/><text class="ts" x="76" y="41" text-anchor="middle">browser</text>
      <rect class="n-acc" x="350" y="16" width="120" height="40" rx="5"/><text class="ts" x="410" y="41" text-anchor="middle">api</text>
      <rect class="n" x="684" y="16" width="120" height="40" rx="5"/><text class="ts" x="744" y="41" text-anchor="middle">model</text>
      <line class="rule dash" x1="76" y1="56" x2="76" y2="204"/><line class="rule dash" x1="410" y1="56" x2="410" y2="204"/><line class="rule dash" x1="744" y1="56" x2="744" y2="204"/>
      <line class="e" x1="76" y1="78" x2="408" y2="78" marker-end="url(#a)"/><text class="ts" x="242" y="72" text-anchor="middle">POST /chat/stream, the question in JSON</text>
      <line class="e" x1="410" y1="92" x2="742" y2="92" marker-end="url(#a)"/><text class="ts" x="576" y="86" text-anchor="middle">streamed completion</text>
      <line class="e-acc" x1="410" y1="112" x2="78" y2="112" marker-end="url(#a-acc)"/><text class="tm" x="242" y="106" text-anchor="middle">event: meta {request_id, alerts}</text>
      <line class="rule-strong dash" x1="410" y1="132" x2="78" y2="132"/><text class="tm" x="242" y="128" text-anchor="middle">: keep-alive</text>
      <line class="e-acc" x1="410" y1="152" x2="78" y2="152" marker-end="url(#a-acc)"/><text class="tm" x="242" y="148" text-anchor="middle">event: token {"delta": "Check "}</text>
      <line class="e-acc" x1="410" y1="170" x2="78" y2="170" marker-end="url(#a-acc)"/><text class="tm" x="242" y="166" text-anchor="middle">event: token {"delta": "the disk"}</text>
      <line class="e-good" x1="410" y1="194" x2="78" y2="194" marker-end="url(#a-good)"/><text class="tm" x="242" y="190" text-anchor="middle">event: done {usage, ttft_ms} or error</text>
      <rect class="n-warn" x="430" y="140" width="300" height="56" rx="5"/><text class="ts" x="442" y="160">heartbeat comments every 15 s of silence</text><text class="ts" x="442" y="176">keep proxies from closing the stream while</text><text class="ts" x="442" y="190">a reasoning model thinks</text>
      <text class="tb tr" x="16" y="232">Stop:</text>
      <text class="ts" x="60" y="232">the button aborts the fetch → the connection closes → the api cancels its producer</text>
      <text class="ts" x="60" y="250">task → the provider's stream is closed → generation, and billing, stop</text>
      <text class="ts" x="16" y="278">Errors before the stream starts (rate limit, validation, database down) are ordinary JSON errors with a status code.</text>
    </svg>