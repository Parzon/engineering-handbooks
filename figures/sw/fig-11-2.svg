<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" role="img" aria-label="A client sends X-Forwarded-For 6.6.6.6 to try to look like someone else. The edge overwrites the header with the address it actually saw. nginx accepts the header only from the proxies in front and takes the real client from it, then overwrites it again for the api. The api sees exactly one address, the real client, and rate-limits by it. If a proxy appended instead of overwriting, the forged address would survive."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #2349a3; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #e7edf9; stroke: #2349a3; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #2349a3; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #2349a3; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #2349a3; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="250" fill="#ffffff"/>
      <rect class="n-warn" x="16" y="40" width="170" height="74" rx="5"/><text class="tb" x="28" y="62">Client</text><text class="ts" x="28" y="82">sends a forged header:</text><text class="tm" x="28" y="100">XFF: 6.6.6.6</text>
      <rect class="n-acc" x="226" y="40" width="170" height="74" rx="5"/><text class="tb" x="238" y="62">Edge</text><text class="ts" x="238" y="82">overwrites it with the</text><text class="ts" x="238" y="98">address it actually saw</text>
      <rect class="n" x="436" y="40" width="170" height="74" rx="5"/><text class="tb" x="448" y="62">nginx</text><text class="ts" x="448" y="82">trusts XFF only from</text><text class="ts" x="448" y="98">the proxies in front</text>
      <rect class="n-good" x="646" y="40" width="158" height="74" rx="5"/><text class="tb" x="658" y="62">api</text><text class="ts" x="658" y="82">one address: the</text><text class="ts" x="658" y="98">real client</text>
      <line class="e" x1="187" y1="77" x2="224" y2="77" marker-end="url(#a)"/>
      <line class="e" x1="397" y1="77" x2="434" y2="77" marker-end="url(#a)"/>
      <line class="e" x1="607" y1="77" x2="644" y2="77" marker-end="url(#a)"/>
      <rect class="n-bad" x="16" y="150" width="788" height="44" rx="5"/>
      <text class="tb tr" x="28" y="170">Append instead of overwrite</text><text class="ts" x="230" y="170">and the forged 6.6.6.6 survives to the application: a client picks its own rate-limit bucket.</text>
      <text class="ts" x="28" y="186">Behind a cloud load balancer, which appends, trust only its subnet and take the rightmost address it added.</text>
      <text class="ts" x="16" y="224">Measured: a request sent with a forged header reached nginx and the api as the real client, directly and through the edge.</text>
    </svg>