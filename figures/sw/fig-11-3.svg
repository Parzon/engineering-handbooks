<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" role="img" aria-label="Three orderings that must hold. Idle keep-alive: nginx closes idle upstream connections at 60 seconds, before gunicorn's 75, so the proxy never reuses a connection the backend just closed. One hop out, the same rule: the TLS edge keeps idle connections 120 seconds and an AWS load balancer 130, so nginx keeps them 140. Streaming: the heartbeat every 15 seconds is shorter than any idle timeout in the path, including a load balancer's 60 seconds and nginx's 120-second read timeout. Request time: the pool wait and query timeouts add up to less than nginx's 30-second read timeout for ordinary requests."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #2349a3; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #e7edf9; stroke: #2349a3; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #2349a3; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #2349a3; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #2349a3; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="260" fill="#ffffff"/>
      <text class="tb" x="16" y="26">Idle keep-alive: the proxy closes first</text>
      <line class="rule-strong" x1="200" y1="48" x2="790" y2="48"/>
      <circle class="fill-acc" cx="500" cy="48" r="6"/><text class="ts" x="500" y="72" text-anchor="middle">nginx 60 s</text>
      <circle class="dot-muted" cx="575" cy="48" r="6"/><text class="ts" x="575" y="72" text-anchor="middle">gunicorn 75 s</text>
      <text class="ts" x="16" y="52">otherwise: a reused,</text><text class="ts" x="16" y="68">just-closed connection: 502</text>
      <text class="ts tmu" x="200" y="94">One hop out, the same rule: edge 120 s and load balancer 130 s, so nginx keeps its own clients 140 s.</text>

      <text class="tb" x="16" y="114">Streaming: heartbeats beat every idle timeout</text>
      <line class="rule-strong" x1="200" y1="136" x2="790" y2="136"/>
      <circle class="fill-good" cx="275" cy="136" r="6"/><text class="ts" x="275" y="160" text-anchor="middle">heartbeat 15 s</text>
      <circle class="dot-muted" cx="500" cy="136" r="6"/><text class="ts" x="500" y="160" text-anchor="middle">load balancer 60 s</text>
      <circle class="dot-muted" cx="790" cy="136" r="6"/><text class="ts" x="760" y="160" text-anchor="middle">nginx stream 120 s</text>

      <text class="tb" x="16" y="200">A request: the sum stays under the outer timeout</text>
      <rect class="n-soft" x="200" y="214" width="100" height="24" rx="3"/><text class="ts" x="250" y="230" text-anchor="middle">pool wait 5 s</text>
      <rect class="n-soft" x="300" y="214" width="200" height="24" rx="3"/><text class="ts" x="400" y="230" text-anchor="middle">query 10 s (on the role)</text>
      <line class="e-acc" x1="200" y1="248" x2="790" y2="248"/><text class="ts ta" x="790" y="232" text-anchor="end">nginx 30 s</text>
    </svg>