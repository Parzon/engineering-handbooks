    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="300" fill="#ffffff"/>
      <text class="tl" x="16" y="24">LAYERS, BOTTOM UP</text>
      <rect class="n-soft" x="16" y="232" width="330" height="36" rx="4"/><text class="ts" x="28" y="255">FROM python:3.13-slim@sha256:… (pinned)</text>
      <rect class="n-soft" x="16" y="190" width="330" height="36" rx="4"/><text class="ts" x="28" y="213">system packages, users</text>
      <rect class="n-soft" x="16" y="148" width="330" height="36" rx="4"/><text class="ts" x="28" y="171">COPY pyproject.toml uv.lock</text>
      <rect class="n-soft" x="16" y="106" width="330" height="36" rx="4"/><text class="ts" x="28" y="129">install dependencies (slow)</text>
      <rect class="n-acc" x="16" y="64" width="330" height="36" rx="4"/><text class="ts" x="28" y="87">COPY app/ (changes on every commit)</text>
      <path class="e-acc" d="M352,82 L380,82" marker-end="url(#a-acc)"/><text class="ts ta" x="386" y="86">a code change rebuilds only this</text>
      <path class="e" d="M352,166 C368,166 368,124 352,124"/><text class="ts" x="386" y="148">a dependency change rebuilds</text><text class="ts" x="386" y="164">from the install upward</text>
      <text class="ts tr" x="16" y="290">Copy the code before installing, and every commit reinstalls every dependency.</text>

      <text class="tl" x="600" y="24">FOUR WORDS</text>
      <text class="ts" x="600" y="50"><tspan class="tb">image</tspan>: the immutable build</text>
      <text class="ts" x="600" y="66">output, like a class</text>
      <text class="ts" x="600" y="96"><tspan class="tb">container</tspan>: a running process</text>
      <text class="ts" x="600" y="112">from it, like an object</text>
      <text class="ts" x="600" y="142"><tspan class="tb">tag</tspan>: a movable name, like</text>
      <text class="ts" x="600" y="158">a branch; a rebuild moves it</text>
      <text class="ts" x="600" y="188"><tspan class="tb">digest</tspan>: sha256 of the</text>
      <text class="ts" x="600" y="204">content; the real identity</text>
      <text class="ts tmu" x="600" y="236">logs, exec, stop: containers</text>
      <text class="ts tmu" x="600" y="252">run, push, tag: images</text>
    </svg>