<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" role="img" aria-label="Layer caching. A Dockerfile's instructions become layers stacked on the base image: the base, system packages, the dependency manifests, installing dependencies, then the code. A change to the code rebuilds only the last layer; a change to the manifests rebuilds from the install onward. Copying the code before installing dependencies would make every code change reinstall everything. On the right: image versus container versus tag versus digest."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
