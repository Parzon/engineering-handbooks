<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 270" role="img" aria-label="compose.yaml is what every environment shares: services, images or build contexts, the environment contract, health checks, dependencies, restart and log rotation; no ports and no mounts. compose.override.yaml is merged automatically into any plain docker compose command: dev targets, source bind mounts, ports on 127.0.0.1. compose.prod.yaml is named explicitly with -f: production targets, image names and tags, only the edge published, read-only filesystems, dropped capabilities, limits. Merge rules: environment merges key by key, the overlay winning; ports lists are concatenated; the !reset tag removes an inherited entry."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #2349a3; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #e7edf9; stroke: #2349a3; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #2349a3; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #2349a3; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #2349a3; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="270" fill="#ffffff"/>
      <rect class="n-acc" x="300" y="16" width="220" height="104" rx="6"/><text class="tb" x="312" y="40">compose.yaml</text><text class="ts" x="312" y="60">what every environment shares:</text><text class="ts" x="312" y="76">services, env contract, health,</text><text class="ts" x="312" y="92">restart, log rotation</text><text class="ts tr" x="312" y="110">no ports, no mounts</text>
      <rect class="n" x="16" y="150" width="250" height="96" rx="6"/><text class="tb" x="28" y="174">compose.override.yaml</text><text class="ts" x="28" y="194">development, merged automatically</text><text class="ts" x="28" y="210">dev targets, source bind mounts,</text><text class="ts" x="28" y="226">ports on 127.0.0.1</text>
      <rect class="n-good" x="554" y="150" width="250" height="96" rx="6"/><text class="tb" x="566" y="174">compose.prod.yaml</text><text class="ts" x="566" y="194">named explicitly with -f</text><text class="ts" x="566" y="210">release images, edge only published,</text><text class="ts" x="566" y="226">read-only, cap_drop, limits</text>
      <path class="e" d="M300,90 C220,90 141,110 141,148" marker-end="url(#a)"/>
      <path class="e-good" d="M520,90 C600,90 679,110 679,148" marker-end="url(#a-good)"/>
      <text class="tl" x="300" y="152">MERGE RULES</text>
      <text class="ts" x="300" y="174">environment: key by key, overlay wins</text>
      <text class="ts" x="300" y="194">ports: lists are concatenated</text>
      <text class="ts" x="300" y="214">!reset removes an inherited entry</text>
      <text class="ts" x="300" y="234">-f turns off the automatic override</text>
      <text class="ts tmu" x="300" y="258">make config prints the merged result</text>
    </svg>