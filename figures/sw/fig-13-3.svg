<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 230" role="img" aria-label="Decisions are pure functions; input and output stay at the edges. A route reads the request, the session and the database, then calls a pure function such as access_from_claims, build_messages or score, which takes plain values and returns plain values, then the route writes the response. The pure functions need no database, network or mocks to test, which is why 181 unit tests run in seconds. A class is for something with state and a lifecycle, such as the identity-provider client or the model client."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
