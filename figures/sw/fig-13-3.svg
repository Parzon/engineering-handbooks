    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="230" fill="#ffffff"/>
      <rect class="zone" x="16" y="16" width="788" height="140" rx="8"/><text class="tl" x="30" y="36">A ROUTE: I/O AT THE EDGES</text>
      <rect class="n" x="40" y="56" width="190" height="76" rx="5"/><text class="tb" x="52" y="80">read</text><text class="ts" x="52" y="100">request, session,</text><text class="ts" x="52" y="116">database rows</text>
      <rect class="n-acc" x="300" y="48" width="220" height="92" rx="6"/><text class="tb" x="312" y="72">decide: a pure function</text><text class="ts" x="312" y="92">plain values in, plain out</text><text class="tm" x="312" y="112">access_from_claims</text><text class="tm" x="312" y="128">build_messages · score</text>
      <rect class="n" x="590" y="56" width="190" height="76" rx="5"/><text class="tb" x="602" y="80">write</text><text class="ts" x="602" y="100">response, rows,</text><text class="ts" x="602" y="116">metrics</text>
      <line class="e" x1="231" y1="94" x2="298" y2="94" marker-end="url(#a)"/><line class="e" x1="521" y1="94" x2="588" y2="94" marker-end="url(#a)"/>
      <text class="ts" x="16" y="184"><tspan class="tb">Tested without a database, network or mocks:</tspan> that is why 181 unit tests run in seconds.</text>
      <text class="ts" x="16" y="208"><tspan class="tb">A class</tspan> only for state with a lifecycle: the identity-provider client (metadata, keys), the model client (a connection pool).</text>
    </svg>