<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" role="img" aria-label="Metrics are numbers aggregated over time, scraped every 15 seconds: is the system healthy? Logs are one JSON line per event: what happened in this request? Traces are a tree of timed spans per request: where did this request's time go? A request id, stamped by nginx, or by the api when nothing in front did, and carried in a context variable, appears on every log line, in the response header and error body, and on the trace, so a user's error message leads to all three."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #2349a3; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #e7edf9; stroke: #2349a3; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #2349a3; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #2349a3; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #2349a3; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="260" fill="#ffffff"/>
      <rect class="n" x="16" y="16" width="250" height="132" rx="6"/><text class="tb" x="28" y="40">Metrics</text><text class="ts" x="28" y="62">numbers aggregated over time,</text><text class="ts" x="28" y="78">scraped every 15 seconds</text><text class="ts ta" x="28" y="106">"Is the system healthy?"</text><text class="ts tmu" x="28" y="132">Prometheus, Grafana</text>
      <rect class="n" x="285" y="16" width="250" height="132" rx="6"/><text class="tb" x="297" y="40">Logs</text><text class="ts" x="297" y="62">one JSON object per line,</text><text class="ts" x="297" y="78">on standard output</text><text class="ts ta" x="297" y="106">"What happened in this one?"</text><text class="ts tmu" x="297" y="132">docker logs, jq, a log store</text>
      <rect class="n" x="554" y="16" width="250" height="132" rx="6"/><text class="tb" x="566" y="40">Traces</text><text class="ts" x="566" y="62">a tree of timed spans per</text><text class="ts" x="566" y="78">request, across processes</text><text class="ts ta" x="566" y="106">"Where did its time go?"</text><text class="ts tmu" x="566" y="132">OpenTelemetry, Jaeger</text>
      <rect class="n-acc" x="16" y="186" width="788" height="56" rx="6"/>
      <text class="tb" x="28" y="208">The request id</text><text class="ts" x="140" y="208">stamped by nginx, or by the api when nothing in front did; kept in a context variable, on every log line,</text>
      <text class="ts" x="140" y="228">in the response header and every error body, and on the request's span</text>
      <line class="e-acc" x1="141" y1="184" x2="141" y2="150" marker-end="url(#a-acc)"/>
      <line class="e-acc" x1="410" y1="184" x2="410" y2="150" marker-end="url(#a-acc)"/>
      <line class="e-acc" x1="679" y1="184" x2="679" y2="150" marker-end="url(#a-acc)"/>
    </svg>