<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" role="img" aria-label="The reference observability stack. The api's workers, exporters for Postgres, PgBouncer and Valkey, node-exporter for the host, cAdvisor for containers, and the mock model are scraped by Prometheus every 15 seconds. Prometheus evaluates rules and sends firing alerts to Alertmanager, which delivers them by webhook to the app itself; Grafana draws the dashboard. The api sends traces over OTLP to Jaeger. All listen on loopback; on a server, reach them through an SSH tunnel."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #2349a3; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #e7edf9; stroke: #2349a3; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #2349a3; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #2349a3; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #2349a3; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="250" fill="#ffffff"/>
      <rect class="n" x="16" y="16" width="200" height="214" rx="6"/>
      <text class="tl" x="28" y="36">SCRAPED</text>
      <text class="ts" x="28" y="60">api workers (/metrics)</text><text class="ts" x="28" y="82">postgres-exporter</text><text class="ts" x="28" y="104">pgbouncer-exporter</text><text class="ts" x="28" y="126">redis-exporter</text><text class="ts" x="28" y="148">node-exporter (host)</text><text class="ts" x="28" y="170">cAdvisor (containers)</text><text class="ts" x="28" y="192">the mock model</text>
      <rect class="n-acc" x="270" y="84" width="150" height="70" rx="6"/><text class="tb" x="345" y="112" text-anchor="middle">Prometheus</text><text class="ts" x="345" y="132" text-anchor="middle">rules, every 15 s</text>
      <line class="e-acc" x1="217" y1="119" x2="268" y2="119" marker-end="url(#a-acc)"/>
      <rect class="n" x="474" y="20" width="150" height="56" rx="5"/><text class="tb" x="549" y="44" text-anchor="middle">Grafana</text><text class="ts" x="549" y="62" text-anchor="middle">dashboard as code</text>
      <rect class="n" x="474" y="150" width="150" height="56" rx="5"/><text class="tb" x="549" y="174" text-anchor="middle">Alertmanager</text><text class="ts" x="549" y="192" text-anchor="middle">groups, routes</text>
      <rect class="n-good" x="666" y="150" width="138" height="56" rx="5"/><text class="tb" x="735" y="174" text-anchor="middle">the app</text><text class="ts" x="735" y="192" text-anchor="middle">a webhook</text>
      <path class="e" d="M421,105 C450,105 450,48 472,48" marker-end="url(#a)"/>
      <path class="e" d="M421,133 C450,133 450,178 472,178" marker-end="url(#a)"/>
      <line class="e-good" x1="625" y1="178" x2="664" y2="178" marker-end="url(#a-good)"/>
      <rect class="n" x="666" y="20" width="138" height="56" rx="5"/><text class="tb" x="735" y="44" text-anchor="middle">Jaeger</text><text class="ts" x="735" y="62" text-anchor="middle">api pushes traces</text>
      <text class="ts tmu" x="270" y="232">all on loopback; reached through an SSH tunnel on a server</text>
    </svg>