<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" role="img" aria-label="Three failure policies for a rate limiter whose store is unreachable. Fail open: allow the request; availability wins and the limit is gone for the outage; right when the limit is a courtesy and the store a soft dependency. Fail closed: reject with 503; protection wins and a store outage becomes a full outage; right when the limit is the security control. Per endpoint: closed on expensive or abusable endpoints such as a model call, open on cheap reads. The reference service fails open with a 200-millisecond budget, except the chat in production, which fails closed. Whatever the choice: bound the wait, count the decisions, alert on them, write it down."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #2349a3; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #e7edf9; stroke: #2349a3; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #2349a3; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #2349a3; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #2349a3; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="250" fill="#ffffff"/>
      <rect class="n-good" x="16" y="16" width="250" height="150" rx="6"/><text class="tb" x="28" y="40">Fail open</text><text class="ts" x="28" y="62">allow the request</text><text class="ts" x="28" y="86">availability wins; no limit</text><text class="ts" x="28" y="102">for the outage</text><text class="ts" x="28" y="128">when the limit is a courtesy</text><text class="ts" x="28" y="144">and the store is optional</text>
      <rect class="n-bad" x="285" y="16" width="250" height="150" rx="6"/><text class="tb" x="297" y="40">Fail closed</text><text class="ts" x="297" y="62">reject with a 503</text><text class="ts" x="297" y="86">protection wins; a store</text><text class="ts" x="297" y="102">outage is a full outage</text><text class="ts" x="297" y="128">when the limit is the control:</text><text class="ts" x="297" y="144">sign-in attempts, abuse</text>
      <rect class="n-acc" x="554" y="16" width="250" height="150" rx="6"/><text class="tb" x="566" y="40">Per endpoint</text><text class="ts" x="566" y="62">closed where it is expensive,</text><text class="ts" x="566" y="78">open on cheap reads</text><text class="ts" x="566" y="104">the reference service: open,</text><text class="ts" x="566" y="120">200 ms budget; the chat fails</text><text class="ts" x="566" y="136">closed in production, because</text><text class="ts" x="566" y="152">each request is a paid model call</text>
      <text class="tb" x="16" y="200">Whichever you choose:</text><text class="ts" x="170" y="200">bound the wait, count each fail-open or fail-closed decision,</text>
      <text class="ts" x="170" y="220">alert on them, and write the choice down as a decision record.</text>
    </svg>