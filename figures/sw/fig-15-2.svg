<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" role="img" aria-label="The leak, before and after. Before: a query's client-side timeout fires; the driver asks the server to cancel it; every later operation on that connection, including the rollback that returns it to the pool, waits for the server's acknowledgement with no timeout. With Postgres frozen, the acknowledgement never comes: the connection is held forever. Freezing Postgres for 20 seconds under load left 13 of 40 pooled connections stuck after it recovered. After: time is capped on the server side only, by the role's statement timeout and the pooler's query timeout; the pooler fails fast; a connection closed mid-query maps to 503; the readiness probe abandons a slow check instead of cancelling it. The same drill now leaves zero connections held."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #2349a3; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #e7edf9; stroke: #2349a3; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #2349a3; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #2349a3; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #2349a3; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="300" fill="#ffffff"/>
      <text class="tl tr" x="16" y="22">BEFORE: A CLIENT-SIDE TIMEOUT</text>
      <rect class="n" x="16" y="34" width="170" height="54" rx="5"/><text class="ts" x="28" y="56">query times out</text><text class="ts" x="28" y="74">on the client</text>
      <rect class="n" x="216" y="34" width="170" height="54" rx="5"/><text class="ts" x="228" y="56">driver asks the server</text><text class="ts" x="228" y="74">to cancel</text>
      <rect class="n" x="416" y="34" width="170" height="54" rx="5"/><text class="ts" x="428" y="56">rollback waits for the</text><text class="ts" x="428" y="74">acknowledgement</text>
      <rect class="n-bad" x="616" y="34" width="188" height="54" rx="5"/><text class="ts" x="628" y="56">server frozen: it never</text><text class="ts" x="628" y="74">comes; held forever</text>
      <line class="e" x1="187" y1="61" x2="214" y2="61" marker-end="url(#a)"/><line class="e" x1="387" y1="61" x2="414" y2="61" marker-end="url(#a)"/><line class="e-bad" x1="587" y1="61" x2="614" y2="61" marker-end="url(#a-bad)"/>
      <text class="ts tr" x="16" y="114">Postgres frozen 20 s under load: 13 of 40 pool connections stuck after it recovered.</text>

      <text class="tl tg" x="16" y="156">AFTER: CAPPED WHERE THE WORK HAPPENS</text>
      <rect class="n-good" x="16" y="168" width="788" height="86" rx="6"/>
      <text class="ts" x="28" y="190">query time capped only on the server: the role's 10 s statement timeout, the pooler's 15 s backstop</text>
      <text class="ts" x="28" y="210">the pooler fails fast: 5 s queue, 5 s connect, 2 s login retry, 1 s for a cached "no such host"</text>
      <text class="ts" x="28" y="230">a connection closed mid-query maps to a 503; the readiness probe abandons a slow check</text>
      <text class="ts" x="28" y="246">rather than cancelling it</text>
      <text class="ts tg" x="16" y="282">The same drill: 67,121 reads served, 28 clean 503s, 0 connections held afterwards.</text>
    </svg>