<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 290" role="img" aria-label="A closed model: N virtual users, each waiting for its response before sending the next. When the server stalls, they stop sending, so the requests that would have arrived during the stall are never sent and their latency never recorded: coordinated omission. An open model starts requests at a fixed rate whatever happens, like independent users, and the queue shows as latency. Measured at a fixed 20 iterations per second: k6 had to grow from 16 to 157 concurrent users to keep the rate, and exposed a 7-second p95 that a closed test with 16 users would have hidden."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #2349a3; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #e7edf9; stroke: #2349a3; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #2349a3; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #2349a3; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #2349a3; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="290" fill="#ffffff"/>
      <rect class="n" x="16" y="16" width="384" height="190" rx="6"/><text class="tb" x="30" y="40">Closed: N users, each waits</text>
      <text class="ts" x="30" y="62">the server stalls → users stop sending</text>
      <line class="rule-strong" x1="30" y1="100" x2="386" y2="100"/>
      <g class="fill-acc"><rect x="40" y="88" width="6" height="12"/><rect x="70" y="88" width="6" height="12"/><rect x="100" y="88" width="6" height="12"/><rect x="250" y="88" width="6" height="12"/><rect x="290" y="88" width="6" height="12"/><rect x="330" y="88" width="6" height="12"/></g>
      <rect class="n-bad" x="130" y="80" width="110" height="26" rx="3"/><text class="ts" x="185" y="97" text-anchor="middle">stall: none sent</text>
      <text class="ts" x="30" y="132">the slow period's requests are never sent,</text><text class="ts" x="30" y="148">so their latency is never recorded</text>
      <text class="ts" x="30" y="178"><tspan class="tb tr">coordinated omission</tspan>: the percentiles look fine</text>
      <rect class="n-acc" x="420" y="16" width="384" height="190" rx="6"/><text class="tb" x="434" y="40">Open: a fixed arrival rate</text>
      <text class="ts" x="434" y="62">requests keep arriving, like real users</text>
      <line class="rule-strong" x1="434" y1="100" x2="790" y2="100"/>
      <g class="fill-acc"><rect x="444" y="88" width="6" height="12"/><rect x="474" y="88" width="6" height="12"/><rect x="504" y="88" width="6" height="12"/><rect x="534" y="88" width="6" height="12"/><rect x="564" y="88" width="6" height="12"/><rect x="594" y="88" width="6" height="12"/><rect x="624" y="88" width="6" height="12"/><rect x="654" y="88" width="6" height="12"/><rect x="684" y="88" width="6" height="12"/><rect x="714" y="88" width="6" height="12"/><rect x="744" y="88" width="6" height="12"/></g>
      <text class="ts" x="434" y="132">a stall builds a queue, and the queue</text><text class="ts" x="434" y="148">shows as latency, honestly</text>
      <text class="tb tg" x="434" y="178">right for "can we serve X per second?"</text>
      <text class="ts" x="16" y="236"><tspan class="tb">Measured:</tspan> at a fixed 20 iterations per second, k6 had to grow from 16 to 157 concurrent users to hold the rate,</text>
      <text class="ts" x="16" y="254">and exposed a 7-second p95 (a missing index, Chapter 6). A closed test with 16 users would have offered less load and</text>
      <text class="ts" x="16" y="272">reported something far milder. A closed model is still right for concurrency questions: "how many streams can one worker hold?"</text>
    </svg>