.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="320" fill="#ffffff"/>
      <rect class="n-soft" x="16" y="16" width="788" height="36" rx="4"/><text class="tb" x="28" y="39">1</text><text class="ts" x="52" y="39">A missing index: the first bottleneck arrives before any real load does (Chapter 6)</text>
      <rect class="n-soft" x="16" y="58" width="788" height="36" rx="4"/><text class="tb" x="28" y="81">2</text><text class="ts" x="52" y="81">Connection churn: a slow state that sustains itself; a fixed-size pool ended it (Chapter 7)</text>
      <rect class="n-soft" x="16" y="100" width="788" height="36" rx="4"/><text class="tb" x="28" y="123">3</text><text class="ts" x="52" y="123">api CPU on reads: about 530 signed-in reads per second per core</text>
      <rect class="n-soft" x="16" y="142" width="788" height="36" rx="4"/><text class="tb" x="28" y="165">4</text><text class="ts" x="52" y="165">api CPU on streaming: the SDK's 126 µs per chunk; 500 streams saturate two CPUs</text>
      <rect class="n-warn" x="16" y="184" width="788" height="36" rx="4"/><text class="tb" x="28" y="207">5</text><text class="ts" x="52" y="207">Event-loop saturation becomes errors elsewhere: timeouts expire while replies wait in the queue, from 46% CPU</text>
      <rect class="n-soft" x="16" y="226" width="788" height="36" rx="4"/><text class="tb" x="28" y="249">6</text><text class="ts" x="52" y="249">Connection budgets: 2 workers × 20 = 40 pooler clients per replica; the pooler's 500 allows about 12 replicas</text>
      <rect class="n-soft" x="16" y="268" width="788" height="36" rx="4"/><text class="tb" x="28" y="291">7</text><text class="ts" x="52" y="291">The model provider's quota: with a real provider, this binds first; plan capacity from it</text>
    </svg>