<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" role="img" aria-label="Bottlenecks in order. One: a missing index, before any real load arrives. Two: connection churn, a metastable slow state ended by a fixed pool. Three: api CPU on reads, about 530 signed-in reads per second per core. Four: api CPU on streaming, the SDK's 126 microseconds per chunk; 500 streams saturate 2 CPUs. Five: event-loop saturation turning into errors elsewhere, because wall-clock timeouts expire while replies wait in the loop's queue; timeouts appeared at 46 percent CPU. Six: connection budgets between workers, the pooler and Postgres. Seven: the model provider's quota."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
