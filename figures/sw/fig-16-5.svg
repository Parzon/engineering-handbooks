<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 190" role="img" aria-label="Where the CPU went at 300 concurrent streams, sampled by py-spy: the model provider's SDK 40.1 percent, the HTTP client 21.9 percent, the asyncio loop 18.2, pydantic 5.0, the web framework 4.5, the service's own code 2.5, SQLAlchemy 2.2, SSE encoding and logging 2.5. The SDK's client side costs 126 microseconds per chunk against 55 for the raw HTTP client plus JSON parsing; the SDK was kept."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #2349a3; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
