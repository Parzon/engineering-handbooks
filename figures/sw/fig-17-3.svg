<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 230" role="img" aria-label="The incident loop. Detect, from an alert or a person. Declare a severity by user impact: SEV1 nobody can use it, SEV2 a core flow broken for some, SEV3 degraded with a workaround. One incident lead decides and communicates; others fix. Write the timeline as you go, using request ids, dashboards and the audit trail. Mitigate first, then fix. A blameless review within a week for SEV1 and SEV2. Action items as issues with owners: a new drill, an alert, or a runbook line, which feed back into detection."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #2349a3; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #e7edf9; stroke: #2349a3; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #2349a3; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #2349a3; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #2349a3; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="230" fill="#ffffff"/>
      <rect class="n" x="16" y="30" width="130" height="64" rx="6"/><text class="tb" x="28" y="54">Detect</text><text class="ts" x="28" y="74">an alert, or a</text><text class="ts" x="28" y="88">person noticed</text>
      <rect class="n" x="176" y="30" width="150" height="64" rx="6"/><text class="tb" x="188" y="54">Declare</text><text class="ts" x="188" y="74">severity by impact;</text><text class="ts" x="188" y="88">one incident lead</text>
      <rect class="n-acc" x="356" y="30" width="150" height="64" rx="6"/><text class="tb" x="368" y="54">Mitigate</text><text class="ts" x="368" y="74">roll back, switch off,</text><text class="ts" x="368" y="88">fail over; fix later</text>
      <rect class="n" x="536" y="30" width="130" height="64" rx="6"/><text class="tb" x="548" y="54">Review</text><text class="ts" x="548" y="74">blameless, within</text><text class="ts" x="548" y="88">a week</text>
      <rect class="n-good" x="696" y="30" width="108" height="64" rx="6"/><text class="tb" x="708" y="54">Change</text><text class="ts" x="708" y="74">drill, alert,</text><text class="ts" x="708" y="88">runbook line</text>
      <line class="e" x1="147" y1="62" x2="174" y2="62" marker-end="url(#a)"/><line class="e" x1="327" y1="62" x2="354" y2="62" marker-end="url(#a)"/><line class="e" x1="507" y1="62" x2="534" y2="62" marker-end="url(#a)"/><line class="e" x1="667" y1="62" x2="694" y2="62" marker-end="url(#a)"/>
      <path class="e-good" d="M750,95 C750,130 81,130 81,97" marker-end="url(#a-good)"/><text class="ts tg" x="416" y="146" text-anchor="middle">each review makes the next detection faster</text>
      <text class="ts" x="16" y="182"><tspan class="tb">SEV1</tspan> nobody can use it · <tspan class="tb">SEV2</tspan> a core flow is broken for some · <tspan class="tb">SEV3</tspan> degraded, with a workaround</text>
      <text class="ts" x="16" y="206">The timeline is written as you go: request ids, dashboards and, for a harmful answer, the audit trail make it reconstructible.</text>
    </svg>