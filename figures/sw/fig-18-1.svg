<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" role="img" aria-label="The reference stack by layer, each piece marked day one, add when, or rarely. AI: an OpenAI-compatible seam, the eval harness, the mock model, day one; pgvector and full-text search, Ollama, an MCP server, agent mode, when triggered. API: Python with uv, FastAPI, SQLAlchemy, Uvicorn under gunicorn, prometheus-client, day one. Data: Postgres and row-level security day one; PgBouncer and Valkey when triggered; a separate vector database rarely. Web: React, Vite, TanStack Query, fetch streaming, nginx, day one. Sign-in and edge: OIDC with PKCE day one, Keycloak locally only; Caddy when a VM serves HTTPS. Delivery: Docker, Compose, GitHub Actions, Make, a registry, Dependabot day one; cloud-init and ufw when running a VM; Kubernetes rarely. Supply chain: Trivy and gitleaks day one. Quality: pytest, ruff, mypy, Vitest day one; Playwright and k6 when triggered. Monitoring: Prometheus, Grafana, Alertmanager when someone is on call; Jaeger when traces need reading."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
