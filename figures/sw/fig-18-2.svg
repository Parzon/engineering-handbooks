      <path class="e" d="M267,120 L300,120" marker-end="url(#a)"/>
      <rect class="n-warn" x="302" y="34" width="250" height="172" rx="6"/><text class="tb" x="314" y="56">Then price it</text>
      <text class="ts" x="314" y="80">an image to patch and scan</text><text class="ts" x="314" y="98">settings and secrets</text><text class="ts" x="314" y="116">a failure mode to decide and drill</text><text class="ts" x="314" y="134">a backup, if it holds state</text><text class="ts" x="314" y="152">an upgrade path</text><text class="ts" x="314" y="170">an exporter, alerts, a runbook</text><text class="ts" x="314" y="188">a decision record, reading time</text>
      <rect class="n-soft" x="580" y="34" width="224" height="172" rx="6"/><text class="tb" x="592" y="56">Take it away when</text>
      <text class="ts" x="592" y="80">nobody can say how it fails</text><text class="ts" x="592" y="104">a managed service does the job</text><text class="ts" x="592" y="128">two things do one job</text><text class="ts" x="592" y="152">it was added "in case", and</text><text class="ts" x="592" y="168">nothing has needed it since</text>
      <text class="ts" x="16" y="238"><tspan class="tb">The price of one small piece:</tspan> Valkey, for rate-limit counters alone, cost a fail-open decision, a fail-closed</text>
      <text class="ts" x="16" y="256">exception for the chat, three alerts, two drills, an exporter and two sizing fixes under load.</text>
