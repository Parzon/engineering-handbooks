  </defs><rect width="820" height="280" fill="#ffffff"/>
      <text class="tl" x="16" y="22">ADD FOR A TRIGGER YOU CAN NAME</text>
      <rect class="n" x="16" y="34" width="250" height="52" rx="5"/><text class="tb" x="28" y="56">a measurement</text><text class="ts" x="28" y="74">a number, and the command behind it</text>
      <rect class="n" x="16" y="94" width="250" height="52" rx="5"/><text class="tb" x="28" y="116">a requirement</text><text class="ts" x="28" y="134">written: sign-in, an SLO, compliance</text>
