<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 280" role="img" aria-label="Adding a piece. Three triggers you can name: a measurement with the command that produced it; a written requirement; a failure users would see, shown by a drill. Then price it: an image to patch and scan; settings and secrets; a failure mode to decide and drill; a backup if it holds state; an upgrade path; monitoring with an exporter, alerts and a runbook section; a decision record and reading time. Valkey, used only for rate-limit counters, cost a fail-open decision, a fail-closed exception, three alerts, two drills, an exporter and two sizing fixes. Take a piece away when nobody can say what happens when it fails, a managed service does the same job, two things do one job, or it was added in case and nothing has needed it since."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
