<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" role="img" aria-label="Three sizes. Week one: api and web in Compose; Postgres; no shared state; localhost; Keycloak locally; the mock and one provider; JSON logs and /metrics; CI with tests and scans. One VM, as the reference repository runs: gunicorn workers with rolling deploys; Postgres with PgBouncer and off-host backups; Valkey; Caddy then nginx; the organization's identity provider; the mock, Ollama or a provider; Prometheus, Grafana, Alertmanager and Jaeger; releases to a registry and a deploy script. On AWS: ECS on Fargate behind an ALB; RDS or Aurora, Multi-AZ, with RDS Proxy; ElastiCache for Valkey; an ALB with ACM and CloudFront; the organization's provider; Bedrock or a provider behind the same seam; managed Prometheus and Grafana or CloudWatch with an OpenTelemetry collector; ECR and infrastructure as code."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
