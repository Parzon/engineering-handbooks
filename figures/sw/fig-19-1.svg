    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="300" fill="#ffffff"/>
      <g>
      <rect class="n" x="16" y="16" width="250" height="44" rx="5"/><text class="tb" x="28" y="36">1</text><text class="ts" x="48" y="36">repository, .gitignore, a README</text><text class="ts" x="48" y="52">saying what and why</text>
      <rect class="n" x="16" y="68" width="250" height="44" rx="5"/><text class="tb" x="28" y="88">2</text><text class="ts" x="48" y="88">a monorepo, for a small team</text><text class="ts" x="48" y="104">one PR spans api, UI and infra</text>
      <rect class="n" x="16" y="120" width="250" height="44" rx="5"/><text class="tb" x="28" y="140">3</text><text class="ts" x="48" y="140">lint, format, and CI running on</text><text class="ts" x="48" y="156">an empty project</text>
      <rect class="n" x="285" y="16" width="250" height="44" rx="5"/><text class="tb" x="297" y="36">4</text><text class="ts" x="317" y="36">.env.example and a secrets</text><text class="ts" x="317" y="52">strategy, decided first</text>
      <rect class="n" x="285" y="68" width="250" height="44" rx="5"/><text class="tb" x="297" y="88">5</text><text class="ts" x="317" y="88">branch protection before the</text><text class="ts" x="317" y="104">first pull request</text>
      <rect class="n" x="285" y="120" width="250" height="44" rx="5"/><text class="tb" x="297" y="140">6</text><text class="ts" x="317" y="140">boring, reversible defaults;</text><text class="ts" x="317" y="156">no novelty budget spent here</text>
      <rect class="n-acc" x="554" y="16" width="250" height="44" rx="5"/><text class="tb" x="566" y="36">7</text><text class="ts" x="586" y="36">a health endpoint, built by CI</text><text class="ts" x="586" y="52">and deployed by CD: the skeleton</text>
      <rect class="n" x="554" y="68" width="250" height="44" rx="5"/><text class="tb" x="566" y="88">8</text><text class="ts" x="586" y="88">structured logs and an uptime</text><text class="ts" x="586" y="104">check, from day one</text>
      <rect class="n" x="554" y="120" width="250" height="44" rx="5"/><text class="tb" x="566" y="140">9</text><text class="ts" x="586" y="140">a decision record for each</text><text class="ts" x="586" y="156">irreversible call</text>
      </g>
      <text class="tl" x="16" y="196">RULES THAT GENERALIZE</text>
      <text class="ts" x="16" y="220">The pipeline exists before feature one. Secrets never reach Git from the first commit: retrofitting means rewriting history.</text>
      <text class="ts" x="16" y="242">A new engineer runs the stack within an hour of cloning. Prefer decisions that are cheap to reverse.</text>
      <text class="ts" x="16" y="264">Request slow approvals in week one: cloud access, security review, data-processing terms, named pilot users.</text>
    </svg>