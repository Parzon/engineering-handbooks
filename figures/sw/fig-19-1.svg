<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" role="img" aria-label="Order of operations before feature code. One: a repository, .gitignore and a README saying what and why. Two: monorepo by default for a small team. Three: lint, format and a CI skeleton that runs on an empty repository. Four: .env.example and a secrets strategy, decided before implemented. Five: branch protection before the first pull request. Six: boring, reversible stack defaults. Seven: the first deliverable, a health endpoint built by CI and deployed by CD. Eight: structured logs and an uptime check from day one. Nine: a decision record for each irreversible call."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
