<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" role="img" aria-label="The order for replacing the domain. A requirements document: what, for whom, how success is measured. The data model: every table holding team data gets a team id, row-level security policies and database tests in the same migration. Routes and queries: every data route takes the signed-in principal, reads go through a visibility query, writes check the role, invisible data is a 404. Eval cases, before the prompt, including isolation cases. The prompt and its context, measured against a real model, with retrieval measured first. The mock's canned answer. The UI, then browser tests. Load tests and drills rerun. Docs: README, runbook sections, decision records."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
