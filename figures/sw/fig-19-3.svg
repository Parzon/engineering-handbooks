      <rect class="n-soft" x="16" y="196" width="788" height="48" rx="5"/><text class="tb" x="28" y="218">9 Docs</text><text class="ts" x="90" y="218">README and overview; a runbook section per new alert; a decision record for each choice a newcomer would question</text>
