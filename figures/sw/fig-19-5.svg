<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 270" role="img" aria-label="The first hour of a service an agent will write, in six steps. One: the contract file, under forty lines: commands, the non-obvious, the prohibitions. Two: hooks: deny edits to configuration, pipeline and lockfiles; format and lint after each edit; the check command before the agent may stop. Three: owners on every guardrail file and the required checks on main. Four: a problem-statement template: outcome, constraints, acceptance check, risk tier. Five: one worktree per agent session, a plan file per feature. Six: the first feature is the health endpoint through the pipeline, as before."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #2349a3; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
