.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="270" fill="#ffffff"/>
      <rect class="n-acc" x="16" y="30" width="250" height="90" rx="6"/><text class="tb" x="28" y="52">1 · The contract, under 40 lines</text><text class="ts" x="28" y="74">the commands; the non-obvious conventions;</text><text class="ts" x="28" y="90">"never edit lint config, CI or hooks to pass";</text><text class="ts" x="28" y="106">pointers to the longer documents</text>
      <rect class="n-good" x="285" y="30" width="250" height="90" rx="6"/><text class="tb" x="297" y="52">2 · Hooks</text><text class="ts" x="297" y="74">deny edits to config, pipeline, lockfiles;</text><text class="ts" x="297" y="90">format and lint after each edit;</text><text class="ts" x="297" y="106">the check command before it may stop</text>
      <rect class="n-good" x="554" y="30" width="250" height="90" rx="6"/><text class="tb" x="566" y="52">3 · Owners and required checks</text><text class="ts" x="566" y="74">owners on every guardrail file;</text><text class="ts" x="566" y="90">required status checks on main;</text><text class="ts" x="566" y="106">one human approval</text>
      <rect class="n" x="16" y="140" width="250" height="90" rx="6"/><text class="tb" x="28" y="162">4 · A problem-statement template</text><text class="ts" x="28" y="184">outcome with constraints; the acceptance</text><text class="ts" x="28" y="200">check that proves it done; the risk tier</text><text class="ts" x="28" y="216">that sets how strict the human review is</text>
      <rect class="n" x="285" y="140" width="250" height="90" rx="6"/><text class="tb" x="297" y="162">5 · Working shape</text><text class="ts" x="297" y="184">one worktree and branch per agent session;</text><text class="ts" x="297" y="200">a plan file per feature, edited by a person;</text><text class="ts" x="297" y="216">plugins measured before they are adopted</text>
      <rect class="n-soft" x="554" y="140" width="250" height="90" rx="6"/><text class="tb" x="566" y="162">6 · Then the first feature</text><text class="ts" x="566" y="184">the health endpoint, through the pipeline,</text><text class="ts" x="566" y="200">as the chapter began; the agent's first</text><text class="ts" x="566" y="216">task is also the first test of the gates</text>
      <text class="ts" x="16" y="256">Steps 1 to 3 are a template: copy them from the reference build, then change only what the new domain needs.</text>
    </svg>