      <text class="ts" x="565" y="192" text-anchor="middle">one worker per CPU</text>
      <text class="ts" x="565" y="208" text-anchor="middle">session → user → teams</text>

      <rect class="n" x="676" y="50" width="116" height="56" rx="5"/><text class="tb" x="734" y="74" text-anchor="middle">Identity</text><text class="ts" x="734" y="92" text-anchor="middle">provider (OIDC)</text>
      <rect class="n" x="676" y="134" width="116" height="56" rx="5"/><text class="tb" x="734" y="158" text-anchor="middle">The model</text><text class="ts" x="734" y="176" text-anchor="middle">OpenAI-compatible</text>
      <rect class="n" x="490" y="268" width="150" height="56" rx="5"/><text class="tb" x="565" y="292" text-anchor="middle">PgBouncer</text><text class="ts" x="565" y="310" text-anchor="middle">transaction pooling</text>
      <rect class="n" x="676" y="268" width="116" height="80" rx="5"/><text class="tb" x="734" y="292" text-anchor="middle">Postgres</text><text class="ts" x="734" y="310" text-anchor="middle">+ pgvector; data,</text><text class="ts" x="734" y="326" text-anchor="middle">sessions, audit</text>
      <rect class="n" x="320" y="268" width="140" height="56" rx="5"/><text class="tb" x="390" y="292" text-anchor="middle">Valkey</text><text class="ts" x="390" y="310" text-anchor="middle">shared counters</text>
      <rect class="n-soft" x="160" y="268" width="130" height="56" rx="5"/><text class="tb" x="225" y="292" text-anchor="middle">Monitoring</text><text class="ts" x="225" y="310" text-anchor="middle">optional</text>

