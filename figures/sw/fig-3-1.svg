<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" role="img" aria-label="Exit codes: 0 success; 1 a generic failure; 2 misuse of a shell builtin; 126 found but not executable; 127 command not found. 128 plus N means killed by signal N: 129 SIGHUP when the terminal closed; 130 SIGINT, Control-C; 137 SIGKILL, kill -9 or most often the out-of-memory killer, with no chance to log; 143 SIGTERM, a graceful stop request."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #2349a3; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #e7edf9; stroke: #2349a3; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #2349a3; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #2349a3; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #2349a3; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="250" fill="#ffffff"/>
      <text class="tl" x="16" y="18">CHOSEN BY THE PROGRAM</text>
      <rect class="n-good" x="16" y="28" width="90" height="56" rx="5"/><text class="tb" x="61" y="52" text-anchor="middle">0</text><text class="ts" x="61" y="72" text-anchor="middle">success</text>
      <rect class="n" x="116" y="28" width="150" height="56" rx="5"/><text class="tb" x="191" y="52" text-anchor="middle">1</text><text class="ts" x="191" y="72" text-anchor="middle">generic failure</text>
      <rect class="n" x="276" y="28" width="150" height="56" rx="5"/><text class="tb" x="351" y="52" text-anchor="middle">2</text><text class="ts" x="351" y="72" text-anchor="middle">shell builtin misuse</text>
      <rect class="n" x="436" y="28" width="180" height="56" rx="5"/><text class="tb" x="526" y="52" text-anchor="middle">126</text><text class="ts" x="526" y="72" text-anchor="middle">found, not executable</text>
      <rect class="n" x="626" y="28" width="178" height="56" rx="5"/><text class="tb" x="715" y="52" text-anchor="middle">127</text><text class="ts" x="715" y="72" text-anchor="middle">command not found</text>

      <text class="tl" x="16" y="118">128 + N: KILLED BY SIGNAL N</text>
      <rect class="n" x="16" y="128" width="180" height="80" rx="5"/><text class="tb" x="30" y="152">129  SIGHUP</text><text class="ts" x="30" y="172">the terminal closed: an</text><text class="ts" x="30" y="188">attached container dies</text>
      <rect class="n" x="206" y="128" width="180" height="80" rx="5"/><text class="tb" x="220" y="152">130  SIGINT</text><text class="ts" x="220" y="172">Control-C</text>
      <rect class="n-bad" x="396" y="128" width="210" height="80" rx="5"/><text class="tb tr" x="410" y="152">137  SIGKILL</text><text class="ts" x="410" y="172">kill -9, or far more often the</text><text class="ts" x="410" y="188">OOM killer: no log line at all</text>
      <rect class="n-acc" x="616" y="128" width="188" height="80" rx="5"/><text class="tb" x="630" y="152">143  SIGTERM</text><text class="ts" x="630" y="172">a polite stop request:</text><text class="ts" x="630" y="188">finish, then exit</text>
      <text class="ts" x="16" y="236">A container that dies with 137 and an empty log almost always ran out of memory. Check the kernel's log and the OOM counters.</text>
    </svg>