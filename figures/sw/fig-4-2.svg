<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" role="img" aria-label="The first request to a site. DNS: the client asks its resolver, which asks a root server, the top-level-domain server, and the domain's authoritative server, then caches the answer for its TTL. TCP: SYN, SYN-ACK, ACK. TLS 1.3: ClientHello with a key share and the hostname in plain text (SNI); ServerHello with the server's key share; both derive the same keys with ephemeral Diffie-Hellman; then, already encrypted, the certificate for that name, the server's signature over the handshake and its Finished message; the client checks the chain, the name and the expiry, and sends its own encrypted Finished. HTTP: the encrypted request and response."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #2349a3; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #e7edf9; stroke: #2349a3; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #2349a3; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #2349a3; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #2349a3; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="400" fill="#ffffff"/>
      <rect class="n" x="20" y="14" width="120" height="40" rx="5"/><text class="tb" x="80" y="39" text-anchor="middle">Client</text>
      <rect class="n" x="250" y="14" width="140" height="40" rx="5"/><text class="tb" x="320" y="39" text-anchor="middle">DNS resolver</text>
      <rect class="n" x="560" y="14" width="140" height="40" rx="5"/><text class="tb" x="630" y="39" text-anchor="middle">Server</text>
      <line class="rule dash" x1="80" y1="54" x2="80" y2="390"/>
      <line class="rule dash" x1="320" y1="54" x2="320" y2="120"/>
      <line class="rule dash" x1="630" y1="54" x2="630" y2="390"/>

      <text class="tl" x="700" y="84">DNS</text>
      <line class="e" x1="80" y1="76" x2="318" y2="76" marker-end="url(#a)"/><text class="ts" x="200" y="70" text-anchor="middle">where is example.com?</text>
      <path class="e dash" d="M320,82 h60 v20 h-58" marker-end="url(#a)"/><text class="ts" x="388" y="96">root, top-level domain, authoritative</text>
      <line class="e dash" x1="320" y1="116" x2="82" y2="116" marker-end="url(#a)"/><text class="ts" x="200" y="110" text-anchor="middle">an address, cached for its TTL</text>

      <text class="tl" x="700" y="150">TCP</text>
      <line class="e" x1="80" y1="142" x2="628" y2="142" marker-end="url(#a)"/><text class="ts" x="355" y="136" text-anchor="middle">SYN</text>
      <line class="e" x1="630" y1="160" x2="82" y2="160" marker-end="url(#a)"/><text class="ts" x="355" y="154" text-anchor="middle">SYN-ACK</text>
      <line class="e" x1="80" y1="178" x2="628" y2="178" marker-end="url(#a)"/><text class="ts" x="355" y="172" text-anchor="middle">ACK</text>

      <text class="tl" x="700" y="266">TLS</text>
      <line class="e" x1="80" y1="210" x2="628" y2="210" marker-end="url(#a)"/><text class="ts" x="355" y="204" text-anchor="middle">ClientHello: ciphers, a key share, and the hostname in plain text (SNI)</text>
      <line class="e" x1="630" y1="234" x2="82" y2="234" marker-end="url(#a)"/><text class="ts" x="355" y="228" text-anchor="middle">ServerHello: the server's key share, also in plain text</text>
      <text class="ts" x="355" y="252" text-anchor="middle">both now derive the same keys (ephemeral Diffie-Hellman); no key is ever sent</text>
      <line class="e-acc" x1="630" y1="278" x2="82" y2="278" marker-end="url(#a-acc)"/><text class="ts" x="355" y="272" text-anchor="middle">encrypted: certificate for that name, signature over the handshake, Finished</text>
      <rect class="n-soft" x="92" y="286" width="268" height="26" rx="4"/><text class="ts" x="102" y="303">client checks: chain to a trusted root, name, expiry</text>
      <line class="e-acc" x1="80" y1="326" x2="628" y2="326" marker-end="url(#a-acc)"/><text class="ts" x="480" y="320" text-anchor="middle">client Finished, encrypted</text>

      <text class="tl" x="700" y="362">HTTP</text>
      <line class="e-good" x1="80" y1="346" x2="628" y2="346" marker-end="url(#a-good)"/><text class="ts" x="355" y="340" text-anchor="middle">request, encrypted with the session key</text>
      <line class="e-good" x1="630" y1="372" x2="82" y2="372" marker-end="url(#a-good)"/><text class="ts" x="355" y="366" text-anchor="middle">response</text>
    </svg>