<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 230" role="img" aria-label="Isolating an unreachable service, from the source outward: is the app up and bound to the right interface (ss -ltnp, and curl from the box itself proves the app); then the firewall; then a test from the client; then a control test against a service known to work. Connection refused means nothing listens; a timeout means packets are dropped."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #2349a3; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #e7edf9; stroke: #2349a3; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #2349a3; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #2349a3; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #2349a3; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="230" fill="#ffffff"/>
      <rect class="n-acc" x="16" y="30" width="180" height="84" rx="6"/><text class="tb" x="28" y="54">1  The app itself</text><text class="ts" x="28" y="74">listening, on the right</text><text class="ts" x="28" y="90">interface? curl from the</text><text class="ts" x="28" y="106">box proves the app only</text>
      <rect class="n" x="220" y="30" width="180" height="84" rx="6"/><text class="tb" x="232" y="54">2  The firewall</text><text class="ts" x="232" y="74">host rules, security</text><text class="ts" x="232" y="90">groups, published ports</text>
      <rect class="n" x="424" y="30" width="180" height="84" rx="6"/><text class="tb" x="436" y="54">3  From the client</text><text class="ts" x="436" y="74">the same test from where</text><text class="ts" x="436" y="90">the user actually is</text>
      <rect class="n" x="628" y="30" width="176" height="84" rx="6"/><text class="tb" x="640" y="54">4  A control test</text><text class="ts" x="640" y="74">a service known to work,</text><text class="ts" x="640" y="90">along the same path</text>
      <line class="e" x1="197" y1="72" x2="218" y2="72" marker-end="url(#a)"/>
      <line class="e" x1="401" y1="72" x2="422" y2="72" marker-end="url(#a)"/>
      <line class="e" x1="605" y1="72" x2="626" y2="72" marker-end="url(#a)"/>
      <rect class="n-warn" x="16" y="140" width="390" height="74" rx="6"/><text class="tb" x="28" y="162">Connection refused</text><text class="ts" x="28" y="182">a packet arrived and was rejected: the path</text><text class="ts" x="28" y="198">works and nothing listens there. Look inside.</text>
      <rect class="n-bad" x="420" y="140" width="384" height="74" rx="6"/><text class="tb" x="432" y="162">Timeout</text><text class="ts" x="432" y="182">the packet vanished: a firewall, a frozen</text><text class="ts" x="432" y="198">process, a wrong route. Look along the path.</text>
    </svg>