<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 270" role="img" aria-label="Layers of a Python web service. gunicorn manages processes: one master, N workers. Each worker runs uvicorn, the ASGI server that owns the socket and the event loop. uvicorn calls your FastAPI app, built on Starlette, which provides Request and Response. Inside your code, an HTTP client such as requests or httpx calls other services. The ASGI contract is the line between the server and the app."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #2349a3; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #e7edf9; stroke: #2349a3; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #2349a3; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #2349a3; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #2349a3; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="270" fill="#ffffff"/>
      <rect class="n-soft" x="16" y="16" width="520" height="238" rx="8"/>
      <text class="tm tb" x="30" y="40">gunicorn</text><text class="ts" x="110" y="40">process manager: a master and N workers, restarts, drains</text>
      <rect class="n" x="36" y="54" width="480" height="186" rx="7"/>
      <text class="tm tb" x="50" y="78">uvicorn</text><text class="ts" x="122" y="78">the ASGI server: the socket and the event loop</text>
      <line class="rule-strong dash" x1="50" y1="94" x2="500" y2="94"/>
      <text class="tl" x="50" y="112">THE ASGI CONTRACT: async def app(scope, receive, send)</text>
      <rect class="n-acc" x="56" y="122" width="440" height="106" rx="6"/>
      <text class="tm tb" x="70" y="146">FastAPI</text><text class="ts" x="140" y="146">your routes, validation, dependencies</text>
      <text class="tm" x="70" y="168">Starlette</text><text class="ts" x="150" y="168">Request, Response, middleware, streaming</text>
      <rect class="n" x="70" y="180" width="412" height="36" rx="4"/>
      <text class="tm" x="82" y="203">httpx / requests</text><text class="ts" x="214" y="203">a client, inside your code, calling others</text>
      <text class="tb" x="560" y="40">You give the server your app,</text>
      <text class="tb" x="560" y="58">not the other way round.</text>
      <text class="ts" x="560" y="86">Any ASGI server runs any ASGI</text>
      <text class="ts" x="560" y="102">framework. WSGI is the older,</text>
      <text class="ts" x="560" y="118">synchronous contract; the two</text>
      <text class="ts" x="560" y="134">do not mix.</text>
      <text class="ts" x="560" y="166">uvicorn alone is production-ready</text>
      <text class="ts" x="560" y="182">now; gunicorn adds one process</text>
      <text class="ts" x="560" y="198">manager across WSGI and ASGI</text>
      <text class="ts" x="560" y="214">services, and a long track record.</text>
    </svg>