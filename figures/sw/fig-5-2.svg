<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 270" role="img" aria-label="Two timelines on one worker. Top: three requests each await the database; the loop interleaves them, and all finish in about the time of one wait. Bottom: one request makes a synchronous call; the loop cannot run anything else until it returns, so the other two requests, and the health check, wait behind it."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #2349a3; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #e7edf9; stroke: #2349a3; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #2349a3; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #2349a3; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #2349a3; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="270" fill="#ffffff"/>
      <text class="tb" x="16" y="24">Every wait is an await</text>
      <text class="ts" x="16" y="42">the loop runs other requests while one waits</text>
      <rect class="n-acc" x="160" y="56" width="24" height="22" rx="2"/><rect class="n-soft" x="184" y="56" width="240" height="22" rx="2"/><rect class="n-acc" x="424" y="56" width="24" height="22" rx="2"/>
      <rect class="n-acc" x="186" y="84" width="24" height="22" rx="2"/><rect class="n-soft" x="210" y="84" width="240" height="22" rx="2"/><rect class="n-acc" x="450" y="84" width="24" height="22" rx="2"/>
      <rect class="n-acc" x="212" y="112" width="24" height="22" rx="2"/><rect class="n-soft" x="236" y="112" width="240" height="22" rx="2"/><rect class="n-acc" x="476" y="112" width="24" height="22" rx="2"/>
      <text class="ts" x="16" y="72">request 1</text><text class="ts" x="16" y="100">request 2</text><text class="ts" x="16" y="128">request 3</text>
      <text class="ts" x="520" y="100">all three done in about one wait;</text>
      <text class="ts" x="520" y="116">the waiting costs no CPU</text>

      <line class="rule" x1="16" y1="150" x2="804" y2="150"/>
      <text class="tb tr" x="16" y="176">One synchronous call</text>
      <text class="ts" x="16" y="194">the loop is stuck until it returns</text>
      <rect class="n-bad" x="160" y="206" width="264" height="22" rx="2"/><text class="ts" x="292" y="222" text-anchor="middle">blocking call: nothing else runs</text>
      <rect class="n-warn" x="160" y="234" width="264" height="22" rx="2"/><text class="ts" x="292" y="250" text-anchor="middle">requests 2, 3 and /health wait</text>
      <rect class="n-acc" x="424" y="234" width="24" height="22" rx="2"/><rect class="n-acc" x="448" y="234" width="24" height="22" rx="2"/>
      <text class="ts" x="520" y="222">measured: /health took 4.8 s;</text>
      <text class="ts" x="520" y="238">the linter's async rules did not</text>
      <text class="ts" x="520" y="254">flag the SDK's synchronous client</text>
    </svg>