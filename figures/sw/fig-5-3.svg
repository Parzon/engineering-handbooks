<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" role="img" aria-label="The pre-fork model. The master process creates the socket, binds and listens once, then forks N workers that inherit it. Each worker calls accept, and the kernel hands each new connection to one of them. Each worker has its own event loop, its own memory and its own database connection pool, so connections multiply by the number of workers, and in-memory state differs per worker."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #2349a3; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #e7edf9; stroke: #2349a3; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #2349a3; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #2349a3; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #2349a3; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="260" fill="#ffffff"/>
      <rect class="n-acc" x="16" y="100" width="170" height="70" rx="6"/>
      <text class="tb" x="101" y="126" text-anchor="middle">Master process</text>
      <text class="ts" x="101" y="144" text-anchor="middle">bind and listen once,</text>
      <text class="ts" x="101" y="160" text-anchor="middle">then fork N workers</text>
      <rect class="n-soft" x="230" y="112" width="110" height="46" rx="5"/><text class="tb" x="285" y="132" text-anchor="middle">one socket</text><text class="ts" x="285" y="148" text-anchor="middle">:8010</text>
      <line class="e" x1="187" y1="135" x2="228" y2="135" marker-end="url(#a)"/>
      <rect class="n" x="400" y="20" width="200" height="66" rx="5"/><text class="tb" x="412" y="42">Worker 1</text><text class="ts" x="412" y="60">event loop, own memory,</text><text class="ts" x="412" y="76">own pool: 20 connections</text>
      <rect class="n" x="400" y="102" width="200" height="66" rx="5"/><text class="tb" x="412" y="124">Worker 2</text><text class="ts" x="412" y="142">event loop, own memory,</text><text class="ts" x="412" y="158">own pool: 20 connections</text>
      <rect class="n" x="400" y="184" width="200" height="66" rx="5"/><text class="tb" x="412" y="206">Worker N</text><text class="ts" x="412" y="224">one per usable CPU</text><text class="ts" x="412" y="240">read from the cgroup</text>
      <path class="e" d="M341,128 C370,128 370,53 398,53" marker-end="url(#a)"/>
      <line class="e" x1="341" y1="135" x2="398" y2="135" marker-end="url(#a)"/>
      <path class="e" d="M341,142 C370,142 370,217 398,217" marker-end="url(#a)"/>
      <text class="ts" x="370" y="96" text-anchor="middle">accept</text>
      <rect class="n-warn" x="630" y="40" width="174" height="96" rx="5"/>
      <text class="tb" x="642" y="62">State is per worker</text>
      <text class="ts" x="642" y="82">a dict cache differs in</text>
      <text class="ts" x="642" y="98">each; counters too. Shared</text>
      <text class="ts" x="642" y="114">state goes to a shared store</text>
      <rect class="n-warn" x="630" y="148" width="174" height="96" rx="5"/>
      <text class="tb" x="642" y="170">Connections multiply</text>
      <text class="ts" x="642" y="190">workers × pool × replicas</text>
      <text class="ts" x="642" y="206">must stay under the</text>
      <text class="ts" x="642" y="222">database's limit</text>
    </svg>