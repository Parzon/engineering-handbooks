<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 220" role="img" aria-label="pyproject.toml lists the direct dependencies you chose; uv lock resolves the whole graph into uv.lock with hashes, committed; uv sync --frozen installs exactly the lock into the virtual environment, failing rather than re-resolving; the image is built from that. Below: three tiers of Python dependencies: pure Python runs anywhere; wrappers around C libraries come as wheels per operating system and processor; wrappers that call external programs need the operating system's package manager."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
