<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 200" role="img" aria-label="Generating and applying are separate. Edit the model, a Python description of the schema. Autogenerate compares the models with a live database and writes a migration file, changing nothing. A person reads and fixes it: renames, data migrations, concurrent indexes. Upgrade runs the DDL and records the new revision. In CI, a check fails if the models changed without a migration."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #2349a3; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #e7edf9; stroke: #2349a3; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #2349a3; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #2349a3; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #2349a3; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="200" fill="#ffffff"/>
      <rect class="n" x="16" y="40" width="150" height="74" rx="5"/><text class="tb" x="28" y="62">1  Edit the model</text><text class="ts" x="28" y="82">a declaration only;</text><text class="ts" x="28" y="98">nothing changes yet</text>
      <rect class="n" x="190" y="40" width="150" height="74" rx="5"/><text class="tb" x="202" y="62">2  Autogenerate</text><text class="ts" x="202" y="82">diffs models against a</text><text class="ts" x="202" y="98">database; writes a file</text>
      <rect class="n-warn" x="364" y="40" width="150" height="74" rx="5"/><text class="tb" x="376" y="62">3  Read and fix it</text><text class="ts" x="376" y="82">renames, data, locks,</text><text class="ts" x="376" y="98">concurrent indexes</text>
      <rect class="n-acc" x="538" y="40" width="130" height="74" rx="5"/><text class="tb" x="550" y="62">4  Upgrade</text><text class="ts" x="550" y="82">runs the DDL once;</text><text class="ts" x="550" y="98">records the revision</text>
      <rect class="n-good" x="692" y="40" width="112" height="74" rx="5"/><text class="tb" x="704" y="62">5  CI check</text><text class="ts" x="704" y="82">models and</text><text class="ts" x="704" y="98">history agree</text>
      <line class="e" x1="167" y1="77" x2="188" y2="77" marker-end="url(#a)"/>
      <line class="e" x1="341" y1="77" x2="362" y2="77" marker-end="url(#a)"/>
      <line class="e" x1="515" y1="77" x2="536" y2="77" marker-end="url(#a)"/>
      <line class="e" x1="669" y1="77" x2="690" y2="77" marker-end="url(#a)"/>
      <text class="ts tr" x="364" y="140">The generator guesses from a diff:</text>
      <text class="ts" x="364" y="158">a rename looks like a drop plus an add, and the data is lost;</text>
      <text class="ts" x="364" y="176">data migrations are never generated; an index comes out as a blocking CREATE INDEX.</text>
    </svg>