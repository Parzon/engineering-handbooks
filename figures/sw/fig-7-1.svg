<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 240" role="img" aria-label="The connection budget. Each api replica runs 2 workers with a fixed pool of 20 connections, so 40 client connections per replica. PgBouncer accepts up to 500 client connections, which allows about 12 replicas, and multiplexes them onto 20 server connections to Postgres, which allows 100 by default."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #2349a3; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #e7edf9; stroke: #2349a3; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #2349a3; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #2349a3; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #2349a3; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="240" fill="#ffffff"/>
      <rect class="n" x="16" y="20" width="160" height="56" rx="5"/><text class="tb" x="28" y="42">api replica 1</text><text class="ts" x="28" y="62">2 workers × pool 20</text>
      <rect class="n" x="16" y="88" width="160" height="56" rx="5"/><text class="tb" x="28" y="110">api replica 2</text><text class="ts" x="28" y="130">2 workers × pool 20</text>
      <rect class="n-soft" x="16" y="156" width="160" height="56" rx="5"/><text class="tb" x="28" y="178">… up to about 12</text><text class="ts" x="28" y="198">40 connections each</text>
      <rect class="n-acc" x="300" y="70" width="190" height="100" rx="6"/><text class="tb" x="395" y="98" text-anchor="middle">PgBouncer</text><text class="ts" x="395" y="118" text-anchor="middle">transaction pooling</text><text class="ts" x="395" y="136" text-anchor="middle">up to 500 clients</text><text class="ts" x="395" y="152" text-anchor="middle">20 server connections</text>
      <rect class="n" x="620" y="80" width="184" height="80" rx="6"/><text class="tb" x="712" y="108" text-anchor="middle">Postgres</text><text class="ts" x="712" y="128" text-anchor="middle">100 connections by default,</text><text class="ts" x="712" y="144" text-anchor="middle">one process each</text>
      <path class="e" d="M177,48 C240,48 240,100 298,100" marker-end="url(#a)"/>
      <line class="e" x1="177" y1="116" x2="298" y2="116" marker-end="url(#a)"/>
      <path class="e" d="M177,184 C240,184 240,135 298,135" marker-end="url(#a)"/>
      <text class="ts" x="186" y="232">many client connections</text>
      <line class="e-acc" x1="491" y1="120" x2="618" y2="120" marker-end="url(#a-acc)"/>
      <text class="ts" x="555" y="112" text-anchor="middle">a few server</text><text class="ts" x="555" y="140" text-anchor="middle">connections</text>
      <text class="ts" x="300" y="210">replicas × workers × pool ≤ the pooler's client limit; the pooler's</text>
      <text class="ts" x="300" y="226">server pool ≤ Postgres' limit minus headroom for migrations and admins</text>
    </svg>