<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 304" role="img" aria-label="A metastable loop: bursty arrivals push the pool into overflow; overflow connections are discarded when returned; new connections must log in again, a SCRAM handshake of about 12.6 ms each; requests get slower; slower requests keep concurrency high, which keeps the pool in overflow. The fix: a fixed pool of 20 with no overflow. Logins fell from 196 to 5 in 20 seconds and p50 from 97 to 35 ms."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #2349a3; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #e7edf9; stroke: #2349a3; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #2349a3; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #2349a3; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #2349a3; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="304" fill="#ffffff"/>
      <rect class="n-warn" x="300" y="16" width="220" height="50" rx="6"/><text class="tb" x="410" y="38" text-anchor="middle">Bursty arrivals</text><text class="ts" x="410" y="56" text-anchor="middle">push the pool into overflow</text>
      <rect class="n" x="560" y="96" width="244" height="50" rx="6"/><text class="tb" x="682" y="118" text-anchor="middle">Overflow connections</text><text class="ts" x="682" y="136" text-anchor="middle">are discarded when returned</text>
      <rect class="n" x="300" y="176" width="220" height="50" rx="6"/><text class="tb" x="410" y="198" text-anchor="middle">New logins</text><text class="ts" x="410" y="216" text-anchor="middle">about 12.6 ms each</text>
      <rect class="n-bad" x="16" y="96" width="244" height="50" rx="6"/><text class="tb" x="138" y="118" text-anchor="middle">Slower requests</text><text class="ts" x="138" y="136" text-anchor="middle">keep concurrency high</text>
      <path class="e-bad" d="M521,41 C600,41 682,60 682,94" marker-end="url(#a-bad)"/>
      <path class="e-bad" d="M682,147 C682,190 600,201 522,201" marker-end="url(#a-bad)"/>
      <path class="e-bad" d="M299,201 C200,201 138,180 138,148" marker-end="url(#a-bad)"/>
      <path class="e-bad" d="M138,95 C138,60 220,41 298,41" marker-end="url(#a-bad)"/>
      <text class="ts tr tb" x="410" y="118" text-anchor="middle">the slow state</text>
      <text class="ts tr" x="410" y="134" text-anchor="middle">sustains itself</text>
      <rect class="n-good" x="16" y="244" width="250" height="50" rx="6"/><text class="tb" x="28" y="266">Fix: a fixed pool, 20, no overflow</text><text class="ts" x="28" y="284">logins 196 → 5; p50 97 → 35 ms</text>
    </svg>