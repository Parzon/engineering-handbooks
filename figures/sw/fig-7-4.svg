<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 220" role="img" aria-label="Two barriers. The request's session gives the principal and its teams; the application filters the query by those teams. In the same transaction it sets app.read_team_ids with set_config; Postgres' policy on alerts allows a row only when its team is in that list, or the caller is an org admin or the alert service. If the application forgets its filter, the policy still returns only permitted rows; with no context at all, no rows."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #2349a3; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #e7edf9; stroke: #2349a3; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #2349a3; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #2349a3; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #2349a3; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="220" fill="#ffffff"/>
      <rect class="n" x="16" y="40" width="150" height="70" rx="5"/><text class="tb" x="28" y="62">Session cookie</text><text class="ts" x="28" y="82">→ user and teams,</text><text class="ts" x="28" y="98">in one query</text>
      <rect class="n-acc" x="200" y="40" width="200" height="70" rx="5"/><text class="tb" x="212" y="62">Barrier 1: the app</text><text class="ts" x="212" y="82">filters by the caller's</text><text class="ts" x="212" y="98">teams; 404 otherwise</text>
      <rect class="n-acc" x="434" y="40" width="200" height="70" rx="5"/><text class="tb" x="446" y="62">Barrier 2: Postgres</text><text class="ts" x="446" y="82">policies read the</text><text class="ts" x="446" y="98">transaction's settings</text>
      <rect class="n-good" x="668" y="40" width="136" height="70" rx="5"/><text class="tb" x="680" y="62">Only the</text><text class="tb" x="680" y="80">caller's rows</text>
      <line class="e" x1="167" y1="75" x2="198" y2="75" marker-end="url(#a)"/>
      <line class="e" x1="401" y1="75" x2="432" y2="75" marker-end="url(#a)"/>
      <line class="e-good" x1="635" y1="75" x2="666" y2="75" marker-end="url(#a-good)"/>
      <text class="tm" x="434" y="134">set_config('app.read_team_ids', '{3,7}', true)</text>
      <rect class="n-warn" x="200" y="150" width="200" height="56" rx="5"/><text class="ts" x="212" y="172">a forgotten filter</text><text class="ts" x="212" y="190">in a new endpoint</text>
      <path class="e dash" d="M401,178 C420,178 420,100 432,100" marker-end="url(#a)"/>
      <text class="ts" x="434" y="186">is still filtered here: no leak</text>
      <text class="ts" x="434" y="204">and no context at all means no rows</text>
    </svg>