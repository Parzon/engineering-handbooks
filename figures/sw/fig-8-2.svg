<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" role="img" aria-label="Left, a server-side session: the cookie holds 32 random bytes; the database stores only their SHA-256; each request costs one lookup, which also loads the user and teams, with roles as of the last sign-in; signing out or revoking is a DELETE, effective at once. Right, a JWT as the session: self-contained, but it cannot be ended before it expires unless you keep a revocation list, which is a session table again; it carries the roles it was issued with; anyone holding it can read its claims; and it adds a signing key to guard and rotate."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #2349a3; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #e7edf9; stroke: #2349a3; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #2349a3; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #2349a3; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #2349a3; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="250" fill="#ffffff"/>
      <rect class="n-good" x="16" y="16" width="384" height="220" rx="6"/>
      <text class="tb" x="30" y="40">Server-side session (the reference)</text>
      <text class="ts" x="30" y="66">cookie: 32 random bytes, HttpOnly, Secure, SameSite=Lax</text>
      <text class="ts" x="30" y="86">database: only the token's SHA-256</text>
      <text class="ts" x="30" y="106">each request: one lookup, in the query it makes anyway</text>
      <text class="ts" x="30" y="126">roles: as of the last sign-in, read per request</text>
      <text class="ts tg tb" x="30" y="152">sign-out or revoke: a DELETE, effective at once</text>
      <text class="ts" x="30" y="178">ends after 12 hours, or 2 idle hours</text>
      <text class="ts" x="30" y="198">no salt needed: 256 random bits have</text>
      <text class="ts" x="30" y="214">nothing to guess, unlike a password</text>
      <rect class="n-warn" x="420" y="16" width="384" height="220" rx="6"/>
      <text class="tb" x="434" y="40">A JWT as the session</text>
      <text class="ts" x="434" y="66">saves one database read per request, but:</text>
      <text class="ts tr" x="434" y="92">cannot be ended before it expires,</text>
      <text class="ts" x="434" y="108">not even by signing out, without a list of</text>
      <text class="ts" x="434" y="124">revoked tokens: a session table again</text>
      <text class="ts" x="434" y="150">carries the roles it was issued with</text>
      <text class="ts" x="434" y="172">signed, not encrypted: anyone holding it</text>
      <text class="ts" x="434" y="188">can read its claims</text>
      <text class="ts" x="434" y="214">adds a signing key to guard and rotate</text>
    </svg>