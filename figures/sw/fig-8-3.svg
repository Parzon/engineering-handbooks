<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 230" role="img" aria-label="Roles are ranked per team: viewer reads and asks the assistant; responder also creates alerts; admin also deletes alerts and sees members; an org admin is admin in every team. They come from the provider's groups claim, such as team:payments:responder. A request for a resource: if the caller cannot see the team, answer 404; if their role is too low, 403; otherwise allow."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #2349a3; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #e7edf9; stroke: #2349a3; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #2349a3; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #2349a3; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #2349a3; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="230" fill="#ffffff"/>
      <rect class="n" x="16" y="30" width="110" height="44" rx="5"/><text class="tb" x="71" y="57" text-anchor="middle">viewer</text>
      <rect class="n" x="136" y="30" width="130" height="44" rx="5"/><text class="tb" x="201" y="57" text-anchor="middle">responder</text>
      <rect class="n" x="276" y="30" width="110" height="44" rx="5"/><text class="tb" x="331" y="57" text-anchor="middle">admin</text>
      <text class="ts" x="16" y="96">read, ask</text><text class="ts" x="136" y="96">+ create alerts</text><text class="ts" x="276" y="96">+ delete, members</text>
      <text class="ts" x="16" y="18">ranked per team: each can do everything below it</text>
      <text class="tm" x="16" y="128">groups: ["team:payments:responder", "org:admin"]</text>
      <text class="ts" x="16" y="148">replaced at every sign-in; users keyed by issuer + subject</text>

      <rect class="n-acc" x="440" y="20" width="160" height="44" rx="5"/><text class="ts" x="520" y="38" text-anchor="middle">Can the caller see</text><text class="ts" x="520" y="54" text-anchor="middle">the team at all?</text>
      <rect class="n-bad" x="660" y="20" width="144" height="44" rx="5"/><text class="tb" x="732" y="40" text-anchor="middle">404</text><text class="ts" x="732" y="56" text-anchor="middle">as if absent</text>
      <rect class="n-acc" x="440" y="100" width="160" height="44" rx="5"/><text class="ts" x="520" y="118" text-anchor="middle">Is the role high</text><text class="ts" x="520" y="134" text-anchor="middle">enough?</text>
      <rect class="n-warn" x="660" y="100" width="144" height="44" rx="5"/><text class="tb" x="732" y="120" text-anchor="middle">403</text><text class="ts" x="732" y="136" text-anchor="middle">role too low</text>
      <rect class="n-good" x="440" y="180" width="160" height="40" rx="5"/><text class="tb" x="520" y="205" text-anchor="middle">Allowed</text>
      <line class="e-bad" x1="601" y1="42" x2="658" y2="42" marker-end="url(#a-bad)"/><text class="ts" x="630" y="36" text-anchor="middle">no</text>
      <line class="e" x1="520" y1="65" x2="520" y2="98" marker-end="url(#a)"/><text class="ts" x="530" y="86">yes</text>
      <line class="e" x1="601" y1="122" x2="658" y2="122" marker-end="url(#a)"/><text class="ts" x="630" y="116" text-anchor="middle">no</text>
      <line class="e-good" x1="520" y1="145" x2="520" y2="178" marker-end="url(#a-good)"/><text class="ts" x="530" y="166">yes</text>
    </svg>