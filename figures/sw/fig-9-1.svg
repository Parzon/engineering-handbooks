<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" role="img" aria-label="Secrets by environment. Laptop: a .env made once from .env.example with every placeholder generated, readable only by its owner. CI: generated per run for throwaway stacks. A VM: generated at first boot, readable only by the deploy user; the model key and identity-provider secret typed in once. A managed platform: a secret store injecting environment variables at start. Never: Git, the image, logs, chats or tickets."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #2349a3; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #e7edf9; stroke: #2349a3; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #2349a3; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #2349a3; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #2349a3; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="250" fill="#ffffff"/>
      <rect class="n" x="16" y="20" width="186" height="96" rx="5"/><text class="tb" x="28" y="42">Laptop</text><text class="ts" x="28" y="62">.env made from the example,</text><text class="ts" x="28" y="78">every secret generated;</text><text class="ts" x="28" y="94">owner-only permissions</text>
      <rect class="n" x="218" y="20" width="186" height="96" rx="5"/><text class="tb" x="230" y="42">CI</text><text class="ts" x="230" y="62">generated per run for</text><text class="ts" x="230" y="78">a throwaway stack,</text><text class="ts" x="230" y="94">deleted afterwards</text>
      <rect class="n" x="420" y="20" width="186" height="96" rx="5"/><text class="tb" x="432" y="42">A VM</text><text class="ts" x="432" y="62">generated at first boot;</text><text class="ts" x="432" y="78">provider keys typed once;</text><text class="ts" x="432" y="94">deploy user only</text>
      <rect class="n-acc" x="622" y="20" width="182" height="96" rx="5"/><text class="tb" x="634" y="42">Managed platform</text><text class="ts" x="634" y="62">a secret store injects</text><text class="ts" x="634" y="78">them as environment</text><text class="ts" x="634" y="94">variables at start</text>
      <rect class="n-bad" x="16" y="140" width="788" height="44" rx="5"/><text class="tb tr" x="28" y="167">Never</text><text class="ts" x="80" y="167">in Git, in an image, in a log line, in a chat or a ticket. A secret that reached any of them is burned: rotate it.</text>
      <text class="ts" x="16" y="212">Typed in code as secrets, they print as asterisks; an empty webhook token disables the webhook rather than accepting anything;</text>
      <text class="ts" x="16" y="230">production refuses to start while any secret still has the example file's value.</text>
    </svg>