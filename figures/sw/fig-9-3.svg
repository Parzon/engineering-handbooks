<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" role="img" aria-label="Inside the service: accounts kept 365 days without a sign-in; sessions at most 12 hours; alerts 365 days; runbooks until deleted; the audit trail with ids and hashes but no text; questions and answers not stored; logs, traces and counters short-lived; backups the newest 14. Leaving the service: questions with the asker's visible alerts and runbook sections go to the model provider with credentials redacted, names and other text not; the sign-in goes to the identity provider; ids and timings go to telemetry."><style>text { font-family: "Archivo", Arial, Helvetica, sans-serif; fill: #1a1e23; font-size: 13px; }
.ts { font-size: 11.5px; fill: #48505a; }
.tm { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.tb { font-weight: 680; }
g.ts text { font-size: 11.5px; }
.tl { font-size: 10.5px; letter-spacing: 0.09em; fill: #6a727b; font-weight: 650; }
.ta { fill: #2349a3; }
.tg { fill: #2b7a3d; }
.tr { fill: #b3261e; }
.tw { fill: #965a00; }
.tmu { fill: #6a727b; }
.n { fill: #ffffff; stroke: #a6adb2; stroke-width: 1.2; }
.n-soft { fill: #eef0ed; stroke: #d8dcd9; stroke-width: 1; }
.n-acc { fill: #e7edf9; stroke: #2349a3; stroke-width: 1.4; }
.n-good { fill: #e4f2e6; stroke: #2b7a3d; stroke-width: 1.2; }
.n-bad { fill: #fae3e0; stroke: #b3261e; stroke-width: 1.2; }
.n-warn { fill: #fbf0dc; stroke: #965a00; stroke-width: 1.2; }
.zone { fill: none; stroke: #a6adb2; stroke-width: 1; stroke-dasharray: 4 4; }
.band { fill: #eef0ed; stroke: none; }
.rule { stroke: #d8dcd9; stroke-width: 1; fill: none; }
.rule-strong { stroke: #a6adb2; stroke-width: 1; fill: none; }
.e { fill: none; stroke: #6a727b; stroke-width: 1.4; }
.e-acc { fill: none; stroke: #2349a3; stroke-width: 1.8; }
.e-good { fill: none; stroke: #2b7a3d; stroke-width: 1.6; }
.e-bad { fill: none; stroke: #b3261e; stroke-width: 1.6; stroke-dasharray: 5 4; }
.dash { stroke-dasharray: 4 4; }
.m { fill: #6a727b; }
.m-acc { fill: #2349a3; }
.m-good { fill: #2b7a3d; }
.m-bad { fill: #b3261e; }
.dot-good { fill: #2b7a3d; }
.dot-bad { fill: #b3261e; }
.dot-muted { fill: #a6adb2; }
.fill-acc { fill: #2349a3; }
.fill-good { fill: #2b7a3d; }
.fill-bad { fill: #b3261e; }
.fill-surface { fill: #ffffff; }
.s1 { stroke: #2a78d6; fill: none; stroke-width: 2; }
.s2 { stroke: #eb6834; fill: none; stroke-width: 2; }
.s3 { stroke: #1baf7a; fill: none; stroke-width: 2; }
.f1 { fill: #2a78d6; }
.f2 { fill: #eb6834; }
.f3 { fill: #1baf7a; }
.ring { stroke: #ffffff; stroke-width: 2; }
.xhair { stroke: #48505a; stroke-width: 1; stroke-dasharray: 3 3; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="m-acc" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-good" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-good" d="M0,1 L10,5 L0,9 z"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="m-bad" d="M0,1 L10,5 L0,9 z"/></marker>
  </defs><rect width="820" height="300" fill="#ffffff"/>
      <rect class="zone" x="16" y="16" width="520" height="268" rx="8"/>
      <text class="tl" x="30" y="36">HELD BY THE SERVICE, WITH RETENTION</text>
      <text class="ts" x="30" y="62">accounts: until 365 days without a sign-in</text>
      <text class="ts" x="30" y="82">sessions: 12 hours at most</text>
      <text class="ts" x="30" y="102">alerts: 365 days (free text can name people)</text>
      <text class="ts" x="30" y="122">runbooks and their vectors: until a team admin deletes them</text>
      <text class="ts" x="30" y="142">audit trail: user ids, ids and hashes, never text; pruned by its owner</text>
      <text class="ts" x="30" y="162">access logs: rotated; traces: in memory, ids only</text>
      <text class="ts" x="30" y="182">rate-limit counters: 60 seconds</text>
      <text class="ts" x="30" y="202">backups: the newest 14 dumps</text>
      <rect class="n-good" x="30" y="220" width="300" height="30" rx="4"/><text class="ts tb" x="42" y="240">questions and answers: not stored</text>
      <text class="ts" x="30" y="272">placeholder retention periods, set by policy</text>

      <rect class="n-warn" x="580" y="30" width="224" height="80" rx="5"/><text class="tb" x="592" y="52">Model provider</text><text class="ts" x="592" y="72">questions, visible alerts and</text><text class="ts" x="592" y="88">runbook text; credentials</text><text class="ts" x="592" y="104">redacted, names are not</text>
      <rect class="n" x="580" y="124" width="224" height="60" rx="5"/><text class="tb" x="592" y="146">Identity provider</text><text class="ts" x="592" y="166">the sign-in itself</text>
      <rect class="n" x="580" y="198" width="224" height="60" rx="5"/><text class="tb" x="592" y="220">Telemetry backends</text><text class="ts" x="592" y="240">ids, counts, timings only</text>
      <line class="e" x1="537" y1="70" x2="578" y2="70" marker-end="url(#a)"/>
      <line class="e" x1="537" y1="154" x2="578" y2="154" marker-end="url(#a)"/>
      <line class="e" x1="537" y1="228" x2="578" y2="228" marker-end="url(#a)"/>
      <text class="tl" x="580" y="22">LEAVES THE SERVICE</text>
    </svg>